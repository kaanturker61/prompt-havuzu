async function openMarket() {
  openModal({ title: 'Marketplace', wide: true, html: '<p class="hint">Yükleniyor…</p>', noFocus: true });
  try { S.mk = await get('/api/marketplace/status'); $('#mBody').innerHTML = marketHtml(S.mk); } catch (e) { closeModal(); fail(e); }
}

async function mkReload() {
  try {
    S.mk = await get('/api/marketplace/status');
    const l = $('#mkList'); if (l) l.innerHTML = mkListHtml(S.mk);
    const c = $('#mkCmds'); if (c) c.innerHTML = mkCmdsHtml(S.mk);
    const s = $('#mkState'); if (s) s.textContent = S.mk.marketplaceExists ? 'marketplace.json mevcut: ' + (S.mk.marketplacePlugins.join(', ') || 'paket yok') : 'Henüz yazılmadı';
  } catch (e) { fail(e); }
  afterWrite();
}

function mkResultModal(r) {
  const list = (arr) => `<ul class="reslist">${arr.map((x) => `<li><span class="mono">${esc(x.source)}</span><div class="issue ${x.code === 'icerikBos' || x.code === 'hedefCakisiyor' ? 'error' : 'warn'}">${esc(x.reason)}</div></li>`).join('')}</ul>`;
  const sk = r.skipped || [];
  openModal({
    title: 'Yayın sonucu', wide: true,
    html: `<p>${r.done.length} dosya yayınlandı.</p>
      ${r.failed.length ? `<h3>Yayınlanamayanlar (${r.failed.length})</h3>${list(r.failed)}` : ''}
      ${sk.length ? `<h3>Atlananlar (${sk.length})</h3>${list(sk)}` : ''}
      <div class="foot"><button class="btn primary" data-act="close" autofocus>Tamam</button></div>`,
    onClose: () => { openMarket().then(() => { const b = $('#mBody [data-act="mk-publish-all"]'); if (b) b.focus(); }); }
  });
}

async function mkPublish(body, okMsg) {
  try {
    const r = await api('POST', '/api/marketplace/publish', body);
    const problem = r.failed.length || (r.skipped && r.skipped.length);
    if (!problem) toast(r.done.length ? r.done.length + ' dosya yayınlandı' : (okMsg || 'Yayınlanacak yeni bir şey yok'));
    await mkReload();
    if (problem) mkResultModal(r);
    const c = S.cur; if (c && c.tab === 'edit') { const r2 = await get('/api/file?' + qs({ path: c.path })); c.publish = r2.publish; const pp = $('#pubPill'); if (pp) pp.innerHTML = pubPill(); }
  } catch (e) { fail(e); }
}

/* ------------------------------------------------- kurulum durumu, marketplace seçici */
const ACTION_LABEL = { ayarlar: 'Ayarları aç', yeniMarketplace: 'Yeni marketplace', marketplaceSec: 'Marketplace seç', gitBaslat: "Git'i başlat" };

function issueButton(i) {
  if (i.action === 'ayarlar') return '<button class="btn sm" data-act="settings">' + ACTION_LABEL.ayarlar + '</button>';
  if (i.action === 'yeniMarketplace') return '<button class="btn sm primary" data-act="settings" data-section="new">' + ACTION_LABEL.yeniMarketplace + '</button>';
  if (i.action === 'marketplaceSec') return '<button class="btn sm primary" data-act="settings" data-section="mk">' + ACTION_LABEL.marketplaceSec + '</button>';
  if (i.action === 'gitBaslat') return `<button class="btn sm primary" data-act="mk-git-init" data-confirm data-name="${esc(S.info.activeMarketplace)}">${ACTION_LABEL.gitBaslat}</button>`;
  return '';
}

function renderSetup() {
  const st = S.info.setup;
  $('#main').innerHTML = `<div class="start"><h1 id="setupTitle" tabindex="-1">Kuruluma devam et</h1>
    <p>Promptlar, araç klasörünün dışındaki bir library kökünde, her marketplace ayrı bir git deposu olarak tutulur. Aşağıdaki sorunları gider.</p>
    <ul class="setup-list">${st.issues.map((i) => `<li><span class="pill ${i.level === 'error' ? 'bad' : 'warn'}">${i.level === 'error' ? 'Hata' : 'Uyarı'}</span><span class="msg">${esc(i.message)}</span>${issueButton(i)}</li>`).join('')}</ul>
    <p class="hint">Kurulum tamamlanana kadar Yeni prompt, İçe aktar, Git ve Marketplace düğmeleri kapalıdır. Ayarlar her zaman açıktır.</p>

}

function paintWarnBand() {
  const old = $('#warnBand'); if (old) old.remove();
  if (!setupOk() || S.warnHidden) return;
  const warns = S.info.setup.issues.filter((i) => i.level === 'warn');
  if (!warns.length) return;
  const band = document.createElement('div');
  band.id = 'warnBand'; band.className = 'warnband'; band.setAttribute('role', 'status');
  band.innerHTML = `<ul>${warns.map((i) => `<li><span class="pill warn">Uyarı</span> ${esc(i.message)} ${i.action === 'ayarlar' ? '<button class="link" data-act="settings">Ayarları aç</button>' : ''}</li>`).join('')}</ul><button class="btn sm ghost" data-act="warn-close" aria-label="Uyarıyı kapat">Kapat</button>`;

// Kurulum açıkken düğmeleri ve kenar çubuğunu duruma göre ayarlar.
function applySetupUi() {
  const ok = setupOk();
  const why = 'Kurulum tamamlanmadı: ' + firstError();
  $$('[data-needs-setup]').forEach((b) => {
    if (b.dataset.title0 === undefined) b.dataset.title0 = b.getAttribute('title') || '';
    b.disabled = !ok;
    if (ok) { if (b.dataset.title0) b.title = b.dataset.title0; else b.removeAttribute('title'); } else b.title = why;
  });
  ['q', 'fDurum', 'fTur', 'fScope'].forEach((id) => { const el = $('#' + id); if (el) el.disabled = !ok; });
  if (!ok) {
    $('#list').innerHTML = '<div class="empty">Kurulum tamamlanınca promptlar burada görünür.</div>';
    $('#listTitle').textContent = 'Promptlar';
    $('#tagbar').innerHTML = '';
    $('#gitBadge').hidden = true;
    $('#mkBadge').hidden = true;
  }
  const s = S.info;
  document.querySelector('.brand').title = s.activeMarketplace ? 'Marketplace: ' + s.activeMarketplace + (s.root ? ' — ' + s.root : '') : 'Marketplace seçilmedi';
}

function onSetupLost(setup) {
  S.info.setup = setup; S.info.root = null; S.info.isRepo = false;
  S.cur = null; S.results = null; S.tree = []; S.git = null;
  document.title = 'Prompt havuzu';
  applySetupUi(); renderSetup();
}

function paintMkSelect() {
  const sel = $('#mkSel'); const m = S.mkList;
  const ignored = m ? m.ignored.filter((i) => i.reason !== 'Araç reposu') : [];
  if (!m || (!m.items.length && !ignored.length)) { sel.hidden = true; return; }
  const active = m.active;
  sel.innerHTML = (active ? '' : '<option value="" selected disabled>Marketplace seç</option>')
    + m.items.map((i) => `<option value="${esc(i.name)}" ${i.name === active ? 'selected' : ''}>${esc(i.name)}${i.valid ? '' : ' (geçersiz)'}</option>`).join('')
    + (ignored.length ? `<optgroup label="Git deposu olmayan">${ignored.map((i) => `<option value="${esc(i.name)}" ${i.name === active ? 'selected' : ''}>${esc(i.name)}</option>`).join('')}</optgroup>` : '');
  sel.hidden = false;
}

async function loadMarketplaces() {
  try { S.mkList = await get('/api/marketplaces'); } catch (e) { S.mkList = null; }
  paintMkSelect();
}

function reloadWith(msg) {
  try { if (msg) sessionStorage.setItem('pp.flash', msg); } catch (e) { /* özel pencere */ }
  location.reload();
}

// Marketplace değiştirir: kaydedilmemiş düzenleme varsa sorar, sonra tam yeniden yükleme yapar.
async function switchMarketplace(name) {
  if (!(await confirmDiscard())) { paintMkSelect(); return false; }
  try { await api('POST', '/api/marketplaces/activate', { name }); } catch (e) { fail(e); paintMkSelect(); return false; }
  if (S.cur) S.cur.dirty = false;
  location.reload();
  return true;
}

async function mkGitInit(name, ask) {
  if (!name) return;
  const fromSettings = !$('#overlay').hidden && $('#mTitle').textContent === 'Ayarlar';
  if (ask) {
    const a = await askChoice({
      title: "Git'i başlat", text: name + ' klasöründe git başlatılacak, eksik iskelet dosyaları eklenecek. Var olan dosyalara dokunulmaz.',
      choices: [{ id: 'no', label: 'Vazgeç' }, { id: 'yes', label: "Git'i başlat", kind: 'primary' }]
    });
    if (a !== 'yes') { if (fromSettings) openSettings('mk'); return; }
  }
  try {
    const r = await api('POST', '/api/marketplaces/git-init', { name });
    if (name === S.info.activeMarketplace) reloadWith('Git başlatıldı: ' + name);
    else { toast('Git başlatıldı: ' + name); openSettings('mk'); }
    return r;
  } catch (e) { fail(e); if (fromSettings) openSettings('mk'); }
}

/* ------------------------------------------------------------------- ayarlar */
const ROOT_BAD = ['kokAyarlanmadi', 'kokYok', 'kokAracReposunda', 'gitBulunamadi'];

function mkRowHtml(i, kind) {
  const tool = kind === 'ignored' && i.reason === 'Araç reposu';
  const pills = [];
  if (kind === 'item') {
    if (i.active) pills.push('<span class="pill ok">etkin</span>');
    if (!i.valid) pills.push(`<span class="pill bad">geçersiz: ${esc(i.reason || '')}</span>`);
    if (!i.hasManifest) pills.push('<span class="pill warn">manifest yok</span>');
  } else pills.push(`<span class="pill ${tool ? '' : 'warn'}">${esc(i.reason)}</span>`);
  const btns = [];
  if (!tool && !i.active) btns.push(`<button type="button" class="btn sm" data-act="mk-activate" data-name="${esc(i.name)}">Etkinleştir</button>`);
  // Geçerli olmayan ama .git içeren klasörde sunucu git başlatmayı reddeder; yalnızca git deposu olmayanlarda göster.
  if (kind === 'ignored' && !tool) btns.push(`<button type="button" class="btn sm" data-act="mk-git-init" data-confirm data-name="${esc(i.name)}">Git'i başlat</button>`);
  return `<div class="mkrow ${tool ? 'dim' : ''}"><div><b>${esc(i.name)}</b> ${pills.join(' ')}<div class="hint mono">${esc(i.path)}</div></div><div></div><div class="mkbtns">${btns.join('')}</div></div>`;
}

function settingsHtml(s, m) {
  const rootBad = s.setup.issues.some((i) => ROOT_BAD.includes(i.code));
  const rootVal = s.libraryRoot || s.suggestedRoot || '';
  const hint = s.suggestedRootNote || (s.suggestedRoot && !s.libraryRoot ? 'Önerilen klasör: ' + s.suggestedRoot : 'Marketplace depoları bu klasörün altında tutulur. Araç klasörünün dışında olmalı.');
  const rows = m.items.map((i) => mkRowHtml(i, 'item')).concat(m.ignored.map((i) => mkRowHtml(i, 'ignored'))).join('');
  return `<div class="stack">
    <form class="stack" id="setRootForm" novalidate>
      <h3>Library kökü</h3>
      <label>Library kökü<input id="setRoot" value="${esc(rootVal)}" autocomplete="off" aria-describedby="setRootHint setRootErr"></label>
      <p class="hint" id="setRootHint" style="margin:0">${esc(hint)}</p>
      <p class="issue error" id="setRootErr" role="alert" style="margin:0" hidden></p>
      <div class="foot-left"><button class="btn primary">Kaydet</button><span class="hint">Ayar dosyası: <code>${esc(s.configPath)}</code></span></div>
    </form>
    <h3 id="setMkTitle" tabindex="-1">Marketplace'ler</h3>
    ${rows ? `<div class="mklist">${rows}</div>` : `<p class="hint">${rootBad ? 'Önce geçerli bir library kökü kaydet.' : 'Bu kökte henüz marketplace yok.'}</p>`}
    <details id="newMk" ${rootBad ? '' : 'open'}><summary>Yeni marketplace</summary>
      <form class="stack" id="newMkForm" style="margin-top:10px" novalidate>
        <fieldset class="fieldset-plain stack" ${rootBad ? 'disabled' : ''}>
          ${rootBad ? '<p class="hint" id="newMkOff">Önce geçerli bir library kökü kaydet.</p>' : ''}
          <label>Ad<input id="nmName" autocomplete="off" aria-describedby="nmSlug nmErr" placeholder="Örn. ornek-promptlar"></label>
          <p class="hint" id="nmSlug" style="margin:0"></p>
          <label>Açıklama<input id="nmDesc" autocomplete="off"></label>
          <label>Sahip<input id="nmOwner" autocomplete="off" placeholder="Boşsa sistem kullanıcısı kullanılır"></label>
          <p class="issue error" id="nmErr" role="alert" style="margin:0" hidden></p>
          <div class="foot-left"><button class="btn primary">Oluştur</button></div>
        </fieldset>
      </form>
    </details>
  </div>`;
}

function showFieldErr(id, msg) {
  const el = $('#' + id); if (!el) return;
  el.textContent = msg || ''; el.hidden = !msg;
}

async function saveRoot(create) {
  const val = $('#setRoot').value;
  showFieldErr('setRootErr', '');
  const before = { root: S.info.libraryRoot, active: S.info.activeMarketplace, ok: setupOk() };
  try {
    const r = await api('PUT', '/api/settings', { libraryRoot: val, create: !!create });
    toast('Library kökü kaydedildi');
    S.info = await get('/api/info');
    const changed = before.root !== S.info.libraryRoot || before.active !== S.info.activeMarketplace || before.ok !== setupOk();
    if (changed) reloadWith('Library kökü kaydedildi'); else openSettings();
    return r;
  } catch (e) {
    if (e.status === 404 && e.data && e.data.notFound) {
      const a = await askChoice({
        title: 'Klasör yok', text: 'Klasör yok: ' + val.trim() + '. Oluşturulsun mu?',
        choices: [{ id: 'no', label: 'Vazgeç' }, { id: 'yes', label: 'Oluştur', kind: 'primary' }]
      });
      if (a === 'yes') return saveRoot(true);
      openSettings();
      return;
    }
    if (e.data && e.data.code === 'kokAracReposunda') { showFieldErr('setRootErr', e.message); $('#setRoot').focus(); return; }
    showFieldErr('setRootErr', e.message); $('#setRoot').focus();
  }
}

async function createMarketplace() {
  const name = $('#nmName').value.trim();
  showFieldErr('nmErr', '');
  if (!/[\p{L}\p{N}]/u.test(name)) { showFieldErr('nmErr', 'Bir ad gir'); $('#nmName').focus(); return; }
  try {
    await api('POST', '/api/marketplaces', { name, description: $('#nmDesc').value.trim(), owner: $('#nmOwner').value.trim(), activate: true });
    reloadWith("Marketplace oluşturuldu. İlk commit'i Git panelinden atabilirsin.");
  } catch (e) { showFieldErr('nmErr', e.message); $('#nmName').focus(); }
}

async function openSettings(section) {
  let s; let m;
  try { [s, m] = await Promise.all([get('/api/settings'), get('/api/marketplaces')]); } catch (e) { fail(e); return; }
  openModal({
    title: 'Ayarlar', wide: true, html: settingsHtml(s, m), noFocus: true,
    onClose: () => { const b = $('.actions [data-act="settings"]'); if (b) b.focus(); },
    onMount: (b) => {
      $('#setRootForm', b).addEventListener('submit', (e) => { e.preventDefault(); saveRoot(false); });
      $('#newMkForm', b).addEventListener('submit', (e) => { e.preventDefault(); createMarketplace(); });
      $('#nmName', b).addEventListener('input', (e) => {
        const v = e.target.value;
        $('#nmSlug', b).textContent = /[\p{L}\p{N}]/u.test(v) ? 'Klasör adı: ' + FM.slug(v) : '';
      });
    }
  });
  let target = $('#setRoot');
  if (section === 'mk') target = $('#setMkTitle');
  else if (section === 'new') { const d = $('#newMk'); if (d) d.open = true; target = $('#nmName') && !$('#nmName').closest('fieldset').disabled ? $('#nmName') : $('#setRoot'); }
  if (target) { if (section === 'mk') target.scrollIntoView({ block: 'nearest' }); target.focus(); }
}

/* ------------------------------------------------------------- olay yönetimi */
document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act; const p = el.dataset.path;
  switch (act) {
    case 'close': closeModal(); break;
    case 'side': document.body.classList.toggle('side-open'); break;
    case 'toggle': S.expanded.has(p) ? S.expanded.delete(p) : S.expanded.add(p); saveExpanded(); renderList(); break;
    case 'open': await openFile(p); break;
    case 'open-close': closeModal(); await openFile(p); break;
    case 'menu': { ev.stopPropagation(); const r = el.getBoundingClientRect(); menuFor(p, el.dataset.type, r.left, r.bottom + 4); break; }
    case 'tab': setTab(el.dataset.tab); break;
    case 'save': await save(); break;
    case 'copy': await copyBody(); break;
    case 'bump': await openBump(); break;
    case 'chip-x': removeChip(el.dataset.key, el.dataset.val); break;
    case 'tag': { const t = el.dataset.tag; const i = S.f.tags.findIndex((x) => fold(x) === fold(t)); if (i >= 0) S.f.tags.splice(i, 1); else S.f.tags.push(t); renderFilters(); runSearch(); break; }
    case 'tags-all': S.tagsAll = !S.tagsAll; renderFilters(); break;
    case 'clear-filters': S.f = { q: '', tags: [], durum: '', tur: '', scope: S.f.scope }; $('#q').value = ''; $('#fDurum').value = ''; $('#fTur').value = ''; renderFilters(); runSearch(); break;
    case 'new-prompt': openNewPrompt(); break;
    case 'new-prompt-lib': openNewPrompt(S.libraryDir); break;
    case 'new-prompt-in': openNewPrompt(p); break;
    case 'new-dir-lib': await newDir(S.libraryDir); break;
    case 'new-dir': await newDir(p); break;
    case 'rename': await renameItem(p); break;
    case 'delete': await deleteItem(p); break;
    case 'import': openImport(); break;
    case 'show-folder': closeModal(); S.expanded.add(p); expandParents(p + '/x'); saveExpanded(); S.results = null; S.f = { q: '', tags: [], durum: '', tur: '', scope: S.f.scope }; $('#q').value = ''; $('#fDurum').value = ''; $('#fTur').value = ''; renderFilters(); renderList(); break;
    case 'hist-select': if (S.cur && S.cur.hist) { S.cur.hist.sel = el.dataset.hash; paintHist(); } break;
    case 'hist-load': await loadOldVersion(el.dataset.hash); break;
    case 'publish-now': { if (await save()) await mkPublishCurrent(); break; }
    case 'copy-text': { const ok = await copyText(el.dataset.text); toast(ok ? 'Kopyalandı' : 'Kopyalanamadı', ok ? 'ok' : 'error'); break; }
    case 'git': openGit(); break;
    case 'git-tab': el.dataset.tab === 'log' ? paintGitLog() : paintGit(); break;
    case 'mk-git-init': await mkGitInit(el.dataset.name, el.dataset.confirm !== undefined); break;
    case 'mk-activate': await switchMarketplace(el.dataset.name); break;
    case 'settings': openSettings(el.dataset.section); break;
    case 'warn-close': S.warnHidden = true; paintWarnBand(); break;
    case 'git-diff': await gitDiffFor(p); break;
    case 'git-selall': { S.gitSelTouched = true; const all = S.git.files.every((f) => S.gitSel.has(f.path)); S.gitSel = new Set(all ? [] : S.git.files.map((f) => f.path)); S.gitMsg = ($('#gMsg') || {}).value; paintGit(); break; }
    case 'git-identity': try { await api('POST', '/api/git/identity', { name: $('#gName').value, email: $('#gMail').value }); await loadGit(); toast('Kimlik kaydedildi'); S.gitMsg = ($('#gMsg') || {}).value; paintGit(); } catch (e) { fail(e); } break;
    case 'git-commit': await gitCommit(); break;
    case 'git-show': { $$('.commits li').forEach((x) => x.classList.toggle('on', x === el)); const box = $('#gDiff'); try { box.innerHTML = diffHtml((await get('/api/git/diff?' + qs({ hash: el.dataset.hash }))).diff); } catch (e) { box.textContent = e.message; } break; }
    case 'market': openMarket(); break;
    case 'mk-init': {
      ev.preventDefault();
      const f = new FormData($('#mkForm'));
      const verBox = $('#mkVerErr'); const verIn = $('#mkForm [name="version"]');
      const showVerErr = (msg) => { verBox.textContent = msg; verBox.hidden = false; verIn.setAttribute('aria-invalid', 'true'); verIn.focus(); };
      verBox.hidden = true; verBox.textContent = ''; verIn.removeAttribute('aria-invalid');
      const verErr = Rules.checkVersion(f.get('version'));
      if (verErr) { showVerErr(verErr); break; }
      try { const r = await api('POST', '/api/marketplace/init', { config: Object.fromEntries(f.entries()) }); S.info = await get('/api/info'); toast('Marketplace dosyaları yazıldı: ' + r.packages.join(', ')); await mkReload(); }
      catch (e) { if (e.status === 400 && e.data && e.data.field === 'version') showVerErr(e.message); else fail(e); }
      break;
    }
    case 'mk-publish': await mkPublish({ paths: [p] }); break;
    case 'mk-publish-all': await mkPublish({ all: true }, 'Hepsi zaten güncel'); break;
    case 'mk-unpublish': try { await api('POST', '/api/marketplace/unpublish', { target: el.dataset.target }); toast('Kaldırıldı (çöp kutusuna taşındı)'); await mkReload(); } catch (e) { fail(e); } break;
    default: break;
  }
});

async function mkPublishCurrent() {
  const c = S.cur; if (!c) return;
  try {
    const r = await api('POST', '/api/marketplace/publish', { paths: [c.path] });
    if (r.failed.length) { toast(r.failed[0].reason, 'error'); return; }
    if (r.skipped && r.skipped.length) { toast(r.skipped[0].reason, 'error'); return; }
    toast(r.done.length ? 'Yayınlandı: ' + r.done[0] : 'Zaten güncel');
    const r2 = await get('/api/file?' + qs({ path: c.path })); c.publish = r2.publish;
    const pp = $('#pubPill'); if (pp) pp.innerHTML = pubPill();
    const u = $('#pubUsage'); if (u && r2.publish) u.innerHTML = r2.publish.tur === 'ajan' ? `Ajan adı: <code>${esc(r2.publish.ad)}</code>` : `Claude Code'da çağır: <code>/${esc(r2.publish.paket)}:${esc(r2.publish.ad)}</code>`;
    afterWrite();
  } catch (e) { fail(e); }
}

document.addEventListener('contextmenu', (ev) => {
  const row = ev.target.closest('.row[data-path]');
  if (!row || row.dataset.path.startsWith('__')) return;
  ev.preventDefault();
  menuFor(row.dataset.path, row.classList.contains('dir') ? 'dir' : 'file', ev.clientX, ev.clientY);
});

document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.id === 'q') { S.f.q = t.value; runSearch(); return; }
  if (!S.cur) return;
  if (t.id === 'commitMsg') { S.cur.commitMsg = t.value; updateDirty(); return; }
  if (t.dataset && t.dataset.f) { setField(t.dataset.f, t.value); return; }
  if (t.id === 'fBody') {
    S.cur.parsed.body = S.cur.lead + t.value;
    autosize(t); updateDirty();
    $('#bodyInfo').innerHTML = bodyInfoText();
  } else if (t.id === 'fRaw') { autosize(t); updateDirty(); }
});

document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.id === 'mkSel') { switchMarketplace(t.value); return; }
  if (t.id === 'fDurum') { S.f.durum = t.value; runSearch(); }
  else if (t.id === 'fTur') { S.f.tur = t.value; runSearch(); }
  else if (t.id === 'fScope') { S.f.scope = t.checked ? 'all' : 'library'; runSearch(); }
  else if (t.dataset && t.dataset.gsel !== undefined) { S.gitSelTouched = true; t.checked ? S.gitSel.add(t.dataset.gsel) : S.gitSel.delete(t.dataset.gsel); }
  else if (t.dataset && t.dataset.f && S.cur) setField(t.dataset.f, t.value);
});

document.addEventListener('toggle', (ev) => { if (ev.target.id === 'pubBox') ls.set('pp.pubOpen', ev.target.open); }, true);

document.addEventListener('keydown', (ev) => {
  const t = ev.target;
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); save(); return; }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); document.body.classList.add('side-open'); $('#q').focus(); $('#q').select(); return; }
  if (ev.key === 'Enter' && t.id === 'commitMsg' && S.cur) { ev.preventDefault(); save(); return; }
  if (ev.key === 'Escape') { if (!$('#overlay').hidden) closeModal(); closeMenu(); if (t.id === 'q') t.blur(); return; }
  if (t.classList && t.classList.contains('chip-in') && S.cur) {
    const key = t.dataset.chipIn;
    if (ev.key === 'Enter' || ev.key === ',') { ev.preventDefault(); if (t.value.trim()) addChips(key, t.value, true); }
    else if (ev.key === 'Backspace' && !t.value) { const l = toList(FM.meta(S.cur.parsed)[key]); if (l.length) { removeChip(key, l[l.length - 1]); const i = $('[data-chip-in="' + key + '"]'); if (i) i.focus(); } }
    return;
  }
  if ((ev.key === 'Enter' || ev.key === ' ') && t.matches && t.matches('[role="treeitem"], .sect, .recent .res')) { ev.preventDefault(); t.click(); }
  if (ev.key === 'Tab' && t.id === 'fBody') { /* Tab ile odak ilerlesin; girinti için boşluk kullan */ }
});

document.addEventListener('focusout', (ev) => {
  const t = ev.target;
  if (S.cur && t.classList && t.classList.contains('chip-in') && t.value.trim()) addChips(t.dataset.chipIn, t.value, false);
});

$('#overlay').addEventListener('mousedown', (ev) => { if (ev.target.id === 'overlay') closeModal(); });

window.addEventListener('beforeunload', (ev) => { if (isDirty()) { ev.preventDefault(); ev.returnValue = ''; } });

window.addEventListener('focus', async () => {
  if (!S.info) return;
  if (!setupOk()) {
    // Kullanıcı sorunu dışarıdan gidermiş olabilir (örn. klasörü geri koymuş).
    try { const i = await get('/api/info'); if (i.setup.ok) location.reload(); } catch (e) { /* sessiz */ }
    return;
  }
  await refreshAll();
  const c = S.cur;
  if (c && !c.dirty) {
    try {
      const r = await get('/api/file?' + qs({ path: c.path }));
      if (r.mtime !== c.mtime) { await openFile(c.path, { reload: true, tab: c.tab }); toast('Dosya diskte değişmişti, yenilendi'); }
    } catch (e) { /* silinmiş olabilir */ }
  } else if (c && c.dirty) {
    try { const r = await get('/api/file?' + qs({ path: c.path })); if (r.mtime !== c.mtime && !c.external) { c.external = true; renderMainKeepEdits(); } } catch (e) { /* sessiz */ }
  }
});

function renderMainKeepEdits() { syncFromDom(); renderMain(); updateDirty(); }

/* ------------------------------------------------------------------ başlangıç */
async function init() {
  try { S.info = await get('/api/info'); } catch (e) { $('#main').innerHTML = '<div class="start"><h1>Sunucuya ulaşılamadı</h1><p>Terminalde <code>node tools/ui/server.js</code> komutunun çalıştığından emin ol, sonra sayfayı yenile.</p></div>'; return; }
  // Eski (marketplace'siz) anahtarlar bir kez silinir.
  try { localStorage.removeItem('pp.last'); localStorage.removeItem('pp.expanded'); } catch (e) { /* özel pencere */ }
  try { const f = sessionStorage.getItem('pp.flash'); if (f) { sessionStorage.removeItem('pp.flash'); toast(f, 'ok', 5000); } } catch (e) { /* özel pencere */ }
  S.expanded = new Set(ls.get(lsKey('expanded'), []));
  applySetupUi();
  loadMarketplaces();
  if (!setupOk()) { renderSetup(); return; }
  try { await Promise.all([loadTree(), loadFacets(), loadGit(), loadRecent()]); } catch (e) { if (e.setupRequired) return; throw e; }
  if (!S.info.gitAvailable) toast('Git bulunamadı. Geçmiş özellikleri çalışmaz; git kurup yeniden başlat.', 'error', 8000);
  if (localStorage.getItem(lsKey('expanded')) === null) {
    const lib = S.tree.find((n) => n.path === S.libraryDir);
    (function walk(ns, d) { ns.forEach((n) => { if (n.type === 'dir' && d < 2) { S.expanded.add(n.path); walk(n.children, d + 1); } }); })(lib ? lib.children : [], 0);
    saveExpanded();
  }
  renderFilters(); renderList();
  const last = ls.get(lsKey('last'), null);
  if (last) await openFile(last, { quiet: true }); else renderMain();
  if (!S.cur) renderMain();
}
init();
})();
</script>
