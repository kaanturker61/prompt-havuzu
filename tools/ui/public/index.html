<script>
(() => {
'use strict';

/* ---------------------------------------------------------------- yardımcılar */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fold = FM.fold;
const str = (v) => (Array.isArray(v) ? v.join(', ') : v == null ? '' : String(v));
const toList = (v) => (Array.isArray(v) ? v : String(v == null ? '' : v).split(',')).map((s) => String(s).trim()).filter(Boolean);
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* özel pencere */ } }
};
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const today = () => new Date().toLocaleDateString('sv-SE');
const fmtDate = (iso) => { try { return new Date(iso).toLocaleString('tr-TR', { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return iso; } };
const base = (p) => p.split('/').pop();
const stem = (p) => base(p).replace(/\.[^.]+$/, '');
const normTur = Rules.normTur;
const durumClass = (d) => { const f = fold(d || ''); return f === 'taslak' ? 'taslak' : f === 'kararli' ? 'kararli' : f === 'arsiv' ? 'arsiv' : ''; };

// Etkin marketplace gerektiren rotalar: bu isteklere X-PP-MP başlığı eklenir (başka sekmede geçiş yapıldıysa sunucu reddeder).
const MP_GUARDED = /^\/api\/(file|rename|mkdir|git\/|version|import\/|marketplace\/|package|prompts\/|history\/)/;
async function api(method, url, body) {
  const headers = { 'Content-Type': 'application/json', 'X-PP': '1' };
  if (S.info && S.info.activeMarketplace && MP_GUARDED.test(url)) headers['X-PP-MP'] = encodeURIComponent(S.info.activeMarketplace);
  const r = await fetch(url, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  let j = {}; try { j = await r.json(); } catch (e) { /* gövde yok */ }
  if (!r.ok) {
    const e = new Error(j.error || ('İstek başarısız (' + r.status + ')')); e.status = r.status; e.data = j;
    // Başka sekmede etkin marketplace değişti: yazma reddedildi; durumu eşle.
    if (r.status === 409 && j.code === 'etkinDegil') { e.etkinDegil = true; resyncActive(); }
    // Kurulum bozulduysa (örn. klasör dışarıdan silindi) kurulum ekranına düş; `conflict` 409'undan ayrı.
    if (r.status === 409 && j.setupRequired) { e.setupRequired = true; if (j.setup && S.info) onSetupLost(j.setup); }
    throw e;
  }
  return j;
}
const get = (u) => api('GET', u);
const qs = (o) => Object.keys(o).filter((k) => o[k] !== '' && o[k] != null && o[k] !== false).map((k) => k + '=' + encodeURIComponent(o[k])).join('&');

function toast(msg, kind, ms) {
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || 'ok');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  const d = ms || (kind === 'error' ? 7000 : 3000);
  setTimeout(() => t.classList.add('out'), d);
  setTimeout(() => t.remove(), d + 300);
}
const fail = (e) => { if (e && e.setupRequired) return; toast(e && e.message ? e.message : String(e), 'error'); };

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* eski tarayıcı */ }
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}

function hl(text, tokens) {
  if (!tokens.length) return esc(text);
  const f = fold(text); const marks = [];
  for (const t of tokens) { let i = 0; while ((i = f.indexOf(t, i)) >= 0) { marks.push([i, i + t.length]); i += t.length; } }
  if (!marks.length) return esc(text);
  marks.sort((a, b) => a[0] - b[0]);
  const merged = [marks[0]];
  for (const m of marks.slice(1)) { const l = merged[merged.length - 1]; if (m[0] <= l[1]) l[1] = Math.max(l[1], m[1]); else merged.push(m); }
  let out = ''; let pos = 0;
  for (const [a, b] of merged) { out += esc(text.slice(pos, a)) + '<mark>' + esc(text.slice(a, b)) + '</mark>'; pos = b; }
  return out + esc(text.slice(pos));
}

function autosize(el) { if (!el) return; el.style.height = 'auto'; el.style.height = Math.max(300, el.scrollHeight + 4) + 'px'; }

/* --------------------------------------------------------------------- durum */
const S = {
  info: null, lib: null, gen: 0, model: [], modelMap: new Map(),
  facets: { tags: [], durum: [], tur: [], projeler: [], total: 0, yayinUyari: 0, yayinUyariByMp: {} },
  exp: new Map(),         // mp -> Set<marketplace'e göreli yol | '#teknik' | '#gelen' | '#klasorsuz'>
  mpOpen: new Set(),      // açık marketplace düğümleri (pp.agac.marketplaceler)
  gitlessOpen: false,     // "Git deposu olmayan klasörler" grubu (pp.agac.gitsiz)
  sel: null,              // { mp, key } seçili ağaç düğümü
  focusKey: null,         // roving tabindex: odaktaki satır
  f: { q: '', tags: [], durum: '', tur: '', scope: 'library' },
  results: null, cur: null, git: null, tagsAll: false, recent: [], gitSel: null, mk: null,
  warnHidden: false
};

const setupOk = () => !!(S.info && S.info.setup && S.info.setup.ok);
const rootOk = () => !!(S.info && S.info.setup && S.info.setup.rootOk);
const activeName = () => (S.info && S.info.activeMarketplace) || '';
const firstError = () => { const i = S.info && S.info.setup && S.info.setup.issues.find((x) => x.level === 'error'); return i ? i.message : ''; };
// localStorage anahtarları marketplace'e göre ayrılır: pp.<mp>.<ad>
const lsKey = (k, mp) => 'pp.' + (mp !== undefined ? mp : (activeName() || '_')) + '.' + k;
const nodeKey = (mp, rel) => mp + ':' + rel;
const mpByName = (n) => (S.lib && S.lib.marketplaces.find((m) => m.name === n)) || null;
const activeMp = () => { const m = mpByName(activeName()); return m && m.state === 'hazir' ? m : null; };
const pluginsOf = (mp) => { const m = typeof mp === 'string' ? mpByName(mp) : mp; return m ? m.plugins : []; };
const libDirOf = (mp) => {
  const m = mpByName(mp || activeName());
  return (m && m.libraryDir) || (S.info && S.info.config && S.info.config.libraryDir) || 'library';
};
const pathSep = () => ((S.lib && S.lib.libraryRoot) || (S.info && S.info.libraryRoot) || '').includes('\\') ? '\\' : '/';

const isFiltering = () => !!(S.f.q.trim() || S.f.tags.length || S.f.durum || S.f.tur);

// Açık düğümler. Eski "__others" girdisi bir kez "#teknik"e çevrilir.
function expOf(mp) {
  let s = S.exp.get(mp);
  if (!s) {
    const raw = ls.get(lsKey('expanded', mp), null);
    s = new Set(Array.isArray(raw) ? raw : []);
    if (s.has('__others')) { s.delete('__others'); s.add('#teknik'); ls.set(lsKey('expanded', mp), Array.from(s)); }
    S.exp.set(mp, s);
  }
  return s;
}
const saveExp = (mp) => ls.set(lsKey('expanded', mp), Array.from(expOf(mp)));
const saveMpOpen = () => ls.set('pp.agac.marketplaceler', Array.from(S.mpOpen));

// İlk açılışta (kayıt yokken) etkin marketplace ve plugin'leri açılır.
function initExpansion() {
  const stored = ls.get('pp.agac.marketplaceler', null);
  if (Array.isArray(stored)) S.mpOpen = new Set(stored);
  else { S.mpOpen = new Set(activeName() ? [activeName()] : []); saveMpOpen(); }
  S.gitlessOpen = !!ls.get('pp.agac.gitsiz', false);
  ensureDefaultExp(activeName());
}
function ensureDefaultExp(name) {
  const m = mpByName(name);
  if (!m || m.state !== 'hazir') return;
  let has = null; try { has = localStorage.getItem(lsKey('expanded', name)); } catch (e) { has = ''; }
  if (has !== null) return;
  const ex = expOf(name);
  m.plugins.forEach((p) => ex.add(p.path));
  saveExp(name);
}

/* ------------------------------------------------------------------- yükleme */
async function loadLibrary() { S.lib = await get('/api/tree'); }
async function loadFacets() { S.facets = await get('/api/facets'); renderMkBadge(); }
function renderMkBadge() {
  const b = $('#mkBadge'); if (!b) return;
  const n = (S.facets && S.facets.yayinUyariByMp && S.facets.yayinUyariByMp[activeName()]) || 0;
  b.hidden = !n || !setupOk(); b.textContent = n;
  b.title = n + ' prompt yayınlanmayacak';
}
async function loadGit() {
  const gen = S.gen;
  if (!setupOk()) { S.git = { isRepo: false, error: firstError() }; renderGitBadge(); return S.git; }
  let g;
  try { g = await get('/api/git/status'); } catch (e) { g = { isRepo: false, error: e.message }; }
  if (gen !== S.gen) return S.git;
  S.git = g;
  renderGitBadge();
  syncCommitBar();
  return S.git;
}
// Git durumu değişince commit çubuğunu, +1 ve Kaydet düğmelerini günceller.
function syncCommitBar() {
  if (!S.cur) return;
  const repo = !!(S.git && S.git.isRepo);
  const bar = $('#commitBar'); if (bar) bar.hidden = !repo;
  const b = $('#btnBump'); if (b) b.disabled = !repo;
  updateDirty();
}
async function loadRecent() { try { S.recent = (await get('/api/search?q=')).results.slice(0, 8); } catch (e) { S.recent = []; } }

async function refreshAll() {
  if (!rootOk()) return;
  const gen = S.gen;
  await Promise.all([loadLibrary(), loadFacets(), loadGit(), loadRecent()]);
  if (gen !== S.gen) return;
  renderFilters(); renderList();
  if (isFiltering()) runSearch();
  if (!S.cur) renderMain();
}

/* -------------------------------------------------------------- sol kenar çubuğu */
function renderFilters() {
  const tags = S.facets.tags;
  const shown = S.tagsAll ? tags : tags.slice(0, 14);
  let h = shown.map((t) => `<button class="tagbtn ${S.f.tags.some((x) => fold(x) === fold(t.name)) ? 'on' : ''}" data-act="tag" data-tag="${esc(t.name)}">${esc(t.name)}<span class="n">${t.count}</span></button>`).join('');
  if (tags.length > 14) h += `<button class="tagbtn" data-act="tags-all">${S.tagsAll ? 'Daha az göster' : 'Tüm etiketler (' + tags.length + ')'}</button>`;
  $('#tagbar').innerHTML = h;
  const opt = (arr) => arr.map((x) => `<option value="${esc(x)}">`).join('');
  $('#dl-etiketler').innerHTML = opt(tags.map((t) => t.name));
  $('#dl-projeler').innerHTML = opt((S.facets.projeler || []).map((t) => t.name));
  const m = activeMp();
  $('#dl-paket').innerHTML = opt(pluginsOf(m).map((p) => p.slug).concat(m && m.defaultPlugin ? [m.defaultPlugin] : (S.info && S.info.config ? [S.info.config.marketplace.plugin] : [])));
}

const SVG = (inner, cls) => `<svg class="ic ${cls || ''}" viewBox="0 0 16 16" aria-hidden="true" focusable="false">${inner}</svg>`;
const ICON = {
  mp: SVG('<ellipse cx="8" cy="4" rx="5" ry="2"/><path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/>'),
  plugin: SVG('<path d="M2 5l6-3 6 3v6l-6 3-6-3zM2 5l6 3 6-3M8 8v6"/>'),
  dir: SVG('<path d="M2 4h4l1.5 1.5H14V12H2z"/>'),
  loose: SVG('<path class="dash" d="M2 5l6-3 6 3v6l-6 3-6-3zM2 5l6 3 6-3M8 8v6"/>'),
  inbox: SVG('<path d="M2 9l2-5h8l2 5v3H2zM2 9h4l1 2h2l1-2h4"/>'),
  tech: SVG('<circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/>'),
  warn: SVG('<path d="M8 2l6.5 11.5h-13zM8 6.5v3.2M8 11.4v.3"/>'),
  gitless: SVG('<ellipse cx="8" cy="4" rx="5" ry="2"/><path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4"/>')
};

// Ağacı düz bir görünür listeye çevirir (roving tabindex ve klavye gezintisi bunu kullanır).
function treeModel() {
  const out = [];
  const lib = S.lib; if (!lib) return out;
  const add = (it, parentKey, level, i, n) => { it.parentKey = parentKey; it.level = level; it.posinset = i + 1; it.setsize = n; out.push(it); return it; };
  const nodes = (list, mp, level, parentKey, tech) => {
    list.forEach((nd, i) => {
      if (nd.type === 'dir') {
        const open = expOf(mp).has(nd.path);
        const it = add({ kind: tech ? 'tdir' : 'dir', mp, path: nd.path, key: nodeKey(mp, nd.path), ek: nd.path, node: nd, expandable: nd.children.length > 0, expanded: open }, parentKey, level, i, list.length);
        if (open && nd.children.length) nodes(nd.children, mp, level + 1, it.key, tech);
      } else {
        add({ kind: tech ? 'tfile' : 'file', mp, path: nd.path, key: nodeKey(mp, nd.path), node: nd, expandable: false }, parentKey, level, i, list.length);
      }
    });
  };
  const mps = lib.marketplaces; const gl = lib.ignored || [];
  const top = mps.length + (gl.length ? 1 : 0);
  mps.forEach((m, mi) => {
    const mOpen = m.state === 'hazir' && S.mpOpen.has(m.name);
    const mit = add({ kind: 'mp', mp: m.name, path: '', key: nodeKey(m.name, ''), node: m, expandable: m.state === 'hazir', expanded: mOpen }, null, 1, mi, top);
    if (!mOpen) return;
    const ex = expOf(m.name);
    const kids = m.plugins.map((p) => ({ kind: 'plugin', node: p }));
    if (m.inbox) kids.push({ kind: 'inbox', node: m.inbox });
    if (m.loose.length) kids.push({ kind: 'loose', node: m.loose });
    if (m.teknik.length) kids.push({ kind: 'teknik', node: m.teknik });
    kids.forEach((k, ki) => {
      const nd = k.node;
      if (k.kind === 'plugin') {
        const open = ex.has(nd.path);
        const it = add({ kind: 'plugin', mp: m.name, path: nd.path, key: nodeKey(m.name, nd.path), ek: nd.path, node: nd, expandable: nd.children.length > 0, expanded: open }, mit.key, 2, ki, kids.length);
        if (open) nodes(nd.children, m.name, 3, it.key, false);
      } else {
        const ek = k.kind === 'inbox' ? '#gelen' : k.kind === 'loose' ? '#klasorsuz' : '#teknik';
        const kids2 = k.kind === 'inbox' ? nd.children : nd;
        const open = ex.has(ek);
        const it = add({ kind: k.kind, mp: m.name, path: k.kind === 'inbox' ? nd.path : '', key: nodeKey(m.name, ek), ek, node: nd, list: kids2, expandable: kids2.length > 0, expanded: open }, mit.key, 2, ki, kids.length);
        if (open) nodes(kids2, m.name, 3, it.key, k.kind === 'teknik');
      }
    });
    if (!m.libraryDirExists) out.push({ kind: 'note', key: nodeKey(m.name, '#not'), mp: m.name, level: 2, text: 'Prompt klasörü yok (' + m.libraryDir + '/).' });
    else if (!m.plugins.length) out.push({ kind: 'note', key: nodeKey(m.name, '#not'), mp: m.name, level: 2, text: 'Henüz plugin yok.', action: 'new-plugin', actionLabel: 'Yeni plugin' });
  });
  if (gl.length) {
    const open = S.gitlessOpen;
    const git = add({ kind: 'gitless', mp: '', path: '', key: 'gitsiz', node: gl, expandable: true, expanded: open }, null, 1, mps.length, top);
    if (open) gl.forEach((g, i) => add({ kind: 'gitlessItem', mp: '', path: g.name, key: 'gitsiz:' + g.name, node: g, expandable: false }, git.key, 2, i, gl.length));
  }
  return out;
}

const isFileKind = (k) => k === 'file' || k === 'tfile';

function rowHtml(it, focusKey) {
  const d = it.level - 1;
  if (it.kind === 'note') {
    return `<div class="empty note" style="--d:${d}" data-note>${esc(it.text)}${it.action ? ` <button class="btn sm" data-act="${it.action}" data-mp="${esc(it.mp)}">${esc(it.actionLabel)}</button>` : ''}</div>`;
  }
  const cur = S.cur && isFileKind(it.kind) && S.cur.mp === it.mp && S.cur.path === it.path;
  const selected = cur || (S.sel && S.sel.key === it.key);
  const isEtkin = it.kind === 'mp' && it.node.active;
  let icon = ICON[it.kind] || ''; let label = ''; let pills = ''; let sr = ''; let acts = ''; let cls = '';
  const btn = (act, txt, aria) => `<button class="${act === 'plus' ? 'plus' : 'more'}" data-act="${act}" data-key="${esc(it.key)}" tabindex="-1" aria-label="${esc(aria)}">${txt}</button>`;
  const cnt = (n) => `<span class="cnt">${n}</span>`;
  switch (it.kind) {
    case 'mp': {
      const m = it.node; const bad = m.state !== 'hazir';
      label = esc(m.name); cls = ' mp' + (isEtkin ? ' etkin' : '');
      pills = (isEtkin ? '<span class="pill ok">etkin</span>' : '') + (bad ? `<span class="pill bad">geçersiz: ${esc(m.reason || '')}</span>` : cnt(m.count))
        + (m.yayinUyari ? `<span class="pill warn" title="${m.yayinUyari} prompt yayınlanmayacak">${m.yayinUyari} uyarı</span>` : '');
      sr = ', marketplace' + (isEtkin ? ', etkin marketplace' : '');
      if (!bad) acts += btn('plus', '+', m.name + ' için yeni plugin');
      acts += btn('menu', '⋯', m.name + ' için işlemler');
      break;
    }
    case 'plugin': {
      const p = it.node; label = esc(p.name);
      pills = cnt(p.count);
      if (p.nameIssue) pills += p.nameIssue.level === 'error' ? `<span class="pill bad" title="${esc(p.nameIssue.message)}">!</span>` : `<span class="pill" title="${esc(p.nameIssue.message)}">${esc(p.nameIssue.message.toLowerCase())}</span>`;
      sr = ', plugin';
      acts += btn('plus', '+', p.name + ' içine yeni prompt') + btn('menu', '⋯', p.name + ' için işlemler');
      break;
    }
    case 'dir': label = esc(it.node.name); pills = cnt(it.node.count); acts = btn('menu', '⋯', it.node.name + ' için işlemler'); sr = ', klasör'; break;
    case 'tdir': label = esc(it.node.name); sr = ', klasör'; icon = ICON.dir; break;
    case 'inbox': label = 'Gelen kutusu'; pills = cnt(it.node.count); acts = btn('menu', '⋯', 'Gelen kutusu için işlemler'); break;
    case 'loose': label = 'Klasörsüz promptlar'; pills = cnt(it.node.length);
      break;
    case 'teknik': label = 'Teknik dosyalar'; cls = ' soft'; break;
    case 'gitless': label = 'Git deposu olmayan klasörler (' + it.node.length + ')'; icon = ICON.warn; cls = ' soft'; break;
    case 'gitlessItem': label = esc(it.node.name); pills = '<span class="pill warn">Git deposu değil</span>'; icon = ICON.gitless; cls = ' soft';
      acts = `<button class="btn sm" data-act="mk-git-init" data-confirm data-name="${esc(it.node.name)}" tabindex="-1">Git'i başlat</button>`; break;
    case 'tfile': label = esc(it.node.name); icon = ''; cls = ' soft'; acts = btn('menu', '⋯', it.node.name + ' için işlemler'); break;
    default: { // file
      const m = it.node.meta; const txt = m && m.baslik ? m.baslik : it.node.name;
      label = esc(txt);
      icon = `<span class="dot ${m ? durumClass(m.durum) : ''}"></span>`;
      pills = (m && m.tur ? `<span class="pill">${esc(m.tur)}</span>` : '')
        + (m && m.uyari ? '<span class="pill warn" title="Yayınlanmayacak, ayrıntı için aç" aria-label="Yayın uyarısı">!</span>' : '')
        + (m && m.surum ? '<span class="pill warn" title="Son sürümden beri değişti, versiyon aynı" aria-label="Sürüm uyarısı">v</span>' : '')
        + (m && m.paketUyusmuyor ? '<span class="pill warn" title="paket alanı klasörle uyuşmuyor" aria-label="Paket klasörle uyuşmuyor">p</span>' : '');
      acts = btn('menu', '⋯', txt + ' için işlemler');
    }
  }
  if (it.kind === 'loose') acts = '';
  const caret = it.expandable ? `<span class="caret ${it.expanded ? 'open' : ''}"></span>` : '<span class="caret" style="visibility:hidden"></span>';
  const title = it.kind === 'loose' ? `Yayında "${(it.mpNode && it.mpNode.defaultPlugin) || (mpByName(it.mp) || {}).defaultPlugin || ''}" plugin'ine gider.`
    : isFileKind(it.kind) ? it.path : it.kind === 'plugin' ? (it.node.description || it.node.name) : '';
  return `<div class="row ${it.kind}${cls}${cur ? ' active' : ''}" role="treeitem" data-key="${esc(it.key)}" data-act="node" tabindex="${it.key === focusKey ? 0 : -1}"
    aria-level="${it.level}" aria-posinset="${it.posinset}" aria-setsize="${it.setsize}" ${it.expandable ? `aria-expanded="${it.expanded}"` : ''} ${selected ? 'aria-selected="true"' : ''}
    style="--d:${d}" ${title ? `title="${esc(title)}"` : ''}>${it.expandable || it.level > 1 ? caret : caret}${icon}<span class="name">${label}${sr ? `<span class="sr">${esc(sr)}</span>` : ''}</span>${pills}${acts ? `<span class="acts">${acts}</span>` : ''}</div>`;
}

function treeHtml() {
  S.model = treeModel();
  S.modelMap = new Map(S.model.filter((x) => x.kind !== 'note').map((x) => [x.key, x]));
  if (!S.lib) return '<div class="empty">Yükleniyor…</div>';
  if (!S.lib.marketplaces.length && !(S.lib.ignored || []).length) {
    return '<div class="empty">Henüz marketplace yok.<br><button class="btn sm primary" data-act="new-mp" style="margin-top:8px">Yeni marketplace</button></div>';
  }
  let fk = S.focusKey;
  if (!fk || !S.modelMap.has(fk)) { const f = S.model.find((x) => x.kind !== 'note'); fk = f ? f.key : null; S.focusKey = fk; }
  return S.model.map((it) => rowHtml(it, fk)).join('');
}

const whereOf = (r) => (r.kind === 'paket' ? r.plugin : r.kind === 'klasorsuz' ? 'Klasörsüz' : r.kind === 'gelenKutusu' ? 'Gelen kutusu' : (r.path.split('/').slice(0, -1).join('/') || 'Teknik'));

function resultsHtml() {
  const tokens = fold(S.f.q).split(/\s+/).filter(Boolean);
  if (!S.results.length) return '<div class="empty">Eşleşen prompt yok. Filtreleri veya arama sözcüklerini değiştir.</div>';
  return S.results.map((r, i) => {
    const act = S.cur && S.cur.mp === r.mp && S.cur.path === r.path;
    return `<div class="res ${act ? 'active' : ''}" role="listitem" tabindex="0" data-act="open" data-mp="${esc(r.mp)}" data-path="${esc(r.path)}" data-ri="${i}" ${act ? 'aria-selected="true"' : ''}>
    <div class="rt"><span class="dot ${durumClass(r.durum)}"></span><span>${hl(r.baslik, tokens)}</span>${r.tur ? `<span class="pill">${esc(r.tur)}</span>` : ''}</div>
    <div class="rp">${esc(r.mp)} › ${esc(whereOf(r))} › ${esc(base(r.path))}</div>
    ${r.snippet ? `<div class="rs">${hl(r.snippet, tokens)}</div>` : ''}
    ${r.etiketler.length ? `<div class="rtags">${r.etiketler.map((t) => `<span class="pill">${esc(t)}</span>`).join('')}</div>` : ''}</div>`;
  }).join('');
}

// Araç çubuğu düğmelerinin açık/kapalı durumu ve nedeni.
function paintToolbar() {
  const rok = rootOk(); const m = activeMp(); const ok = setupOk();
  const set = (id, why, off) => {
    const b = $('#' + id); const w = $('#why-' + id.slice(2).toLowerCase());
    if (!b) return;
    b.disabled = off;
    if (w) w.textContent = off ? why : '';
    b.title = off ? why : (id === 'tbPlugin' ? 'Yeni plugin: ' + activeName() : id === 'tbPrompt' ? 'Yeni prompt: ' + activeName() : 'Yeni marketplace');
  };
  set('tbMp', 'Library kökü hazır değil: önce Ayarlar\'dan kökü seç', !rok);
  set('tbPlugin', !rok ? 'Library kökü hazır değil' : 'Önce bir marketplace seç', !(ok && m));
  set('tbPrompt', !(ok && m) ? 'Önce bir marketplace seç' : 'Önce bir plugin oluştur', !(ok && m && m.plugins.length));
}

function renderList() {
  const list = $('#list');
  const hadFocus = list.contains(document.activeElement) && document.activeElement.closest('[data-key],[data-ri]');
  const fk = hadFocus ? (hadFocus.dataset.key || null) : null; const fri = hadFocus ? hadFocus.dataset.ri : null;
  if (S.results) {
    list.setAttribute('role', 'list'); list.setAttribute('aria-label', 'Arama sonuçları');
    list.innerHTML = resultsHtml();
    const n = new Set(S.results.map((r) => r.mp)).size;
    $('#listTitle').textContent = 'Sonuçlar (' + S.results.length + ')' + (n > 1 ? ' · ' + n + ' marketplace' : '');
    if (fri != null) { const el = list.querySelector('[data-ri="' + fri + '"]'); if (el) el.focus(); }
  } else {
    list.setAttribute('role', 'tree'); list.setAttribute('aria-label', 'Kütüphane');
    list.innerHTML = treeHtml();
    $('#listTitle').textContent = 'Kütüphane (' + (S.facets.total || 0) + ')';
    if (fk) { const el = rowEl(fk); if (el) el.focus(); }
  }
  $('#btnClear').hidden = !isFiltering();
  paintToolbar();
}

const rowEl = (key) => $$('#list [data-key]').find((e) => e.dataset.key === key) || null;

const runSearch = debounce(async () => {
  if (!isFiltering()) { S.results = null; renderList(); return; }
  try {
    S.results = (await get('/api/search?' + qs({ q: S.f.q, tags: S.f.tags.join(','), durum: S.f.durum, tur: S.f.tur, scope: S.f.scope }))).results;
  } catch (e) { fail(e); }
  renderList();
}, 140);

// Bir dosyanın ağaçta görünmesi için üst düğümleri açar.
function expandParents(p, mp) {
  mp = mp || activeName();
  const ex = expOf(mp);
  S.mpOpen.add(mp);
  const cl = Rules.classifyPromptPath(p, libDirOf(mp));
  if (cl.kind === 'klasorsuz') ex.add('#klasorsuz');
  else if (cl.kind === 'gelenKutusu') ex.add('#gelen');
  else if (cl.kind === 'disarida') ex.add('#teknik');
  const parts = p.split('/'); let acc = '';
  for (let i = 0; i < parts.length - 1; i++) { acc = acc ? acc + '/' + parts[i] : parts[i]; ex.add(acc); }
  saveExp(mp); saveMpOpen();
}

// Düğümü seçer, görünür yapar ve odağı ona taşır.
function focusKey(key) {
  S.focusKey = key;
  document.body.classList.add('side-open');
  S.results = null; renderList();
  const el = rowEl(key); if (el) { el.focus(); el.scrollIntoView({ block: 'nearest' }); }
}

function toggleItem(it) {
  if (it.kind === 'mp') { S.mpOpen.has(it.mp) ? S.mpOpen.delete(it.mp) : S.mpOpen.add(it.mp); saveMpOpen(); return; }
  if (it.kind === 'gitless') { S.gitlessOpen = !S.gitlessOpen; ls.set('pp.agac.gitsiz', S.gitlessOpen); return; }
  const ex = expOf(it.mp);
  ex.has(it.ek) ? ex.delete(it.ek) : ex.add(it.ek);
  saveExp(it.mp);
}
function setExpanded(it, open) {
  if (!it.expandable || it.expanded === open) return false;
  toggleItem(it); return true;
}

/* ------------------------------------------------------------------ modal'lar */
let modalState = null;
function openModal(o) {
  if ($('#overlay').hidden === false) closeModal();
  $('#mTitle').textContent = o.title;
  $('#mBody').innerHTML = o.html;
  $('.modal').className = 'modal' + (o.wide ? ' wide' : '');
  $('#overlay').hidden = false;
  document.body.classList.add('noscroll');
  modalState = { onClose: o.onClose };
  if (o.onMount) o.onMount($('#mBody'));
  const f = $('#mBody [autofocus]') || $('#mBody input:not([type=checkbox]):not([type=hidden])') || $('#mBody textarea');
  if (f && !o.noFocus) f.focus();
}
function closeModal() {
  if ($('#overlay').hidden) return;
  $('#overlay').hidden = true;
  $('#mBody').innerHTML = '';
  document.body.classList.remove('noscroll');
  const s = modalState; modalState = null;
  if (s && s.onClose) s.onClose();
}

function askText(o) {
  return new Promise((resolve) => {
    let done = false; const fin = (v) => { if (!done) { done = true; resolve(v); } };
    openModal({
      title: o.title,
      html: `<form class="stack" id="askForm"><label>${esc(o.label)}<input id="askIn" value="${esc(o.value || '')}" autocomplete="off"></label>
        ${o.hint ? `<p class="hint">${esc(o.hint)}</p>` : ''}
        <div class="foot"><button type="button" class="btn" data-act="close">Vazgeç</button><button class="btn primary">${esc(o.ok || 'Tamam')}</button></div></form>`,
      onMount: (b) => {
        $('#askForm', b).addEventListener('submit', (e) => { e.preventDefault(); fin($('#askIn', b).value.trim() || null); closeModal(); });
        $('#askIn', b).select();
      },
      onClose: () => fin(null)
    });
  });
}

function askChoice(o) {
  return new Promise((resolve) => {
    let done = false; const fin = (v) => { if (!done) { done = true; resolve(v); } };
    openModal({
      title: o.title,
      html: `<p>${esc(o.text)}</p><div class="foot">${o.choices.map((c) => `<button class="btn ${c.kind || ''}" data-choice="${esc(c.id)}">${esc(c.label)}</button>`).join('')}</div>`,
      onMount: (b) => { $$('[data-choice]', b).forEach((x) => x.addEventListener('click', () => { fin(x.dataset.choice); closeModal(); })); },
      onClose: () => fin(null)
    });
  });
}

/* açılır menü */
let menuOff = null; let menuReturn = null;
function closeMenu(refocus) {
  $$('.menu').forEach((m) => m.remove());
  if (menuOff) { document.removeEventListener('click', menuOff); menuOff = null; }
  const key = menuReturn; menuReturn = null;
  if (refocus && key) { const el = rowEl(key); if (el) el.focus(); }
}
function showMenu(x, y, items, returnKey) {
  closeMenu();
  menuReturn = returnKey || null;
  const m = document.createElement('div');
  m.className = 'menu'; m.setAttribute('role', 'menu');
  m.innerHTML = items.map((i) => `<button class="mi ${i.danger ? 'danger' : ''}" role="menuitem" tabindex="-1" data-act="${i.act}" data-mp="${esc(i.mp || '')}" data-path="${esc(i.path || '')}" data-kind="${esc(i.kind || '')}" data-name="${esc(i.name || '')}">${esc(i.label)}</button>`).join('');
  document.body.appendChild(m);
  const r = m.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + 'px';
  m.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + 'px';
  menuOff = () => closeMenu();
  setTimeout(() => { if (menuOff) document.addEventListener('click', menuOff); }, 0);
  const first = $('.mi', m); if (first) first.focus();
}

// Düğüm türüne göre bağlam menüsü öğeleri.
function menuItemsFor(it) {
  const mk = (label, act, extra) => ({ label, act, mp: it.mp, path: it.path, kind: it.kind, ...extra });
  const items = [];
  switch (it.kind) {
    case 'mp':
      if (!it.node.active) items.push(mk('Etkinleştir', 'm-activate'));
      if (it.node.state === 'hazir') items.push(mk('Yeni plugin', 'new-plugin'), mk('Git paneli', 'git'), mk('Marketplace (yayın)', 'market'));
      items.push(mk('Yolu kopyala', 'm-copy-path'));
      break;
    case 'plugin':
      items.push(mk('Yeni prompt', 'm-new-prompt', { name: it.node.name }), mk('Paket sayfasını aç', 'open-package', { name: it.node.name }), mk('Açıklamayı düzenle', 'm-desc', { name: it.node.name }),
        mk('Yeniden adlandır', 'm-rename-plugin', { name: it.node.name }), mk('Sil (çöp kutusuna taşı)', 'm-delete-plugin', { name: it.node.name, danger: true }));
      break;
    case 'dir':
      items.push(mk('Yeniden adlandır veya taşı', 'rename'), mk('Sil (çöp kutusuna taşı)', 'delete', { danger: true }));
      break;
    case 'file': {
      if (/\.(md|markdown)$/i.test(it.path)) {
        const loose = Rules.classifyPromptPath(it.path, libDirOf(it.mp)).kind === 'klasorsuz';
        items.push(mk(loose ? "Plugin'e taşı…" : 'Taşı…', 'm-move'), mk('Yeniden adlandır', 'm-rename-file'));
      } else items.push(mk('Yeniden adlandır veya taşı', 'rename'));
      items.push(mk('Sil (çöp kutusuna taşı)', 'delete', { danger: true }));
      break;
    }
    case 'tfile':
      items.push(mk('Yeniden adlandır veya taşı', 'rename'), mk('Sil (çöp kutusuna taşı)', 'delete', { danger: true }));
      break;
    case 'inbox': items.push(mk('İçe aktar', 'import')); break;
    default: break;
  }
  return items;
}
function openMenuFor(it, x, y) {
  const items = menuItemsFor(it);
  if (items.length) showMenu(x, y, items, it.key);
}

/* ------------------------------------------------------------------ dosya açma */
const leadOf = (p) => (p.hasFm && /^\n/.test(p.body) ? '\n' : '');
const isDirty = () => !!(S.cur && S.cur.dirty);

function computeRaw() {
  const c = S.cur;
  if (c.tab === 'raw') {
    const t = $('#fRaw');
    if (t) { const p = FM.parse(t.value); p.eol = c.eol; p.bom = c.bom; return FM.stringify(p); }
  }
  return FM.stringify(c.parsed);
}
function syncFromDom() {
  const c = S.cur; if (!c) return;
  if (c.tab === 'raw') {
    const t = $('#fRaw');
    if (t) { const p = FM.parse(t.value); p.eol = c.eol; p.bom = c.bom; c.parsed = p; c.lead = leadOf(p); }
  }
}
const uncommitted = (p) => !!(S.git && S.git.isRepo && S.git.files.some((f) => f.path === p));
function saveLabel() {
  const c = S.cur; const msg = c.commitMsg.trim();
  if (c.dirty) return msg ? 'Kaydet ve commit et' : 'Kaydet';
  if (msg && uncommitted(c.path)) return 'Commit et';
  return 'Kaydet';
}
function updateDirty() {
  const c = S.cur; if (!c) return;
  c.dirty = computeRaw() !== c.savedRaw;
  const b = $('#btnSave');
  if (b) { b.disabled = !(c.dirty || (uncommitted(c.path) && c.commitMsg.trim())); b.textContent = saveLabel(); }
  const cp = $('#commitPill'); if (cp) cp.hidden = !(uncommitted(c.path) && !c.dirty);
  document.title = (c.dirty ? '• ' : '') + 'Prompt havuzu';
  const n = $('#dirtyNote'); if (n) n.hidden = !c.dirty;
}

async function confirmDiscard() {
  if (!isDirty()) return true;
  const a = await askChoice({
    title: 'Kaydedilmemiş değişiklikler var', text: '"' + base(S.cur.path) + '" dosyasında kaydetmediğin değişiklikler var.',
    choices: [{ id: 'cancel', label: 'Vazgeç' }, { id: 'discard', label: 'Değişiklikleri at', kind: 'danger' }, { id: 'save', label: 'Kaydet ve devam et', kind: 'primary' }]
  });
  if (a === 'save') return save();
  if (a === 'discard') { S.cur.dirty = false; return true; }
  return false;
}

async function openFile(p, o) {
  o = o || {};
  if (S.cur && S.cur.path === p && !o.reload) { closeSide(); return; }
  if (!(await confirmDiscard())) return;
  const gen = S.gen;
  let r;
  try { r = await get('/api/file?' + qs({ path: p })); } catch (e) { if (!o.quiet) fail(e); if (e.status === 404) ls.set(lsKey('last'), null); renderMain(); return; }
  if (gen !== S.gen) return; // bu arada marketplace değişti
  const parsed = FM.parse(r.raw);
  const mp = activeName();
  S.cur = {
    mp, path: r.path, parsed, savedRaw: r.raw, mtime: r.mtime, isPrompt: r.isPrompt, isMd: r.isMd,
    generatedFrom: r.generatedFrom, publish: r.publish, eol: parsed.eol, bom: parsed.bom, lead: leadOf(parsed),
    tab: o.tab || (r.isPrompt ? 'edit' : 'raw'), hist: null, dirty: false, external: false, commitMsg: (o.reload && S.cur && S.cur.path === p) ? S.cur.commitMsg : '', ver: null
  };
  ls.set(lsKey('last'), r.path);
  expandParents(r.path, mp);
  S.sel = { mp, key: nodeKey(mp, r.path) }; S.focusKey = S.sel.key;
  closeSide(); renderList(); renderMain();
  loadVersion();
  if (S.cur.tab === 'hist') loadHistory();
  document.title = 'Prompt havuzu';
}

// Açık dosya başka bir marketplace'e aitse (başka sekmede geçiş) yazma engellenir.
function staleGuard() {
  const c = S.cur;
  if (!c || c.mp === activeName()) return false;
  toast('Bu dosya "' + c.mp + "\" marketplace'ine ait ama etkin marketplace \"" + activeName() + '". Dosyayı ağaçtan yeniden aç.', 'error', 7000);
  return true;
}

function closeSide() { document.body.classList.remove('side-open'); }

/* --------------------------------------------------------------------- ana alan */
function chipsHtml(key, list, ph) {
  return `<div class="chips" data-chips="${key}">${list.map((t) => `<span class="chip">${esc(t)}<button type="button" data-act="chip-x" data-key="${key}" data-val="${esc(t)}" aria-label="${esc(t)} değerini kaldır">×</button></span>`).join('')}<input class="chip-in" data-chip-in="${key}" list="dl-${key}" placeholder="${esc(ph)}" autocomplete="off" aria-label="${esc(ph)}"></div>`;
}

function curCheck() {
  const c = S.cur;
  return Rules.publishCheck({ meta: FM.meta(c.parsed), hasFm: c.parsed.hasFm, fmBroken: Rules.isFmBroken(computeRaw(), c.parsed.hasFm) });
}

// Durumu dışa aktarılmayan değerdeyse bilgi (engellemez).
function exportCheck() {
  const ex = S.info && S.info.config && S.info.config.export; const c = S.cur;
  if (!ex || !c || !c.isPrompt || !normTur(FM.meta(c.parsed).tur)) return null;
  const d = str(FM.meta(c.parsed).durum).trim();
  return Rules.durumAllowed(d, ex.durumlar) ? null : { code: 'durumHaric', level: 'info', reason: Rules.MSG.durumHaric(d, ex.durumlar) };
}
const curNotice = () => { const k = curCheck(); return k && k.level === 'warn' ? k : exportCheck(); };

function pubPill() {
  const c = S.cur; const m = FM.meta(c.parsed); const tur = normTur(m.tur);
  const chk = curCheck();
  if (chk && chk.level === 'warn') return '<span class="pill warn">Yayınlanmayacak</span>';
  if (!tur) return '<span class="pill">Yayın dışı</span>';
  const p = c.publish;
  if (!p) return '<span class="pill warn">Kaydedince yayınlanabilir</span>';
  if (p.state === 'guncel') return '<span class="pill ok">Yayında, güncel</span>';
  if (p.state === 'eski') return '<span class="pill warn">Yayında, kaynak değişti</span>';
  return '<span class="pill warn">Henüz yayınlanmadı</span>';
}

function editPaneHtml() {
  const c = S.cur; const m = FM.meta(c.parsed);
  const tur = normTur(m.tur);
  const shownBody = c.parsed.body.slice(c.lead.length);
  const chk = curCheck();
  const nt = curNotice();
  const pkgCl = Rules.classifyPromptPath(c.path, libDirOf(c.mp));
  const pubOpen = ls.get('pp.pubOpen', false) || !!tur || !!(chk && chk.level === 'warn');
  const rawTur = str(m.tur).trim();
  const durumVal = fold(str(m.durum));
  const dOpt = [['taslak', 'Taslak'], ['kararlı', 'Kararlı'], ['arşiv', 'Arşiv']];
  const known = dOpt.some((d) => fold(d[0]) === durumVal);
  const mk = S.info.config.marketplace;
  const usage = c.publish ? (c.publish.tur === 'ajan'
    ? `Ajan adı: <code>${esc(c.publish.ad)}</code>`
    : `Claude Code'da çağır: <code>/${esc(c.publish.paket)}:${esc(c.publish.ad)}</code>`) : '';
  return `
  <div class="meta">
    <label>Etiketler</label>${chipsHtml('etiketler', toList(m.etiketler), 'Etiket ekle, Enter')}
    <label for="fDurum2">Durum</label>
    <select id="fDurum2" data-f="durum">
      <option value="">Belirsiz</option>
      ${dOpt.map((d) => `<option value="${d[0]}" ${fold(d[0]) === durumVal ? 'selected' : ''}>${d[1]}</option>`).join('')}
      ${durumVal && !known ? `<option value="${esc(str(m.durum))}" selected>${esc(str(m.durum))}</option>` : ''}
    </select>
    <label for="fVer">Sürüm</label>
    <div><div class="inline"><input id="fVer" data-f="versiyon" value="${esc(str(m.versiyon))}" placeholder="Henüz sürüm yok (+1 ile 1.0.0)" aria-describedby="verHint"><button type="button" class="btn sm" id="btnBump" data-act="bump" title="Yeni sürüm oluştur: versiyon artar, commit ve tag atılır" ${S.git && S.git.isRepo ? '' : 'disabled'}>+1</button><span id="verWarn" class="pill warn" role="status" hidden></span></div>
    <div id="verHint" class="hint" hidden></div></div>
    <label>Projeler</label>${chipsHtml('projeler', toList(m.projeler), 'Hangi projelerde kullanılıyor?')}
  </div>
  <details class="pub" id="pubBox" ${pubOpen ? 'open' : ''}>
    <summary><b>Claude Code yayın ayarları</b><span id="pubPill">${pubPill()}</span></summary>
    <div id="pubWarn" class="issue ${nt && nt.level === 'warn' ? 'warn' : 'info'}" role="status" aria-live="polite" ${nt ? '' : 'hidden'}>${nt ? esc(nt.reason) : ''}</div>
    <div class="meta">
      <label for="pTur">Tür</label>
      <select id="pTur" data-f="tur">
        <option value="">Yayın dışı</option>
        ${rawTur && !tur ? `<option value="${esc(rawTur)}" selected>⚠ "${esc(rawTur)}" (tanınmadı)</option>` : ''}
        <option value="komut" ${tur === 'komut' ? 'selected' : ''}>Komut (slash command)</option>
        <option value="ajan" ${tur === 'ajan' ? 'selected' : ''}>Ajan (subagent)</option>
        <option value="skill" ${tur === 'skill' ? 'selected' : ''}>Skill</option>
      </select>
      <label for="pPaket">Paket</label><div>${pkgCl.kind === 'paket' ? `<span id="pPaket" class="mono" tabindex="0">Paket: ${esc(pkgCl.paket)} (klasörden)</span>` : `<input id="pPaket" data-f="paket" list="dl-paket" value="${esc(str(m.paket))}" placeholder="Varsayılan: ${esc(mk.plugin)}" aria-describedby="paketHint">`}<div id="paketHint" class="issue warn" role="status" hidden></div></div>
      <label for="pAd">Ad</label><input id="pAd" data-f="komut_adi" value="${esc(str(m.komut_adi))}" placeholder="${esc(FM.slug(stem(c.path)))}">
      <label for="pAcik">Açıklama</label><input id="pAcik" data-f="aciklama" value="${esc(str(m.aciklama))}" placeholder="Bu prompt ne işe yarar? Claude ne zaman kullanmalı?">
      <label for="pArg">Argüman ipucu</label><input id="pArg" data-f="arguman_ipucu" value="${esc(str(m.arguman_ipucu))}" placeholder="[dosya yolu]">
      <label for="pArac">İzinli araçlar</label><input id="pArac" data-f="izinli_araclar" value="${esc(str(m.izinli_araclar))}" placeholder="Bash(git diff:*), Read">
      <label for="pModel">Model</label><input id="pModel" data-f="model" value="${esc(str(m.model))}" placeholder="sonnet">
    </div>
    <div class="pubfoot"><button type="button" class="btn" data-act="open-package" data-name="${esc(pkgCl.paket || FM.slug(mk.plugin))}">Paket sayfasını aç</button><span class="hint" id="pubUsage">${usage}</span></div>
  </details>
  <div class="bodywrap"><textarea id="fBody" spellcheck="false" aria-label="Prompt metni" placeholder="Prompt metnini buraya yaz. {{degisken}} biçiminde yer tutucular kullanabilirsin.">${esc(shownBody)}</textarea></div>
  <div class="bodyinfo" id="bodyInfo"></div>`;
}

function bodyInfoText() {
  const c = S.cur; const b = c.parsed.body.slice(c.lead.length);
  const words = (b.trim().match(/\S+/g) || []).length;
  const vars = FM.placeholders(b);
  return `<span>${words} kelime, ${b.length} karakter</span>${vars.length ? `<span>Değişkenler: ${vars.map((v) => '<code>' + esc(v) + '</code>').join(' ')}</span>` : ''}<span id="dirtyNote" ${c.dirty ? '' : 'hidden'}>Kaydedilmemiş değişiklik var</span>`;
}

function rawPaneHtml() {
  const c = S.cur;
  return `<textarea id="fRaw" spellcheck="false" aria-label="Dosya içeriği">${esc(FM.stringify(c.parsed).replace(/\r\n/g, '\n'))}</textarea>
  <div class="bodyinfo"><span>Tüm dosya, frontmatter dahil. Biçimi bozmadan düzenle.</span><span id="dirtyNote" ${c.dirty ? '' : 'hidden'}>Kaydedilmemiş değişiklik var</span></div>`;
}

const HIST_STALE = () => { const c = S.cur; return `<p class="issue warn">Bu dosya ${esc(c.mp)} marketplace'ine ait ama etkin marketplace ${esc(activeName() || 'yok')}. Geçmişi görmek için dosyayı ağaçtan yeniden aç.</p>`; };

function histModeBar(h) {
  if (!h.ver) return '';
  const b = (m, t) => `<button type="button" data-act="hist-mode" data-mode="${m}" aria-pressed="${h.mode === m}">${t}</button>`;
  return `<div class="seg" role="group" aria-label="Geçmiş görünümü">${b('ver', 'Sürümler')}${b('commit', "Commit'ler")}</div>`;
}

function histCommitHtml(h) {
  const cm = h.commit;
  if (!cm) return '<p class="hint">Geçmiş yükleniyor…</p>';
  const items = [];
  const li = (hash, cls, inner) => `<li role="button" tabindex="0" data-act="hist-select" data-hash="${hash}" class="${cls}">${inner}</li>`;
  if (cm.working && (cm.working.diff || cm.working.untracked)) items.push(li('working', cm.sel === 'working' ? 'on' : '', `<div class="s">Commit edilmemiş değişiklikler</div><div class="hint">${cm.working.untracked ? 'Dosya henüz git\'e eklenmedi' : 'Son commit ile fark'}</div>`));
  for (const k of cm.commits) items.push(li(k.hash, cm.sel === k.hash ? 'on' : '', `<div class="s">${esc(k.subject)}</div><div class="hint">${esc(fmtDate(k.date))}, ${esc(k.short)}</div>`));
  if (!items.length) return '<p class="hint">Bu dosya için henüz commit yok. Kaydederken commit mesajı yazarsan commit edilir.</p>';
  return `<div class="hist"><ul class="commits">${items.join('')}</ul><div><div class="diffhead" id="diffHead"></div><pre class="diff" id="diffBox">Bir kayıt seç.</pre></div></div>`;
}

const verLabel = (ref, version) => (ref === 'HEAD' ? 'Son commit' : 'v' + version);
const verByTag = (v, tag) => v.data.versions.find((x) => x.tag === tag);

function histVerHtml(h) {
  const v = h.ver; const d = v.data;
  if (!d.tracked) return `<p class="hint">Bu dosya henüz commit edilmedi. Sürüm geçmişi ilk commit'ten sonra oluşur.</p><p class="hint">Dosya taşındıysa, eski ve yeni yolu birlikte commit edersen geçmiş bağlanır.</p>`;
  if (!d.versions.length) return `<p class="hint">Bu prompt için henüz sürüm yok. Sürüm, Düzenle sekmesindeki +1 düğmesiyle oluşturulur.</p><p><button class="btn" data-act="hist-mode" data-mode="commit">Commit'leri göster</button></p>${d.ignoredTags ? `<p class="issue info">${d.ignoredTags} tag sürüm biçimine uymadığı için atlandı.</p>` : ''}`;
  const opts = [`<option value="HEAD">Son commit</option>`].concat(d.versions.map((x) => `<option value="${esc(x.tag)}">v${esc(x.version)}${x.renamed ? ' (eski ad)' : ''}</option>`)).join('');
  const tl = '<ol class="commits timeline" id="verTL" aria-label="Sürüm zaman çizelgesi"></ol>';
  return `<div class="hist">${tl}<div>
    <div class="vbar"><label>Eski <select id="verA">${opts}</select></label> <span aria-hidden="true">→</span> <label>Yeni <select id="verB">${opts}</select></label></div>
    <div id="verMain" aria-live="polite"></div></div></div>`;
}

function histPaneHtml() {
  const h = S.cur.hist;
  if (!h || h.loading) return '<p class="hint">Geçmiş yükleniyor…</p>';
  if (h.stale) return HIST_STALE();
  if (h.noRepo) return '<p>Geçmiş kaydı için havuzun bir git deposu olması gerekir.</p><p><button class="btn primary" data-act="git">Git panelini aç</button></p>';
  if (h.error) return `<p class="issue error">${esc(h.error)}</p>`;
  return histModeBar(h) + (h.mode === 'ver' ? histVerHtml(h) : histCommitHtml(h));
}

function renderMain() {
  if (!rootOk()) { renderSetup(); return; }
  if (!setupOk()) { renderPick(); return; }
  renderMainInner();
  paintWarnBand();
  paintRemoteBand();
}

// mp › plugin › dosya (marketplace adı ağaçta o düğüme götürür).
function crumbsHtml(c) {
  const cl = Rules.classifyPromptPath(c.path, libDirOf(c.mp));
  const parts = c.path.split('/');
  const sep = '<span class="sep">›</span>';
  let rest;
  if (cl.kind === 'paket') rest = [esc(cl.klasor)].concat(parts.slice(libDirOf(c.mp).split('/').length + 1).map(esc));
  else if (cl.kind === 'gelenKutusu') rest = ['Gelen kutusu'].concat(parts.slice(libDirOf(c.mp).split('/').length + 1).map(esc));
  else if (cl.kind === 'klasorsuz') rest = ['Klasörsüz', esc(parts[parts.length - 1])];
  else rest = parts.map(esc);
  if (cl.kind === 'paket' || cl.kind === 'gelenKutusu') { /* klasör adından sonraki parçalar zaten eklendi */ }
  return `<button type="button" class="link" data-act="reveal" title="Ağaçta göster">${esc(c.mp)}</button>` + sep + rest.join(sep);
}

function renderMainInner() {
  const main = $('#main');
  const c = S.cur;
  if (!c) { main.innerHTML = startHtml(); return; }
  const tabs = c.isPrompt ? [['edit', 'Düzenle'], ['raw', 'Ham metin'], ['hist', 'Geçmiş']] : [['raw', 'Düzenle'], ['hist', 'Geçmiş']];
  const crumbs = crumbsHtml(c);
  const m = FM.meta(c.parsed);
  const title = c.isPrompt
    ? `<input class="title" data-f="baslik" value="${esc(str(m.baslik))}" placeholder="${esc(stem(c.path))}" aria-label="Başlık">`
    : `<h1 class="title static">${esc(base(c.path))}</h1>`;
  const stale = c.mp !== activeName();
  const staleBanner = stale ? `<div class="banner" role="alert">Bu dosya <b>${esc(c.mp)}</b> marketplace'ine ait ama etkin marketplace şu an <b>${esc(activeName() || 'yok')}</b>. Kaydetmek için dosyayı ağaçtan yeniden aç.</div>` : '';
  const banner = c.generatedFrom
    ? `<div class="banner">Bu dosya <b>${esc(c.generatedFrom)}</b> kaynağından otomatik üretildi. Burada yaptığın değişiklik bir sonraki yayında ezilir.<button class="btn sm" data-act="open" data-path="${esc(c.generatedFrom)}">Kaynağa git</button></div>` : '';
  const ext = c.external ? '<div class="banner">Bu dosya, sen açtıktan sonra diskte değişti. Kaydedersen ne yapmak istediğini soracağım.</div>' : '';
  const restore = c.restoredFrom ? `<div class="banner"><span class="restorebar">Editörde ${esc(c.restoredFrom.what)} içeriği var (kaydedilmedi). Kaydedersen dosya bu içerikle değişir.<button class="btn sm" data-act="ver-restore-cancel">Geri al</button></span></div>` : '';
  let pane = '';
  if (c.tab === 'edit' && c.isPrompt) pane = editPaneHtml();
  else if (c.tab === 'hist') pane = histPaneHtml();
  else pane = rawPaneHtml();
  main.innerHTML = `<section class="card">
    <div class="crumbs">${crumbs}</div>
    <div class="titlebar">${title}
      <div class="tbtns">${c.isMd ? '<button class="btn" data-act="copy" title="Prompt metnini panoya kopyala">Kopyala</button>' : ''}<button class="btn primary" id="btnSave" data-act="save" ${c.dirty || (uncommitted(c.path) && c.commitMsg.trim()) ? '' : 'disabled'} title="Ctrl+S">${esc(saveLabel())}</button></div>
    </div>
    <div class="commitbar" id="commitBar" ${S.git && S.git.isRepo ? '' : 'hidden'}>
      <label for="commitMsg" class="hint">Commit mesajı (${esc(c.mp)})</label>
      <input id="commitMsg" value="${esc(c.commitMsg)}" placeholder="Ne değişti, neden? (boşsa yalnızca kaydedilir)" autocomplete="off">
      <span id="commitPill" class="pill warn" ${uncommitted(c.path) && !c.dirty ? '' : 'hidden'}>Commit bekliyor</span>
    </div>
    ${staleBanner}${banner}${ext}${restore}
    <div class="tabs" role="tablist">${tabs.map((t) => `<button class="tab ${c.tab === t[0] ? 'on' : ''}" role="tab" aria-selected="${c.tab === t[0]}" data-act="tab" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>
    <div class="pane" id="pane">${pane}</div></section>`;
  if (c.tab === 'edit') { autosize($('#fBody')); $('#bodyInfo').innerHTML = bodyInfoText(); paintPaketHint(); }
  if (c.tab === 'raw') autosize($('#fRaw'));
  if (c.tab === 'hist') paintHist();
  paintVerHint(); paintVerWarn();
}

function startHtml() {
  const n = S.facets.total;
  const recent = S.recent.length
    ? `<h2>Son değişenler</h2><div class="recent">${S.recent.map((r) => `<div class="res" role="button" tabindex="0" data-act="open" data-mp="${esc(r.mp)}" data-path="${esc(r.path)}"><div class="rt"><span class="dot ${durumClass(r.durum)}"></span><span>${esc(r.baslik)}</span></div><div class="rp">${esc(r.mp)} › ${esc(whereOf(r))} › ${esc(base(r.path))}</div></div>`).join('')}</div>` : '';
  return `<div class="start"><h1>${n ? 'Bir prompt seç' : 'Havuz henüz boş'}</h1>
    <p>${n ? `Havuzunda ${n} prompt var. Soldaki listeden veya arama kutusundan birini aç. Sık kopyaladıklarını etiketle, değiştirdiklerini git ile kaydet.` : 'Eski .txt dosyalarını içe aktararak başlayabilir ya da sıfırdan yeni bir prompt yazabilirsin.'}</p>
    <div class="btns"><button class="btn primary" data-act="new-prompt">Yeni prompt</button><button class="btn" data-act="import">.txt dosyalarını içe aktar</button></div>${recent}</div>`;
}

/* ---------------------------------------------------------------- düzenleme */
function setField(key, value) {
  const c = S.cur;
  FM.set(c.parsed, key, typeof value === 'string' ? value.trim() : value);
  c.lead = c.lead || leadOf(c.parsed);
  updateDirty();
  if (key === 'tur') {
    c.turClearedExplicitly = !str(value).trim();
  }
  if (c.isPrompt && (key === 'tur' || Rules.PUBLISH_FIELDS.includes(key))) refreshPubWarn();
  if (key === 'paket') paintPaketHint();
  if (key === 'versiyon') paintVerHint();
}

// Sürüm alanı yorumlanamıyorsa ya da eski biçimdeyse ipucu gösterir.
function paintVerHint() {
  const c = S.cur; const h = $('#verHint'); if (!c || !h) return;
  const raw = str(FM.meta(c.parsed).versiyon).trim();
  const v = Rules.coerceVersion(raw);
  let t = '';
  if (v === null) t = 'Sürüm yorumlanamadı. X.Y.Z biçiminde yaz (örnek: 1.0.0).';
  else if (v.legacy) t = 'Eski biçim: "' + raw + '", ' + v.version + ' olarak yorumlanır.';
  h.hidden = !t; h.textContent = t;
}

async function loadVersion() {
  const c = S.cur; if (!c || !c.isPrompt) return;
  const gen = S.gen;
  try {
    const v = await get('/api/version?' + qs({ path: c.path }));
    if (S.cur === c && gen === S.gen) { c.ver = v; paintVerWarn(); }
  } catch (e) { /* sessiz */ }
}

function paintVerWarn() {
  const c = S.cur; const w = $('#verWarn'); if (!c || !w) return;
  const u = c.ver && c.ver.uyari;
  w.hidden = !u;
  if (u) {
    w.textContent = 'v' + c.ver.sonSurum.version + '\'dan beri değişti';
    w.title = u.message; w.setAttribute('aria-label', u.message);
  }
}

// Klasörle uyuşmayan "paket" alanı için uyarı ve "Alanı klasöre eşitle" düğmesi.
function paintPaketHint() {
  const c = S.cur; const h = $('#paketHint'); if (!c || !h) return;
  const cl = Rules.classifyPromptPath(c.path, libDirOf(c.mp));
  const alan = str(FM.meta(c.parsed).paket).trim();
  const bad = cl.kind === 'paket' && !!alan && FM.slug(alan) !== cl.paket;
  h.hidden = !bad;
  h.innerHTML = bad ? esc(Rules.MSG.paketUyusmuyor(cl.klasor, alan)) + ' <button type="button" class="btn sm" data-act="paket-esitle">Alanı klasöre eşitle</button> <button type="button" class="btn sm" data-act="m-move" data-path="' + esc(c.path) + '">Dosyayı taşı</button>' : '';
}

function refreshPubWarn() {
  const chk = curCheck();
  const pp = $('#pubPill'); if (pp) pp.innerHTML = pubPill();
  const w = $('#pubWarn');
  if (w) {
    const nt = curNotice();
    w.hidden = !nt; w.textContent = nt ? nt.reason : ''; w.className = 'issue ' + (nt && nt.level === 'warn' ? 'warn' : 'info');
  }
}

function refreshChips(key) {
  const c = S.cur; const el = $('[data-chips="' + key + '"]'); if (!el) return;
  const ph = key === 'etiketler' ? 'Etiket ekle, Enter' : 'Hangi projelerde kullanılıyor?';
  const wrap = document.createElement('div');
  wrap.innerHTML = chipsHtml(key, toList(FM.meta(c.parsed)[key]), ph);
  el.replaceWith(wrap.firstElementChild);
}
function addChips(key, raw, keepFocus) {
  const c = S.cur; const list = toList(FM.meta(c.parsed)[key]);
  for (const v of toList(raw)) if (!list.some((x) => fold(x) === fold(v))) list.push(v);
  setField(key, list); refreshChips(key);
  if (keepFocus) { const i = $('[data-chip-in="' + key + '"]'); if (i) i.focus(); }
}
function removeChip(key, val) {
  const c = S.cur;
  setField(key, toList(FM.meta(c.parsed)[key]).filter((x) => x !== val));
  refreshChips(key);
}

function setTab(tab) {
  const c = S.cur; if (!c || c.tab === tab) return;
  syncFromDom();
  c.tab = tab;
  renderMain();
  if (tab === 'hist') loadHistory();
}

// "tur" kaldırılıyorsa onay ister. false dönerse işlem iptal edilmiştir.
async function confirmTurRemoval(c, force) {
  const before = c.isPrompt ? Rules.normTur(FM.meta(FM.parse(c.savedRaw)).tur) : '';
  if (c.isPrompt && before && !Rules.normTur(FM.meta(c.parsed).tur) && !c.turClearedExplicitly && !force) {
    const a = await askChoice({
      title: 'Prompt yayından çıkacak',
      text: `Bu kayıtla "tur: ${before}" alanı kaldırılıyor ve prompt artık yayınlanmayacak.` + (c.publish ? ` Yayındaki ${c.publish.target} dosyası kaynaksız kalacak.` : ''),
      choices: [{ id: 'cancel', label: 'Vazgeç' }, { id: 'restore', label: `"tur: ${before}" geri koy ve kaydet` }, { id: 'go', label: 'Yine de kaydet', kind: 'danger' }]
    });
    if (a === 'cancel' || !a) return false;
    if (a === 'restore') {
      FM.set(c.parsed, 'tur', before);
      renderMain();
    }
  }
  return true;
}

// Git kimliği penceresi. Kimlik kaydedilirse true döner.
function askIdentity() {
  return new Promise((resolve) => {
    let done = false; const fin = (v) => { if (!done) { done = true; resolve(v); } };
    const idn = (S.git && S.git.identity) || {};
    const opener = document.activeElement;
    openModal({
      title: 'Git kimliği',
      html: `<form class="stack" id="idForm"><p>Git, commit yazarını bilmiyor. Bu marketplace için ad ve e-posta gir.</p>
        <label>Ad Soyad<input id="idName" value="${esc(idn.name || '')}" autocomplete="name"></label>
        <label>E-posta<input id="idMail" type="email" value="${esc(idn.email || '')}" autocomplete="email"></label>
        <div id="idErr" class="issue error" role="alert" hidden></div>
        <div class="foot"><button type="button" class="btn" data-act="close">Vazgeç</button><button class="btn primary">Kaydet</button></div></form>`,
      onMount: (b) => {
        $('#idForm', b).addEventListener('submit', async (e) => {
          e.preventDefault();
          try {
            await api('POST', '/api/git/identity', { name: $('#idName', b).value, email: $('#idMail', b).value });
            await loadGit();
            fin(true); closeModal();
          } catch (err) { const er = $('#idErr', b); er.textContent = err.message; er.hidden = false; }
        });
      },
      onClose: () => { fin(false); if (opener && opener.isConnected && opener.focus) opener.focus(); else { const sb = $('#btnSave'); if (sb) sb.focus(); } }
    });
  });
}

// Yalnızca commit: dosya zaten kaydedilmiş, mesaj dolu.
async function commitOnly() {
  const c = S.cur; if (!c) return false;
  if (staleGuard()) return false;
  const message = c.commitMsg.trim();
  if (!message) return false;
  try {
    const r = await api('POST', '/api/git/commit', { message, paths: [c.path] });
    c.commitMsg = ''; const i = $('#commitMsg'); if (i) i.value = '';
    toast('Commit edildi (' + r.commit + ')');
    updateDirty();
    afterWrite();
    return true;
  } catch (e) {
    if (e.data && e.data.needIdentity) {
      if (await askIdentity()) return commitOnly();
      return false;
    }
    fail(e); return false;
  }
}

// +1: sürüm penceresi. Sunucu dosyayı yazar, commit eder ve tag atar; hata olursa her şeyi geri alır.
async function openBump() {
  const c = S.cur; if (!c || !c.isPrompt) return;
  if (staleGuard()) return;
  syncFromDom();
  let v;
  try { v = await get('/api/version?' + qs({ path: c.path })); } catch (e) { fail(e); return; }
  c.ver = v; paintVerWarn();
  const opener = document.activeElement;
  const m = FM.meta(c.parsed);
  const curRaw = str(m.versiyon).trim();
  const cv = Rules.coerceVersion(curRaw);
  const last = v.sonSurum;
  const base = cv ? (cv.version || (last ? last.version : '')) : null;
  const first = !!cv && !base;
  const sug = cv ? { buyuk: Rules.bumpVersion(base, 'buyuk'), kucuk: Rules.bumpVersion(base, 'kucuk'), yama: Rules.bumpVersion(base, 'yama') } : null;
  const note0 = [c.commitMsg.trim(), v.notOnerisi].filter(Boolean).join('\n\n');
  const desc = { yama: 'düzeltme, küçük metin değişikliği', kucuk: 'geriye uyumlu yeni davranış', buyuk: 'davranış veya kullanım biçimi değişti' };
  const levels = first
    ? `<p><b>İlk sürüm: ${esc(Rules.DEFAULT_VERSION)}</b></p>`
    : `<fieldset class="bumpopts"><legend>Seviye</legend>${['yama', 'kucuk', 'buyuk'].map((l, i) => `<label><input type="radio" name="bumpLevel" value="${l}" ${i === 0 ? 'checked autofocus' : ''} ${sug ? '' : 'disabled'}> ${Rules.LEVEL_LABEL[l]}${sug ? ': ' + esc(sug[l]) : ''} (${desc[l]})</label>`).join('')}</fieldset>`;
  const hintTxt = cv === null ? '<p class="issue error">Sürüm yorumlanamadı. X.Y.Z biçiminde yaz (örnek: 1.0.0).</p>' : '';
  const html = `<form class="stack" id="bumpForm">
    <p>Şu anki sürüm: <b>${esc(curRaw || 'yok')}</b>. ${last ? 'Son sürüm: <b>v' + esc(last.version) + '</b> (' + esc(fmtDate(last.date)) + ')' : 'Henüz sürüm yok'}</p>
    ${levels}${hintTxt}
    <label>Sürüm notu<textarea id="bumpNote" rows="5" required ${first ? 'autofocus' : ''}>${esc(note0)}</textarea></label>
    <p class="hint">Tag: <code id="bumpTag"></code></p>
    ${c.dirty ? '<p class="issue warn">Kaydedilmemiş değişiklikler de bu sürüme dahil edilecek.</p>' : ''}
    ${v.degisti === false ? '<p class="hint">Son sürümden beri içerik değişmedi; yalnızca sürüm numarası artacak.</p>' : ''}
    <div id="bumpErr" class="issue error" role="alert" hidden></div>
    <div class="foot"><button type="button" class="btn" data-act="close">Vazgeç</button><button class="btn primary" id="bumpOk">Sürümü oluştur</button></div></form>`;
  openModal({
    title: 'Yeni sürüm', html,
    onClose: () => { if (opener && opener.isConnected && opener.focus) opener.focus(); },
    onMount: (b) => {
      const level = () => { const r = $('input[name="bumpLevel"]:checked', b); return r ? r.value : 'yama'; };
      const paintTag = () => { $('#bumpTag', b).textContent = v.tagOnek + 'v' + (first ? Rules.DEFAULT_VERSION : sug ? sug[level()] : 'X.Y.Z'); };
      paintTag();
      $$('input[name="bumpLevel"]', b).forEach((r) => r.addEventListener('change', paintTag));
      const showErr = (msg, extra) => {
        const er = $('#bumpErr'); if (!er) { toast(msg, 'error'); return; }
        er.textContent = msg; er.hidden = false;
        if (extra) { const bt = document.createElement('button'); bt.type = 'button'; bt.className = 'btn sm'; bt.dataset.act = extra.act; bt.textContent = extra.label; er.appendChild(document.createTextNode(' ')); er.appendChild(bt); }
      };
      const send = async (force, pick) => {
        const body = { path: c.path, level: pick.level, note: pick.note,
          raw: c.dirty ? FM.stringify(c.parsed) : undefined, baseMtime: force ? undefined : c.mtime };
        try {
          const r = await api('POST', '/api/version/bump', body);
          c.parsed = FM.parse(r.raw); c.savedRaw = r.raw; c.mtime = r.mtime; c.lead = leadOf(c.parsed); c.dirty = false; c.commitMsg = '';
          closeModal(); renderMain();
          toast('Sürüm ' + r.version + ' oluşturuldu (' + r.tag + ')');
          afterWrite();
          return;
        } catch (e) {
          const d = e.data || {};
          if (d.needIdentity) { if (await askIdentity()) return send(force, pick); return; }
          if (e.status === 409 && d.conflict) {
            const a = await askChoice({
              title: 'Dosya diskte değişmiş', text: 'Bu dosya sen açtıktan sonra başka bir yerde değiştirilmiş. Ne yapalım?',
              choices: [{ id: 'cancel', label: 'Vazgeç' }, { id: 'reload', label: 'Diskteki sürümü yükle' }, { id: 'force', label: 'Diskteki sürümün üstüne yaz', kind: 'danger' }]
            });
            if (a === 'force') return send(true, pick);
            if (a === 'reload') { c.dirty = false; closeModal(); await openFile(c.path, { reload: true, tab: c.tab }); }
            return;
          }
          if (d.rollbackFailed) showErr(e.message, { act: 'git', label: 'Git panelini aç' });
          else showErr(e.message);
          const ok = $('#bumpOk'); if (ok) ok.disabled = false;
        }
      };
      $('#bumpForm', b).addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const note = $('#bumpNote', b).value.trim();
        const er = $('#bumpErr', b);
        if (!note) { er.textContent = 'Sürüm notu boş olamaz'; er.hidden = false; $('#bumpNote', b).focus(); return; }
        er.hidden = true;
        if (c.dirty && !(await confirmTurRemoval(c, false))) return;
        $('#bumpOk', b).disabled = true;
        await send(false, { level: level(), note });
      });
    }
  });
}

async function save(force) {
  const c = S.cur; if (!c) return false;
  if (staleGuard()) return false;
  syncFromDom();
  if (!c.dirty && c.commitMsg.trim() && uncommitted(c.path)) return commitOnly();
  const before = c.isPrompt ? Rules.normTur(FM.meta(FM.parse(c.savedRaw)).tur) : '';
  if (!(await confirmTurRemoval(c, force))) return false;
  const raw = FM.stringify(c.parsed);
  const msg = c.commitMsg.trim();
  try {
    const r = await api('PUT', '/api/file', { path: c.path, raw, baseMtime: force ? undefined : c.mtime, commitMessage: msg || undefined });
    c.savedRaw = raw; c.mtime = r.mtime; c.dirty = false; c.external = false;
    c.restoredFrom = null; c.autoMsg = null;
    c.turClearedExplicitly = false;
    let needId = false;
    if (r.commit) {
      toast('Kaydedildi ve commit edildi (' + r.commit + ')');
      c.commitMsg = ''; const i = $('#commitMsg'); if (i) i.value = '';
    } else if (r.commitSkipped) toast('Kaydedildi. Commit edilecek değişiklik yoktu.');
    else if (r.commitError && r.commitError.needIdentity) { toast('Kaydedildi'); needId = true; }
    else if (r.commitError) toast('Kaydedildi ama commit atılamadı: ' + r.commitError.error, 'error');
    else toast(S.git && S.git.isRepo ? 'Kaydedildi (commit edilmedi)' : 'Kaydedildi');
    if (c.isPrompt && !before) {
      const chk = Rules.publishCheck({ meta: FM.meta(c.parsed), hasFm: c.parsed.hasFm, fmBroken: Rules.isFmBroken(raw, c.parsed.hasFm) });
      if (chk && (chk.code === 'turYok' || chk.code === 'turGecersiz')) toast(chk.reason, 'warn', 7000);
    }
    updateDirty();
    const aw = afterWrite();
    if (needId) { await aw; if (await askIdentity()) await commitOnly(); }
    return true;
  } catch (e) {
    if (e.status === 409 && e.data && e.data.conflict) {
      const a = await askChoice({
        title: 'Dosya diskte değişmiş', text: 'Bu dosya sen açtıktan sonra başka bir yerde (örneğin Claude Code veya editör) değiştirilmiş. Ne yapalım?',
        choices: [{ id: 'cancel', label: 'Vazgeç' }, { id: 'reload', label: 'Diskteki sürümü yükle', kind: '' }, { id: 'force', label: 'Diskteki sürümün üstüne yaz', kind: 'danger' }]
      });
      if (a === 'force') return save(true);
      if (a === 'reload') { c.dirty = false; await openFile(c.path, { reload: true, tab: c.tab }); }
      return false;
    }
    fail(e); return false;
  }
}

async function afterWrite() {
  const gen = S.gen;
  await Promise.all([loadLibrary(), loadFacets(), loadGit(), loadRecent()]);
  if (gen !== S.gen) return; // bu arada marketplace değişti
  renderFilters(); renderList();
  if (isFiltering()) runSearch();
  const c = S.cur;
  if (c && c.isPrompt) {
    loadVersion();
    try { const r = await get('/api/file?' + qs({ path: c.path })); if (gen !== S.gen || S.cur !== c) return; c.publish = r.publish; c.generatedFrom = r.generatedFrom; const pp = $('#pubPill'); if (pp) pp.innerHTML = pubPill(); const u = $('#pubUsage'); if (u && r.publish) u.innerHTML = r.publish.tur === 'ajan' ? `Ajan adı: <code>${esc(r.publish.ad)}</code>` : `Claude Code'da çağır: <code>/${esc(r.publish.paket)}:${esc(r.publish.ad)}</code>`; } catch (e) { /* sessiz */ }
  }
}
