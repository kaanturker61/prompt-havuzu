<style>
/* Görsel dil "Pop Stüdyo": canlı düz renkler (asit lime, domates, kobalt, güneş, şeker pembe, nane), kalın mürekkep hatlar
   ve sert gölgeli neo-brütalist bileşenler, bento ön sayfa, Memphis geometrik şekiller, yaylı mikro animasyonlar.
   Plugin, marketplace ve etiketler adlarından türeyen sabit bir renk alır (data-c="0..5", hueOf).
   Yazı tipleri yereldir (OFL, fonts/OFL.txt): Bricolage Grotesque (başlık), Figtree (arayüz), Fragment Mono (metin). */
@font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 200 800; font-stretch: 75% 100%; font-display: swap; src: url("/fonts/bricolage-grotesque-latin-standard-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 200 800; font-stretch: 75% 100%; font-display: swap; src: url("/fonts/bricolage-grotesque-latin-ext-standard-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "Figtree"; font-style: normal; font-weight: 300 900; font-display: swap; src: url("/fonts/figtree-latin-wght-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Figtree"; font-style: normal; font-weight: 300 900; font-display: swap; src: url("/fonts/figtree-latin-ext-wght-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "Fragment Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url("/fonts/fragment-mono-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Fragment Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url("/fonts/fragment-mono-latin-ext-400-normal.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }

:root {
  color-scheme: light;
  /* yüzeyler */
  --paper: #F1F0EA; --panel: #FFFFFF; --card: #FFFFFF; --soft: #F1F0EA; --soft2: #E6E4DC; --ink: #121116; --muted: #605D68;
  --line: #E2E0D8; --line2: #ECEAE3; --code: #F8F7F3; --rule: #121116; --field: #D8D5CB; --hard: #121116;
  /* canlı palet */
  --lime: #C6F135; --tomato: #FF5B37; --cobalt: #3D63FF; --sun: #FFC233; --pink: #FF72CF; --mint: #2CD49B;
  --lime-ink: #4C6B00; --tomato-ink: #D23A16; --cobalt-ink: #2446E6; --sun-ink: #8F6100; --pink-ink: #B8248A; --mint-ink: #0B7F58;
  /* anlamsal */
  --accent: var(--lime); --accent-ink: #121116; --focus: var(--cobalt); --link: var(--cobalt-ink);
  --amber: var(--sun-ink); --green: var(--mint-ink); --red: var(--tomato-ink);
  --tint: 24%; --dots: rgba(18, 17, 22, .13); --scrim: rgba(18, 17, 22, .42); --on-cobalt: #FFFFFF;
  --display: "Bricolage Grotesque", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --sans: "Figtree", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Fragment Mono", "Cascadia Code", "SF Mono", Consolas, ui-monospace, monospace;
  --spring: cubic-bezier(.34, 1.56, .64, 1); --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --paper: #0E0E12; --panel: #15151B; --card: #1A1A21; --soft: #23232C; --soft2: #2D2D38; --ink: #F4F3EE; --muted: #A6A3AE;
    --line: #2B2B35; --line2: #22222A; --code: #16161C; --rule: #F4F3EE; --field: #3A3A46; --hard: #000000;
    --lime: #D2FF48; --tomato: #FF6B4A; --cobalt: #6F8CFF; --sun: #FFCF4D; --pink: #FF86D8; --mint: #3FE0AA;
    --lime-ink: #D2FF48; --tomato-ink: #FF8A6E; --cobalt-ink: #93A9FF; --sun-ink: #FFD36A; --pink-ink: #FF9EDF; --mint-ink: #5BE8B7;
    --accent-ink: #121116; --tint: 22%; --dots: rgba(244, 243, 238, .08); --scrim: rgba(0, 0, 0, .6); --on-cobalt: #121116;
  }
}
/* adından türeyen sabit renk */
[data-c="0"] { --hue: var(--lime); --hue-ink: var(--lime-ink); }
[data-c="1"] { --hue: var(--tomato); --hue-ink: var(--tomato-ink); }
[data-c="2"] { --hue: var(--cobalt); --hue-ink: var(--cobalt-ink); }
[data-c="3"] { --hue: var(--sun); --hue-ink: var(--sun-ink); }
[data-c="4"] { --hue: var(--pink); --hue-ink: var(--pink-ink); }
[data-c="5"] { --hue: var(--mint); --hue-ink: var(--mint-ink); }

* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--soft2) transparent; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font: 450 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
body.noscroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
input[type=checkbox], input[type=radio] { accent-color: var(--cobalt); width: 15px; height: 15px; }
::selection { background: var(--lime); color: #121116; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
/* mono yalnızca 400 ağırlıkta: kalın bağlamda sahte kalın üretilmesin */
code, .mono, pre, textarea { font-synthesis: none; }
h1, h2, h3 { margin: 0; font-weight: 700; }
.hint { color: var(--muted); font-size: 12.5px; }
.grow { flex: 1; }
select { appearance: none; -webkit-appearance: none; padding-right: 30px !important; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 16px) 52%, calc(100% - 11px) 52%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
select option { background: var(--card); color: var(--ink); }
input[list]::-webkit-calendar-picker-indicator { opacity: .4; cursor: pointer; }

/* ---------------------------------------------------------------- üst çubuk */
.top { position: relative; z-index: 20; flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 10px 20px; padding: 12px 22px; background: var(--panel); border-bottom: 2px solid var(--rule); }
.brand { display: flex; align-items: center; gap: 11px; white-space: nowrap; font: 800 22px/1 var(--display); font-variation-settings: "opsz" 32; letter-spacing: -.035em; }
.brand .mark { flex: none; overflow: visible; }
.mark > * { transform-box: fill-box; transform-origin: center; animation: shape-pop .7s var(--spring) backwards; transition: transform .45s var(--spring); }
.mark .m1 { fill: var(--lime); stroke: var(--rule); stroke-width: 1.6; }
.mark .m2 { fill: var(--tomato); animation-delay: .08s; }
.mark .m3 { fill: var(--cobalt); animation-delay: .16s; }
.mark .m4 { fill: var(--sun); animation-delay: .24s; }
.brand:hover .m1 { transform: scale(1.15); }
.brand:hover .m2 { transform: rotate(90deg); }
.brand:hover .m3 { transform: rotate(-12deg) scale(.9); }
.brand:hover .m4 { transform: translateY(-3px); }
#mkCur { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; background: var(--soft); box-shadow: none; border-radius: 999px; padding: 5px 13px 5px 11px; font: 600 12px/1.4 var(--sans); color: var(--muted); }
#mkCur::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--mint); margin-right: 7px; vertical-align: 0; box-shadow: 0 0 0 3px color-mix(in srgb, var(--mint) 30%, transparent); }
#mkCur:empty { display: none; }
#mkCur:hover:not(:disabled) { transform: none; box-shadow: none; background: var(--soft2); color: var(--ink); }
#mkCur b { color: var(--ink); }
.searchbox { flex: 1 1 260px; max-width: 520px; }
.searchbox input { width: 100%; padding: 9px 18px; border: 2px solid transparent; border-radius: 999px; background: var(--soft); font-size: 14px; font-weight: 500; transition: border-color .2s, background-color .2s, box-shadow .25s var(--ease); }
.searchbox input::placeholder { color: var(--muted); }
.searchbox input:hover { border-color: var(--field); }
.searchbox input:focus { outline: 0; border-color: var(--rule); background: var(--card); box-shadow: 0 0 0 4px color-mix(in srgb, var(--cobalt) 25%, transparent); }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: auto; }
/* üst çubuktaki ikincil düğmeler: her biri üzerine gelince kendi renginde parlar */
.top .actions > .btn:not(.primary) { border: 0; border-radius: 999px; background: transparent; box-shadow: none; padding: 8px 14px; font-weight: 650; }
.top .actions > .btn:not(.primary):hover:not(:disabled) { transform: translateY(-1px); box-shadow: none; background: color-mix(in srgb, var(--cobalt) var(--tint), var(--panel)); }
.top .actions > .btn:nth-of-type(3):hover:not(:disabled) { background: color-mix(in srgb, var(--tomato) var(--tint), var(--panel)); }
.top .actions > .btn:nth-of-type(4):hover:not(:disabled) { background: color-mix(in srgb, var(--pink) var(--tint), var(--panel)); }
.top .actions > .btn:nth-of-type(5):hover:not(:disabled) { background: color-mix(in srgb, var(--sun) 32%, var(--panel)); }
.top .actions > .btn.primary { border-radius: 999px; margin-right: 6px; padding: 7px 16px; }
.langsw { margin: 0 0 0 6px !important; border-radius: 999px !important; }
.langsw button { padding: 4px 10px !important; font-size: 11.5px !important; }
.only-narrow { display: none; }

/* ---------------------------------------------------------------- düğmeler */
.btn { position: relative; border: 2px solid var(--rule); background: var(--card); color: var(--ink); border-radius: 12px; padding: 6px 14px; line-height: 1.35;
  font-weight: 700; font-size: 13.5px; box-shadow: 3px 3px 0 var(--hard); transition: transform .25s var(--spring), box-shadow .25s var(--spring), background-color .2s, color .2s; }
.btn:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--hard); }
.btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--hard); transition-duration: .06s; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--red); }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
.btn.ghost:hover:not(:disabled) { transform: none; box-shadow: none; background: var(--soft); }
.btn.ghost:active:not(:disabled) { transform: scale(.97); }
.btn.sm { padding: 2px 10px; font-size: 12px; border-radius: 9px; box-shadow: 2px 2px 0 var(--hard); }
.btn.sm:hover:not(:disabled) { box-shadow: 3px 3px 0 var(--hard); transform: translate(-1px, -1px); }
.btn.sm:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--hard); }
.btn.ghost.sm, .btn.ghost.sm:hover:not(:disabled) { box-shadow: none; }
.btn:disabled { opacity: .4; cursor: default; box-shadow: none; }
.link { border: 0; background: none; padding: 0; color: var(--link); text-align: left; font-weight: 600; text-decoration: underline 1.5px; text-decoration-color: color-mix(in srgb, var(--link) 35%, transparent); text-underline-offset: 3px; transition: text-decoration-color .2s; }
.link:hover { text-decoration-color: currentColor; }
.badge { display: inline-block; min-width: 19px; height: 19px; padding: 0 6px; border-radius: 999px; background: var(--tomato); color: #fff; font: 800 11px/19px var(--sans); text-align: center; margin-left: 6px; vertical-align: 1px; }
.badge.warn { background: var(--sun); color: #121116; }

/* ---------------------------------------------------------------- yerleşim */
.shell { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(290px, 356px) minmax(0, 1fr); }
aside { border-right: 2px solid var(--rule); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
/* sağ alan: nokta ızgaralı tuval */
main { overflow: auto; padding: 32px 36px 80px; min-width: 0; background-image: radial-gradient(var(--dots) 1.2px, transparent 1.6px); background-size: 22px 22px; background-attachment: local; }
@media (min-width: 901px) {
  aside { animation: slide-in .6s var(--ease) backwards .1s; }
  main { animation: fade .5s ease backwards .2s; }
}
.filters { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
.frow { display: flex; gap: 8px; }
.chk { display: flex; align-items: center; gap: 8px; margin: 10px 2px 2px; color: var(--muted); font-size: 12.5px; }
.tagbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 2px; }
.tagbtn { border: 1.5px solid transparent; background: var(--soft); border-radius: 999px; padding: 1px 10px; font: 650 12px/1.6 var(--sans); color: var(--ink); transition: transform .25s var(--spring), border-color .15s, background-color .15s; }
.tagbtn[data-c] { background: color-mix(in srgb, var(--hue) var(--tint), var(--panel)); }
.tagbtn:hover { border-color: var(--rule); transform: translateY(-1px) rotate(-2deg); }
.tagbtn.on { background: var(--hue, var(--lime)); border-color: var(--rule); box-shadow: 2px 2px 0 var(--hard); color: #121116; }
.tagbtn .n { opacity: .55; margin-left: 5px; font-weight: 600; }
.listhead { display: flex; align-items: center; gap: 8px; padding: 14px 16px 8px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .02em; }
.listhead.tools { gap: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--line); letter-spacing: 0; }
.list { overflow: auto; flex: 1; padding: 6px 0 40px; }
.empty { padding: 16px; color: var(--muted); }

/* ---------------------------------------------------------------- ağaç */
.row { position: relative; display: flex; align-items: center; gap: 8px; min-height: 32px; margin: 1px 8px; padding: 4px 6px 4px calc(8px + var(--d, 0) * 16px); border-radius: 10px; cursor: pointer; transition: background-color .15s; }
.row:hover, .row[aria-selected="true"] { background: var(--soft); }
.row:focus-visible { outline: 3px solid var(--focus); outline-offset: -1px; }
.row.active { background: var(--accent); color: var(--accent-ink); box-shadow: inset 0 0 0 2px var(--rule); }
.row.active .name { font-weight: 750; }
.row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.row.dir .name { color: var(--muted); font-weight: 650; }
.row.plugin .name { font-weight: 700; }
.row .cnt { color: var(--muted); font-size: 11px; font-weight: 700; background: var(--soft); border-radius: 999px; padding: 0 7px; line-height: 18px; }
.row:hover .cnt { background: var(--panel); }
.row.active .cnt { background: rgba(255, 255, 255, .55); color: #121116; }
.row.active .pill { color: #121116; border-color: #121116; background: transparent; }
.more { opacity: 0; margin-left: auto; border: 0; background: none; color: var(--muted); padding: 0 8px; border-radius: 8px; font-weight: 800; }
.row:hover .more, .row:focus-within .more, .row.active .more { opacity: 1; }
@media (hover: none) { .more { opacity: 1; } }
.caret { flex: none; width: 0; height: 0; border-left: 5px solid var(--muted); border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .3s var(--spring); margin: 0 3px 0 1px; }
.caret.open { transform: rotate(90deg); }
.row.active .caret { border-left-color: currentColor; }
.sect { display: flex; align-items: center; gap: 7px; padding: 12px 12px 4px; color: var(--muted); font-size: 12.5px; cursor: pointer; }
/* durum noktaları: renk + biçim (taslak halka, kararlı dolu, arşiv çizik) */
.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--field); }
.dot.taslak { border: 2.5px solid var(--sun); }
.dot.kararli { background: var(--mint); border-color: var(--mint); }
.dot.arsiv { border-color: var(--muted); background: linear-gradient(135deg, transparent 40%, var(--muted) 40% 60%, transparent 60%); opacity: .7; }
.row.active .dot { border-color: #121116; }
.row.active .dot.kararli { background: #121116; }
.pill { display: inline-block; font: 700 11px/1.6 var(--sans); padding: 0 8px; border-radius: 999px; border: 1.5px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill[data-c] { border-color: transparent; color: var(--ink); background: color-mix(in srgb, var(--hue) var(--tint), var(--card)); }
.pill.ok { color: var(--green); border-color: color-mix(in srgb, var(--mint) 55%, transparent); background: color-mix(in srgb, var(--mint) 14%, transparent); }
.pill.warn { color: var(--amber); border-color: color-mix(in srgb, var(--sun) 70%, transparent); background: color-mix(in srgb, var(--sun) 18%, transparent); }
.pill.bad { color: var(--red); border-color: color-mix(in srgb, var(--tomato) 60%, transparent); background: color-mix(in srgb, var(--tomato) 12%, transparent); }

/* ---------------------------------------------------------------- arama sonuçları */
.res { margin: 4px 8px; padding: 10px 12px 11px; cursor: pointer; border-radius: 14px; border: 2px solid transparent; transition: background-color .15s, border-color .15s, transform .25s var(--spring); }
.res:hover, .res[aria-selected="true"] { background: var(--soft); }
.res.active { background: var(--accent); color: var(--accent-ink); border-color: var(--rule); }
.res.active .rp, .res.active .rs { color: #121116; opacity: .75; }
.res.active .dot { border-color: #121116; }
.res-note { padding: 10px 16px 14px; }
.rt { display: flex; align-items: center; gap: 8px; font-weight: 750; }
.rp { color: var(--muted); font-size: 11.5px; margin-left: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rs { margin: 4px 0 0 18px; color: var(--muted); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rtags { margin: 7px 0 0 18px; display: flex; flex-wrap: wrap; gap: 4px; }
mark { background: color-mix(in srgb, var(--lime) 80%, transparent); color: #121116; border-radius: 4px; padding: 0 2px; }
.res.active mark { background: #121116; color: var(--lime); }

/* ---------------------------------------------------------------- editör kartı */
.card { position: relative; max-width: 1000px; margin: 0 auto; background: var(--card); border: 2px solid var(--rule); border-top: 12px solid var(--hue, var(--lime)); border-radius: 26px; padding: 26px 38px 34px;
  box-shadow: 8px 8px 0 var(--hard); }
.crumbs { color: var(--muted); font-size: 12.5px; font-weight: 600; margin-bottom: 10px; word-break: break-all; }
.crumbs::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--hue, var(--lime)); border: 1.5px solid var(--rule); margin-right: 9px; vertical-align: -1px; transform: rotate(12deg); }
.crumbs .sep { margin: 0 6px; opacity: .5; }
.crumbs .link { font-size: inherit; }
.titlebar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.title { flex: 1 1 320px; min-width: 0; font: 800 clamp(30px, 3.4vw, 46px)/1.05 var(--display); font-variation-settings: "opsz" 96; letter-spacing: -.04em;
  border: 0; background: transparent; padding: 6px 10px; margin: 0 0 0 -10px; border-radius: 14px; color: var(--ink); transition: background-color .2s, box-shadow .25s var(--ease); }
.title::placeholder { color: var(--muted); opacity: .5; }
.title:hover { background: var(--soft); }
.title:focus { outline: 0; background: var(--soft); box-shadow: inset 0 -4px 0 var(--hue, var(--lime)); }
.title.static { overflow-wrap: anywhere; }
.title.static:hover { background: transparent; }
.tbtns { display: flex; gap: 10px; }
/* sekmeler: kayan hap */
.tabs { display: inline-flex; gap: 2px; margin: 22px 0 0; padding: 4px; background: var(--soft); border-radius: 999px; }
.tab { border: 0; background: none; padding: 7px 18px; border-radius: 999px; color: var(--muted); font-weight: 700; font-size: 13.5px; transition: background-color .2s, color .2s, transform .25s var(--spring); }
.tab:hover { color: var(--ink); background: var(--soft2); }
.tab:active { transform: scale(.96); }
.tab.on { background: var(--ink); color: var(--card); box-shadow: 0 2px 0 var(--hue, var(--lime)); }
.pane { padding-top: 22px; }
.banner { border: 2px solid var(--rule); background: color-mix(in srgb, var(--sun) 22%, var(--card)); padding: 10px 14px; border-radius: 14px; margin: 14px 0 0; }
.banner .btn { margin-left: 10px; }

/* form: dolgu alanlar, odakta mürekkep çerçeve + kobalt hale */
.btns { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.vcard .btns { margin-top: 4px; }
:where(input:not([type=checkbox], [type=radio], [type=range], [type=file], [type=color]), select) {
  padding: 7px 12px; border: 2px solid transparent; border-radius: 12px; background-color: var(--soft); color: var(--ink); transition: border-color .2s, background-color .2s, box-shadow .25s var(--ease); }
:where(input:not([type=checkbox], [type=radio], [type=range], [type=file], [type=color]), select):hover { border-color: var(--field); }
:where(input:not([type=checkbox], [type=radio], [type=range], [type=file], [type=color]), select):focus { outline: 0; border-color: var(--rule); background-color: var(--card); box-shadow: 0 0 0 4px color-mix(in srgb, var(--cobalt) 22%, transparent); }
.meta { display: grid; grid-template-columns: 126px minmax(0, 1fr); gap: 10px 18px; align-items: center; padding-bottom: 18px; }
.meta > label { color: var(--muted); font-size: 12.5px; font-weight: 700; }
.meta input:not([type=checkbox]):not([type=radio]):not(.chip-in), .meta select, .stack input:not([type=checkbox]):not([type=radio]), .stack select,
.grid2 input:not([type=checkbox]):not([type=radio]), .grid2 select, .gitleft input:not([type=checkbox]), .pkdesc input, .commitbar input, .frow select { width: 100%; }
.frow select { flex: 1; min-width: 0; width: auto; font-size: 13px; font-weight: 600; padding-top: 6px; padding-bottom: 6px; }
.stack textarea, .gitleft textarea { width: 100%; padding: 10px 12px; border: 2px solid var(--field); border-radius: 14px; background: var(--card); transition: border-color .2s, box-shadow .25s var(--ease); }
.stack textarea:focus, .gitleft textarea:focus { outline: 0; border-color: var(--rule); box-shadow: 0 0 0 4px color-mix(in srgb, var(--cobalt) 22%, transparent); }
.grid2 label.chk { display: flex; }
.inline { display: flex; gap: 10px; align-items: center; }
.inline input { flex: 1; }
.commitbar { display: flex; gap: 12px; align-items: center; margin: 14px 0 4px; }
.commitbar .hint { font-weight: 650; white-space: nowrap; }
.commitbar input { flex: 1; }
#verWarn { margin-left: 8px; }
.bumpopts { border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; }
.bumpopts label { display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border: 2px solid transparent; border-radius: 12px; background: var(--soft); padding: 4px 6px; min-height: 38px; transition: border-color .2s, background-color .2s, box-shadow .25s var(--ease); }
.chips:hover { border-color: var(--field); }
.chips:focus-within { border-color: var(--rule); background: var(--card); box-shadow: 0 0 0 4px color-mix(in srgb, var(--cobalt) 22%, transparent); }
.chip { display: inline-flex; align-items: center; background: color-mix(in srgb, var(--hue, var(--cobalt)) var(--tint), var(--card)); color: var(--ink); border: 1.5px solid color-mix(in srgb, var(--hue, var(--cobalt)) 55%, transparent); border-radius: 999px; padding: 0 2px 0 10px; font-size: 12.5px; font-weight: 650; }
.chip button { border: 0; background: none; color: inherit; padding: 0 6px; line-height: 1.5; font-size: 15px; border-radius: 999px; }
.chip button:hover { background: var(--ink); color: var(--card); }
.meta .chips input.chip-in, .chips input.chip-in { border: 0; outline: 0; box-shadow: none; background: transparent; flex: 1; min-width: 100px; width: auto; padding: 3px 4px; }
/* yayın ayarları paneli */
details.pub { margin: 6px 0 22px; border: 2px dashed var(--field); border-radius: 20px; background: color-mix(in srgb, var(--cobalt) 5%, var(--card)); transition: border-color .2s, background-color .2s; }
details.pub[open] { border-style: solid; border-color: var(--rule); }
details.pub > summary { list-style: none; padding: 13px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-radius: 18px; }
details.pub > summary::-webkit-details-marker { display: none; }
details.pub > summary::before { content: "+" / ""; flex: none; display: grid; place-items: center; width: 26px; height: 26px; border: 2px solid var(--rule); border-radius: 50%; background: var(--lime); color: #121116; font: 800 16px/1 var(--sans); transition: transform .45s var(--spring); }
details.pub[open] > summary::before { transform: rotate(135deg); }
details.pub summary b { font: 750 17px/1.2 var(--display); font-variation-settings: "opsz" 24; letter-spacing: -.02em; }
details.pub .meta { padding: 4px 16px 14px 54px; margin: 0; }
details.pub > .issue { margin: 0 16px 8px 54px; }
.pubfoot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 0 16px 16px 54px; }
/* gövde editörü */
.bodywrap { margin-top: 4px; }
.bodywrap textarea, #fRaw { width: 100%; min-height: 320px; resize: vertical; padding: 22px 26px 26px; border: 2px solid var(--rule); border-radius: 20px; background: var(--code); color: var(--ink);
  font: 400 14px/1.75 var(--mono); tab-size: 2; transition: box-shadow .3s var(--spring), transform .3s var(--spring); }
.bodywrap textarea::placeholder, #fRaw::placeholder { color: var(--muted); }
.bodywrap textarea:focus, #fRaw:focus { outline: 0; background: var(--card); box-shadow: 6px 6px 0 var(--hue, var(--lime)); transform: translate(-2px, -2px); }
.bodyinfo { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-size: 12px; font-weight: 650; }
.bodyinfo > * { background: var(--soft); border-radius: 999px; padding: 2px 10px; }
.bodyinfo:empty { display: none; }

/* ---------------------------------------------------------------- geçmiş / fark */
.hist { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 20px; }
.commits { list-style: none; margin: 0; padding: 6px; border: 2px solid var(--line); border-radius: 18px; max-height: 60vh; overflow: auto; background: var(--card); }
.commits li { padding: 9px 12px; border-radius: 12px; cursor: pointer; transition: background-color .15s; }
.commits li + li { margin-top: 2px; }
.commits li:hover { background: var(--soft); }
.commits li.on { background: var(--accent); color: var(--accent-ink); box-shadow: inset 0 0 0 2px var(--rule); }
.commits li.on .hint { color: #121116; opacity: .75; }
.commits .s { font-weight: 750; overflow-wrap: anywhere; }
.diffhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.diff { font: 12.5px/1.65 var(--mono); background: var(--code); border: 2px solid var(--line); border-radius: 18px; padding: 12px 0; overflow: auto; max-height: 62vh; margin: 0; }
.dl { display: block; padding: 0 14px; white-space: pre; }
.dl.add { background: color-mix(in srgb, var(--mint) 22%, transparent); box-shadow: inset 4px 0 0 var(--mint); }
.dl.del { background: color-mix(in srgb, var(--tomato) 18%, transparent); box-shadow: inset 4px 0 0 var(--tomato); }
.dl.hunk { color: var(--cobalt-ink); }
.dl.meta { color: var(--muted); }
.seg { display: inline-flex; gap: 2px; padding: 4px; background: var(--soft); border-radius: 999px; margin: 0 0 14px; vertical-align: middle; }
.seg button { border: 0; background: transparent; padding: 5px 14px; border-radius: 999px; color: var(--muted); font-size: 13px; font-weight: 700; transition: background-color .2s, color .2s; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.timeline li { padding: 0; cursor: default; }
.timeline .tl { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 12px; border-radius: 12px; font: inherit; color: inherit; cursor: pointer; transition: background-color .15s; }
.timeline .tl:hover { background: var(--soft); }
.timeline .tl[aria-current="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: inset 0 0 0 2px var(--rule); }
.timeline .tl[aria-current="true"] .hint, .timeline .tl[aria-current="true"] .pill { color: #121116; }
.timeline .tl .s { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.vbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.vbar label { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-weight: 650; }
.vcard { border: 2px solid var(--rule); border-radius: 18px; padding: 12px 16px; margin-bottom: 14px; display: grid; gap: 6px; background: var(--card); box-shadow: 4px 4px 0 var(--hue, var(--lime)); }
.vcard .note { white-space: pre-wrap; overflow-wrap: anywhere; }
.fdiff { width: 100%; border-collapse: collapse; margin: 0 0 14px; font-size: 13px; }
.fdiff caption { text-align: left; font: 750 16px/1.3 var(--display); padding: 4px 0 6px; }
.fdiff th, .fdiff td { text-align: left; vertical-align: top; padding: 7px 8px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.fdiff th { color: var(--muted); font-size: 12px; }
.fdiff .chip { padding: 0 10px; margin: 0 4px 4px 0; }
ins.wd, ins.chip { text-decoration: none; background: color-mix(in srgb, var(--mint) 30%, transparent); color: inherit; border-radius: 4px; }
del.wd, del.chip { text-decoration: line-through; background: color-mix(in srgb, var(--tomato) 24%, transparent); color: inherit; border-radius: 4px; }
ins, del { text-decoration-thickness: 1.5px; }
.restorebar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.gfile { border-bottom: 1px solid var(--line); padding: 7px 10px; }
.gfile summary { cursor: pointer; overflow-wrap: anywhere; }
.gfile .gcs { display: grid; gap: 3px; padding: 6px 0 6px 14px; }
.gfile .gcs button.link { text-align: left; }
.gfile .link.on { color: var(--ink); background: var(--lime); border-radius: 4px; text-decoration: none; padding: 0 4px; }
.gfilelist { border: 2px solid var(--line); border-radius: 18px; max-height: 62vh; overflow: auto; background: var(--card); }

/* ---------------------------------------------------------------- başlangıç: bento ön sayfa */
.start { max-width: 760px; margin: 4vh auto 0; }
.start h1 { font: 800 clamp(34px, 4.4vw, 54px)/1.02 var(--display); font-variation-settings: "opsz" 96; letter-spacing: -.045em; margin-bottom: 14px; text-wrap: balance; }
.start p { color: var(--muted); max-width: 56ch; font-size: 15px; line-height: 1.6; }
.start .btns { display: flex; gap: 12px; flex-wrap: wrap; margin: 22px 0 30px; }
.start h2 { font: 750 18px/1.2 var(--display); letter-spacing: -.02em; margin-bottom: 12px; }
.start h1:focus { outline: 0; }
.start.home { max-width: 1180px; margin: 0 auto; }
.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; }
.tile { position: relative; min-width: 0; border: 2px solid var(--rule); border-radius: 28px; padding: 24px 26px; background: var(--card); box-shadow: 6px 6px 0 var(--hard); overflow: hidden;
  animation: tile-in .7s var(--spring) backwards; transition: transform .35s var(--spring), box-shadow .35s var(--spring); }
.tile:hover { transform: translate(-3px, -3px); box-shadow: 9px 9px 0 var(--hard); }
.tile.hero { grid-column: span 8; grid-row: span 2; background: var(--lime); color: #121116; padding: 40px 42px 36px; display: flex; flex-direction: column; justify-content: flex-end; min-height: 360px; }
.tile.hero:hover { transform: none; box-shadow: 6px 6px 0 var(--hard); }
.hero-txt { position: relative; z-index: 1; max-width: 62%; }
.hero h1 { font-size: clamp(44px, 5.2vw, 84px); line-height: .92; letter-spacing: -.055em; font-variation-settings: "opsz" 96; font-stretch: 88%; margin-bottom: 18px; }
.hero p { color: #121116; opacity: .78; font-size: 16px; font-weight: 500; }
.hero .btns { margin: 22px 0 0; }
.hero .btn.primary { background: #121116; color: var(--lime); border-color: #121116; }
.hero .btn:not(.primary) { background: #fff; color: #121116; border-color: #121116; }
.hero .btn { box-shadow: 3px 3px 0 #121116; }
.hero .btn:hover:not(:disabled) { box-shadow: 5px 5px 0 #121116; }
/* Memphis şekilleri (süs) */
/* şekiller karonun sağ %38'inde kalır, başlıkla çakışmaz */
.shapes { position: absolute; top: 0; right: 0; bottom: 0; width: 38%; pointer-events: none; }
.shapes i, .shapes svg { position: absolute; display: block; }
.shapes .s1 { width: 170px; height: 170px; right: -46px; top: -50px; border-radius: 50%; background: var(--tomato); border: 2px solid #121116; animation: float 9s ease-in-out infinite; }
.shapes .s2 { width: 96px; height: 96px; left: 4%; top: 30%; background: var(--cobalt); border: 2px solid #121116; border-radius: 0 0 0 96px; animation: float 7s ease-in-out infinite reverse; }
.shapes .s3 { width: 70px; height: 70px; right: 12%; top: 46%; border-radius: 50%; border: 13px solid var(--pink); outline: 2px solid #121116; outline-offset: -2px; animation: spin 18s linear infinite; }
.shapes .s4 { width: 62px; height: 31px; left: 14%; bottom: 20%; background: var(--sun); border: 2px solid #121116; border-radius: 62px 62px 0 0; animation: float 6s ease-in-out infinite 1s; }
.shapes .s5 { right: 8%; bottom: 10%; width: 120px; height: 24px; fill: none; stroke: #121116; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; animation: wiggle 4s ease-in-out infinite; }
.shapes .s6 { width: 16px; height: 16px; left: 44%; top: 14%; background: #121116; border-radius: 50%; animation: float 5s ease-in-out infinite .5s; }
.tile.stat { grid-column: span 4; background: var(--tomato); color: #121116; animation-delay: .08s; }
.tile.types { grid-column: span 4; background: var(--cobalt); color: var(--on-cobalt); animation-delay: .16s; }
.tile .big { font: 800 clamp(64px, 7vw, 104px)/.85 var(--display); font-variation-settings: "opsz" 96; letter-spacing: -.06em; font-feature-settings: "tnum"; }
.bar { display: flex; height: 16px; margin: 16px 0 12px; border: 2px solid #121116; border-radius: 999px; overflow: hidden; background: #fff; }
.bar > span { min-width: 6px; border-right: 2px solid #121116; animation: grow .9s var(--spring) backwards .4s; transform-origin: left; }
.bar > span:last-child { border-right: 0; }
.bar .b-kararli { background: var(--mint); } .bar .b-taslak { background: var(--sun); } .bar .b-arsiv { background: #8F8B96; } .bar .b-bos { background: #fff; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; font-size: 13px; font-weight: 650; }
.legend li { display: flex; align-items: center; gap: 7px; min-width: 0; }
.legend b { margin-left: auto; font-weight: 800; }
.legend .dot { border-color: #121116; background: #fff; }
.legend .dot.kararli { background: var(--mint); } .legend .dot.taslak { background: var(--sun); border-width: 2px; } .legend .dot.arsiv { background: #8F8B96; opacity: 1; }
.types ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
.types li { display: grid; gap: 2px; }
.types li b { font: 800 44px/.9 var(--display); letter-spacing: -.05em; }
.types li span { font-size: 13px; font-weight: 700; opacity: .85; }
.tile.tags { grid-column: span 4; animation-delay: .24s; }
.tile.front { grid-column: span 8; animation-delay: .3s; }
.tile.tags h2, .tile.front h2 { display: flex; align-items: center; gap: 10px; }
.tile.tags h2::before, .tile.front h2::before { content: ""; width: 14px; height: 14px; border: 2px solid var(--rule); flex: none; }
.tile.tags h2::before { background: var(--pink); border-radius: 50%; }
.tile.front h2::before { background: var(--sun); border-radius: 4px; transform: rotate(45deg); }
.tagcloud { display: flex; flex-wrap: wrap; gap: 8px; }
.tagcloud .tagbtn { font-size: 13.5px; padding: 4px 13px; border: 2px solid var(--rule); }
.tagcloud .tagbtn:hover { box-shadow: 3px 3px 0 var(--hard); transform: translate(-1px, -2px) rotate(-3deg); }
.recent { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
.recent .res { margin: 0; padding: 10px 12px 11px 14px; border: 2px solid var(--line); border-radius: 16px; border-left: 8px solid var(--hue, var(--field)); }
.recent .res:hover { border-color: var(--rule); border-left-color: var(--hue, var(--field)); background: var(--card); transform: translateY(-2px); box-shadow: 3px 3px 0 var(--hard); }
.recent .rt { font-size: 14.5px; }
.recent .rp { margin-left: 18px; white-space: normal; overflow-wrap: anywhere; }

/* ---------------------------------------------------------------- pencere (modal) */
.overlay { position: fixed; inset: 0; z-index: 50; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px;
  background: var(--scrim); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); animation: fade .2s ease backwards; }
.modal { background: var(--card); border: 2px solid var(--rule); border-radius: 26px; width: min(640px, 100%); box-shadow: 10px 10px 0 var(--hard); animation: modal-in .45s var(--spring) backwards; }
.modal.wide { width: min(1080px, 100%); }
.mhead { display: flex; align-items: center; gap: 12px; padding: 20px 24px 12px 26px; }
.mhead h2 { flex: 1; font: 800 25px/1.12 var(--display); font-variation-settings: "opsz" 48; letter-spacing: -.035em; }
.mhead h2::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 10px; border-radius: 50%; background: var(--lime); border: 2px solid var(--rule); vertical-align: 3px; }
.mhead .btn.ghost { border-radius: 999px; background: var(--soft); }
.mbody { padding: 8px 26px 26px; }
.stack { display: grid; gap: 14px; }
.stack label, .grid2 label { display: grid; gap: 5px; font-weight: 650; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
.span2 { grid-column: 1 / -1; }
.foot { display: flex; justify-content: flex-end; gap: 12px; margin-top: 12px; }
.foot-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.mbody h3 { display: flex; align-items: center; gap: 10px; font: 750 17px/1.25 var(--display); letter-spacing: -.02em; margin: 26px 0 10px; }
.mbody h3::after { content: ""; flex: 1; height: 2px; border-radius: 2px; background: var(--line); }
.mbody h3:first-child { margin-top: 0; }
.ftable { border: 2px solid var(--line); border-radius: 16px; max-height: 38vh; overflow: auto; }
.frowi { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.frowi:last-child { border-bottom: 0; }
.frowi .pv { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mkrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px 14px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.mkrow:last-child { border-bottom: 0; }
.mklist { border: 2px solid var(--line); border-radius: 18px; overflow: hidden; }
.mkbtns { display: flex; gap: 8px; }
.issue { font-size: 12.5px; font-weight: 600; }
.issue.error { color: var(--red); } .issue.warn { color: var(--amber); } .issue.info { color: var(--muted); }
.cmd { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
.cmd code { flex: 1; background: var(--code); border: 2px solid var(--line); border-radius: 12px; padding: 7px 12px; overflow-x: auto; white-space: nowrap; }
.gitgrid { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 20px; }
.gitleft { display: grid; gap: 12px; align-content: start; min-width: 0; overflow-wrap: anywhere; }
.gf { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.gf:last-child { border-bottom: 0; }
.gf .link { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gf.on { background: color-mix(in srgb, var(--lime) 40%, var(--card)); }
details summary { cursor: pointer; }
fieldset { border: 2px solid var(--line); border-radius: 16px; padding: 8px 14px 12px; margin: 0; min-width: 0; }
legend { padding: 0 6px; color: var(--muted); font-size: 12.5px; font-weight: 700; }

/* ---------------------------------------------------------------- açılır menü, bildirimler */
.menu { position: fixed; z-index: 60; background: var(--card); border: 2px solid var(--rule); border-radius: 16px; box-shadow: 5px 5px 0 var(--hard); padding: 6px; min-width: 210px; animation: pop .25s var(--spring) backwards; transform-origin: top left; }
.menu .mi { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 8px 12px; border-radius: 10px; font-weight: 600; }
.menu .mi:hover, .menu .mi:focus { background: var(--lime); color: #121116; outline: 0; }
.menu .mi.danger { color: var(--red); }
.menu .mi.danger:hover, .menu .mi.danger:focus { background: var(--tomato); color: #fff; }
#toasts { position: fixed; right: 22px; bottom: 22px; display: grid; justify-items: end; gap: 10px; z-index: 70; max-width: min(440px, calc(100vw - 44px)); }
.toast { background: var(--lime); color: #121116; border: 2px solid #121116; border-radius: 999px; padding: 10px 20px; font-weight: 750; box-shadow: 4px 4px 0 #121116;
  transition: opacity .3s, transform .3s var(--ease); animation: toast-in .55s var(--spring) backwards; }
.toast.error { background: var(--tomato); color: #fff; border-radius: 18px; }
.toast.warn { background: var(--sun); color: #121116; border-radius: 18px; }

<script>
(() => {
'use strict';

/* ---------------------------------------------------------------- yardımcılar */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fold = FM.fold;
const str = (v) => (Array.isArray(v) ? v.join(', ') : v == null ? '' : String(v));
const toList = (v) => (Array.isArray(v) ? v : String(v == null ? '' : v).split(',')).map((s) => String(s).trim()).filter(Boolean);
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* özel pencere */ } }
};
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const today = () => new Date().toLocaleDateString('sv-SE');
const fmtDate = (iso) => I18n.date(iso);
const base = (p) => p.split('/').pop();
const stem = (p) => base(p).replace(/\.[^.]+$/, '');
const normTur = Rules.normTur;
const durumClass = (d) => { const f = fold(d || ''); return f === 'taslak' ? 'taslak' : f === 'kararli' ? 'kararli' : f === 'arsiv' ? 'arsiv' : ''; };

/** Summary: Ad -> 0..5 renk kodu (data-c). Aynı marketplace/plugin/etiket her yerde aynı renkte görünür; yalnızca görünüm içindir. */
function hueOf(s) {
  let h = 2166136261; // FNV-1a
  for (const ch of String(s || '').toLowerCase()) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
  h ^= h >>> 15;
  return (h >>> 0) % 6;
}

/** Summary: Çeviri işlevi (düz metin); HTML için I18n.th kullanılır. */
const tx = I18n.tx;
/** Summary: Çeviri işlevi (HTML); parametreler kaçışlanır. */
const th = I18n.th;

/** Summary: Kanonik tür değerinin (komut|ajan|skill) rozet etiketi; bilinmeyen değer ham döner. */
function turLabel(v) {
  if (v === 'komut') return tx('ui.common.turCommand');
  if (v === 'ajan') return tx('ui.common.turAgent');
  if (v === 'skill') return tx('ui.common.turSkill');
  return v == null ? '' : String(v);
}
/** Summary: Çözülen dilin açılış önbelleği anahtarı (kaynak sunucudaki ayardır, bu yalnızca titremeyi önler). */
const LANG_KEY = 'pp.lang';
/** Summary: Dil koduna karşılık gelen <html lang> değeri. */
const HTML_LANG = { tr: 'tr', en: 'en-US' };
/** Summary: Tarayıcının birinci dili (yoksa boş). */
const navLang = () => (navigator.languages && navigator.languages[0]) || navigator.language || '';
/** Summary: Dil ayarını (auto|tr|en) arayüz diline çözer; tarayıcı dili yoksa tr. */
const resolveLang = (setting) => I18n.resolve(setting, navLang() || 'tr');
/** Summary: Önbellekteki dili okur (erişilemezse null). */
const readLangCache = () => { try { return localStorage.getItem(LANG_KEY); } catch (e) { return null; } };
/** Summary: Çözülen dili önbelleğe yazar (erişilemezse sessizce atlanır). */
const writeLangCache = (lang) => { try { localStorage.setItem(LANG_KEY, lang); } catch (e) { return false; } return true; };

/** Summary: Açılış dili: pp.lang önbelleği, yoksa tarayıcı dili, o da yoksa tr. */
function startLanguage() {
  const cached = readLangCache();
  return I18n.LANGUAGES.includes(cached) ? cached : resolveLang('auto');
}

/** Summary: Dili uygular: I18n dili, <html lang> ve statik işaretleme (data-i18n*). */
function applyLanguage(lang) {
  const applied = I18n.setLanguage(lang);
  document.documentElement.lang = HTML_LANG[applied];
  I18n.applyDom(document);
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === applied)));
  return applied;
}

/** Summary: Sunucudaki dil ayarıyla yeniden çözer; dil ilk isteğinkinden farklıysa /api/info'yu bir kez yeniden çeker. */
async function syncLanguage(info) {
  const used = I18n.current();
  const lang = resolveLang(info.language);
  writeLangCache(lang);
  if (lang === used) return info;
  applyLanguage(lang);
  try { return await get('/api/info'); } catch (e) { return info; }
}

applyLanguage(startLanguage());

// Etkin marketplace gerektiren rotalar: bu isteklere X-PP-MP başlığı eklenir (başka sekmede geçiş yapıldıysa sunucu reddeder).
const MP_GUARDED = /^\/api\/(file|rename|mkdir|git\/|version|import\/|marketplace\/|package|prompts\/|history\/)/;
async function api(method, url, body) {
  const headers = { 'Content-Type': 'application/json', 'X-PP': '1' };
  if (S.info && S.info.activeMarketplace && MP_GUARDED.test(url)) headers['X-PP-MP'] = encodeURIComponent(S.info.activeMarketplace);
  headers['X-PP-Lang'] = I18n.current();
  const r = await fetch(url, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  let j = {}; try { j = await r.json(); } catch (e) { /* gövde yok */ }
  if (!r.ok) {
    const e = new Error(j.error || tx('ui.common.requestFailed', { status: r.status })); e.status = r.status; e.data = j;
    // Başka sekmede etkin marketplace değişti: yazma reddedildi; durumu eşle.
    if (r.status === 409 && j.code === 'etkinDegil') { e.etkinDegil = true; resyncActive(); }
    // Kurulum bozulduysa (örn. klasör dışarıdan silindi) kurulum ekranına düş; `conflict` 409'undan ayrı.
    if (r.status === 409 && j.setupRequired) { e.setupRequired = true; if (j.setup && S.info) onSetupLost(j.setup); }
    throw e;
  }
  return j;
}
const get = (u) => api('GET', u);
const qs = (o) => Object.keys(o).filter((k) => o[k] !== '' && o[k] != null && o[k] !== false).map((k) => k + '=' + encodeURIComponent(o[k])).join('&');

function toast(msg, kind, ms) {
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || 'ok');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  const d = ms || (kind === 'error' ? 7000 : 3000);
  setTimeout(() => t.classList.add('out'), d);
  setTimeout(() => t.remove(), d + 300);
}
// Hata iletisi: sunucunun Türkçe özeti + varsa git ayrıntısının ilk satırı (hook çıktısı kaybolmasın).
// Hem api() hatasını (message, data.gitDetail) hem de PUT /api/file commitError nesnesini (error, gitDetail) kabul eder.
function errText(e) {
  if (e == null) return '';
  if (typeof e !== 'object') return String(e);
  const msg = e.message || e.error || '';
  const detail = String((e.data && e.data.gitDetail) || e.gitDetail || '');
  const line = detail.split(/\r?\n/).map((s) => s.trim()).find(Boolean) || '';
  const cut = line.length > 160 ? line.slice(0, 159) + '…' : line;
  if (!cut || msg.includes(cut)) return msg;
  return msg ? tx('ui.common.errorDetail', { message: msg, detail: cut }) : cut;
}
const fail = (e) => { if (e && e.setupRequired) return; toast(errText(e) || String(e), 'error'); };

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* eski tarayıcı */ }
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}

function hl(text, tokens) {
  if (!tokens.length) return esc(text);
  const f = fold(text); const marks = [];
  for (const t of tokens) { let i = 0; while ((i = f.indexOf(t, i)) >= 0) { marks.push([i, i + t.length]); i += t.length; } }
  if (!marks.length) return esc(text);
  marks.sort((a, b) => a[0] - b[0]);
  const merged = [marks[0]];
  for (const m of marks.slice(1)) { const l = merged[merged.length - 1]; if (m[0] <= l[1]) l[1] = Math.max(l[1], m[1]); else merged.push(m); }
  let out = ''; let pos = 0;
  for (const [a, b] of merged) { out += esc(text.slice(pos, a)) + '<mark>' + esc(text.slice(a, b)) + '</mark>'; pos = b; }
  return out + esc(text.slice(pos));
}

function autosize(el) { if (!el) return; el.style.height = 'auto'; el.style.height = Math.max(300, el.scrollHeight + 4) + 'px'; }

/* --------------------------------------------------------------------- durum */
const S = {
  info: null, lib: null, gen: 0, model: [], modelMap: new Map(),
  facets: { tags: [], durum: [], tur: [], projeler: [], total: 0, yayinUyari: 0, yayinUyariByMp: {} },
  exp: new Map(),         // mp -> Set<marketplace'e göreli yol | '#teknik' | '#gelen' | '#klasorsuz'>
  mpOpen: new Set(),      // açık marketplace düğümleri (pp.agac.marketplaceler)
  gitlessOpen: false,     // "Git deposu olmayan klasörler" grubu (pp.agac.gitsiz)
  sel: null,              // { mp, key } seçili ağaç düğümü
  focusKey: null,         // roving tabindex: odaktaki satır
  f: { q: '', tags: [], durum: '', tur: '', scope: 'library' },
  results: null, resultsInfo: null, // resultsInfo: { total, limit, truncated } (sunucu 300'de keser)
  cur: null, git: null, tagsAll: false, recent: [], gitSel: null, mk: null,
  warnHidden: false,
  openSeq: 0,             // openFile çağrı sayacı: yavaş eski yanıt yenisini ezmesin
  lostEdit: null          // kurulum bozulunca kurtarılan kaydedilmemiş metin: { mp, path, raw, commitMsg }
};

const setupOk = () => !!(S.info && S.info.setup && S.info.setup.ok);
const rootOk = () => !!(S.info && S.info.setup && S.info.setup.rootOk);
const activeName = () => (S.info && S.info.activeMarketplace) || '';
const firstError = () => { const i = S.info && S.info.setup && S.info.setup.issues.find((x) => x.level === 'error'); return i ? i.message : ''; };
// localStorage anahtarları marketplace'e göre ayrılır: pp.<mp>.<ad>
const lsKey = (k, mp) => 'pp.' + (mp !== undefined ? mp : (activeName() || '_')) + '.' + k;
const nodeKey = (mp, rel) => mp + ':' + rel;
const mpByName = (n) => (S.lib && S.lib.marketplaces.find((m) => m.name === n)) || null;
const activeMp = () => { const m = mpByName(activeName()); return m && m.state === 'hazir' ? m : null; };
const pluginsOf = (mp) => { const m = typeof mp === 'string' ? mpByName(mp) : mp; return m ? m.plugins : []; };
const libDirOf = (mp) => {
  const m = mpByName(mp || activeName());
  return (m && m.libraryDir) || (S.info && S.info.config && S.info.config.libraryDir) || Rules.LIBRARY_DIR;
};
const pathSep = () => ((S.lib && S.lib.libraryRoot) || (S.info && S.info.libraryRoot) || '').includes('\\') ? '\\' : '/';

const isFiltering = () => !!(S.f.q.trim() || S.f.tags.length || S.f.durum || S.f.tur);

// Açık düğümler. Eski "__others" girdisi bir kez "#teknik"e çevrilir.
function expOf(mp) {
  let s = S.exp.get(mp);
  if (!s) {
    const raw = ls.get(lsKey('expanded', mp), null);
    s = new Set(Array.isArray(raw) ? raw : []);
    if (s.has('__others')) { s.delete('__others'); s.add('#teknik'); ls.set(lsKey('expanded', mp), Array.from(s)); }
    S.exp.set(mp, s);
  }
  return s;
}
const saveExp = (mp) => ls.set(lsKey('expanded', mp), Array.from(expOf(mp)));
const saveMpOpen = () => ls.set('pp.agac.marketplaceler', Array.from(S.mpOpen));

// İlk açılışta (kayıt yokken) etkin marketplace ve plugin'leri açılır.
function initExpansion() {
  const stored = ls.get('pp.agac.marketplaceler', null);
  if (Array.isArray(stored)) S.mpOpen = new Set(stored);
  else { S.mpOpen = new Set(activeName() ? [activeName()] : []); saveMpOpen(); }
  S.gitlessOpen = !!ls.get('pp.agac.gitsiz', false);
  ensureDefaultExp(activeName());
}
function ensureDefaultExp(name) {
  const m = mpByName(name);
  if (!m || m.state !== 'hazir') return;
  let has = null; try { has = localStorage.getItem(lsKey('expanded', name)); } catch (e) { has = ''; }
  if (has !== null) return;
  const ex = expOf(name);
  m.plugins.forEach((p) => ex.add(p.path));
  saveExp(name);
}

/* ------------------------------------------------------------------- yükleme */
async function loadLibrary() { S.lib = await get('/api/tree'); }
async function loadFacets() { S.facets = await get('/api/facets'); renderMkBadge(); }
function renderMkBadge() {
  const b = $('#mkBadge'); if (!b) return;
  const n = (S.facets && S.facets.yayinUyariByMp && S.facets.yayinUyariByMp[activeName()]) || 0;
  b.hidden = !n || !setupOk(); b.textContent = n;
  b.title = tx('ui.common.wontPublish', { count: n });
}
async function loadGit() {
  const gen = S.gen;
  if (!setupOk()) { S.git = { isRepo: false, error: firstError() }; renderGitBadge(); return S.git; }
  let g;
  try { g = await get('/api/git/status'); } catch (e) { g = { isRepo: false, error: e.message }; }
  if (gen !== S.gen) return S.git;
  S.git = g;
  renderGitBadge();
  syncCommitBar();
  return S.git;
}
// Git durumu değişince commit çubuğunu, +1 ve Kaydet düğmelerini günceller.
function syncCommitBar() {
  if (!S.cur) return;
  const repo = !!(S.git && S.git.isRepo);
  const bar = $('#commitBar'); if (bar) bar.hidden = !repo;
  const b = $('#btnBump'); if (b) b.disabled = !repo;
  updateDirty();
}
async function loadRecent() { try { S.recent = (await get('/api/search?q=')).results.slice(0, 8); } catch (e) { S.recent = []; } }

async function refreshAll() {
  if (!rootOk()) return;
  const gen = S.gen;
  await Promise.all([loadLibrary(), loadFacets(), loadGit(), loadRecent()]);
  if (gen !== S.gen) return;
  renderFilters(); renderList();
  if (isFiltering()) runSearch();
  if (!S.cur) renderMain();
}

/* -------------------------------------------------------------- sol kenar çubuğu */
function renderFilters() {
  const tags = S.facets.tags;
  const shown = S.tagsAll ? tags : tags.slice(0, 14);
  let h = shown.map((t) => `<button class="tagbtn ${S.f.tags.some((x) => fold(x) === fold(t.name)) ? 'on' : ''}" data-act="tag" data-tag="${esc(t.name)}" data-c="${hueOf(t.name)}">${esc(t.name)}<span class="n">${t.count}</span></button>`).join('');
  if (tags.length > 14) h += `<button class="tagbtn" data-act="tags-all">${esc(S.tagsAll ? tx('ui.filters.showLess') : tx('ui.filters.allTags', { count: tags.length }))}</button>`;
  $('#tagbar').innerHTML = h;
  const opt = (arr) => arr.map((x) => `<option value="${esc(x)}">`).join('');
  $('#dl-etiketler').innerHTML = opt(tags.map((t) => t.name));
  $('#dl-projeler').innerHTML = opt((S.facets.projeler || []).map((t) => t.name));
  const m = activeMp();
  $('#dl-paket').innerHTML = opt(pluginsOf(m).map((p) => p.slug).concat(m && m.defaultPlugin ? [m.defaultPlugin] : (S.info && S.info.config ? [S.info.config.marketplace.plugin] : [])));
}

const SVG = (inner, cls) => `<svg class="ic ${cls || ''}" viewBox="0 0 16 16" aria-hidden="true" focusable="false">${inner}</svg>`;
const ICON = {
  mp: SVG('<ellipse cx="8" cy="4" rx="5" ry="2"/><path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/>'),
  plugin: SVG('<path d="M2 5l6-3 6 3v6l-6 3-6-3zM2 5l6 3 6-3M8 8v6"/>'),
  dir: SVG('<path d="M2 4h4l1.5 1.5H14V12H2z"/>'),
  loose: SVG('<path class="dash" d="M2 5l6-3 6 3v6l-6 3-6-3zM2 5l6 3 6-3M8 8v6"/>'),
  inbox: SVG('<path d="M2 9l2-5h8l2 5v3H2zM2 9h4l1 2h2l1-2h4"/>'),
  tech: SVG('<circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/>'),
  warn: SVG('<path d="M8 2l6.5 11.5h-13zM8 6.5v3.2M8 11.4v.3"/>'),
  gitless: SVG('<ellipse cx="8" cy="4" rx="5" ry="2"/><path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4"/>')
};

// Ağacı düz bir görünür listeye çevirir (roving tabindex ve klavye gezintisi bunu kullanır).
function treeModel() {
  const out = [];
  const lib = S.lib; if (!lib) return out;
  const add = (it, parentKey, level, i, n) => { it.parentKey = parentKey; it.level = level; it.posinset = i + 1; it.setsize = n; out.push(it); return it; };
  const nodes = (list, mp, level, parentKey, tech) => {
    list.forEach((nd, i) => {
      if (nd.type === 'dir') {
        const open = expOf(mp).has(nd.path);
        const it = add({ kind: tech ? 'tdir' : 'dir', mp, path: nd.path, key: nodeKey(mp, nd.path), ek: nd.path, node: nd, expandable: nd.children.length > 0, expanded: open }, parentKey, level, i, list.length);
        if (open && nd.children.length) nodes(nd.children, mp, level + 1, it.key, tech);
      } else {
        add({ kind: tech ? 'tfile' : 'file', mp, path: nd.path, key: nodeKey(mp, nd.path), node: nd, expandable: false }, parentKey, level, i, list.length);
      }
    });
  };
  const mps = lib.marketplaces; const gl = lib.ignored || [];
  const top = mps.length + (gl.length ? 1 : 0);
  mps.forEach((m, mi) => {
    const mOpen = m.state === 'hazir' && S.mpOpen.has(m.name);
    const mit = add({ kind: 'mp', mp: m.name, path: '', key: nodeKey(m.name, ''), node: m, expandable: m.state === 'hazir', expanded: mOpen }, null, 1, mi, top);
    if (!mOpen) return;
    const ex = expOf(m.name);
    const kids = m.plugins.map((p) => ({ kind: 'plugin', node: p }));
    if (m.inbox) kids.push({ kind: 'inbox', node: m.inbox });
    if (m.loose.length) kids.push({ kind: 'loose', node: m.loose });
    if (m.teknik.length) kids.push({ kind: 'teknik', node: m.teknik });
    kids.forEach((k, ki) => {
      const nd = k.node;
      if (k.kind === 'plugin') {
        const open = ex.has(nd.path);
        const it = add({ kind: 'plugin', mp: m.name, path: nd.path, key: nodeKey(m.name, nd.path), ek: nd.path, node: nd, expandable: nd.children.length > 0, expanded: open }, mit.key, 2, ki, kids.length);
        if (open) nodes(nd.children, m.name, 3, it.key, false);
      } else {
        const ek = k.kind === 'inbox' ? '#gelen' : k.kind === 'loose' ? '#klasorsuz' : '#teknik';
        const kids2 = k.kind === 'inbox' ? nd.children : nd;
        const open = ex.has(ek);
        const it = add({ kind: k.kind, mp: m.name, path: k.kind === 'inbox' ? nd.path : '', key: nodeKey(m.name, ek), ek, node: nd, list: kids2, expandable: kids2.length > 0, expanded: open }, mit.key, 2, ki, kids.length);
        if (open) nodes(kids2, m.name, 3, it.key, k.kind === 'teknik');
      }
    });
    if (!m.libraryDirExists) out.push({ kind: 'note', key: nodeKey(m.name, '#not'), mp: m.name, level: 2, text: tx('ui.tree.noPromptDir', { dir: m.libraryDir }) });
    else if (!m.plugins.length) out.push({ kind: 'note', key: nodeKey(m.name, '#not'), mp: m.name, level: 2, text: tx('ui.tree.noPlugins'), action: 'new-plugin', actionLabel: tx('ui.tree.newPlugin') });
  });
  if (gl.length) {
    const open = S.gitlessOpen;
    const git = add({ kind: 'gitless', mp: '', path: '', key: 'gitsiz', node: gl, expandable: true, expanded: open }, null, 1, mps.length, top);
    if (open) gl.forEach((g, i) => add({ kind: 'gitlessItem', mp: '', path: g.name, key: 'gitsiz:' + g.name, node: g, expandable: false }, git.key, 2, i, gl.length));
  }
  return out;
}

const isFileKind = (k) => k === 'file' || k === 'tfile';

function rowHtml(it, focusKey) {
  const d = it.level - 1;
  if (it.kind === 'note') {
    return `<div class="empty note" style="--d:${d}" data-note>${esc(it.text)}${it.action ? ` <button class="btn sm" data-act="${it.action}" data-mp="${esc(it.mp)}">${esc(it.actionLabel)}</button>` : ''}</div>`;
  }
  const cur = S.cur && isFileKind(it.kind) && S.cur.mp === it.mp && S.cur.path === it.path;
  const selected = cur || (S.sel && S.sel.key === it.key);
  const isEtkin = it.kind === 'mp' && it.node.active;
  let icon = ICON[it.kind] || ''; let label = ''; let pills = ''; let sr = ''; let acts = ''; let cls = ''; let hue = null;
  const btn = (act, txt, aria) => `<button class="${act === 'plus' ? 'plus' : 'more'}" data-act="${act}" data-key="${esc(it.key)}" tabindex="-1" aria-label="${esc(aria)}">${txt}</button>`;
  const cnt = (n) => `<span class="cnt">${n}</span>`;
  switch (it.kind) {
    case 'mp': {
      const m = it.node; const bad = m.state !== 'hazir';
      label = esc(m.name); cls = ' mp' + (isEtkin ? ' etkin' : ''); hue = hueOf(m.name);
      icon = `<span class="av" aria-hidden="true">${esc((Array.from(m.name)[0] || '?').toUpperCase())}</span>`;
      pills = (isEtkin ? `<span class="pill ok">${esc(tx('ui.tree.pillActive'))}</span>` : '') + (bad ? `<span class="pill bad">${esc(tx('ui.tree.pillInvalid', { reason: m.reason || '' }))}</span>` : cnt(m.count))
        + (m.yayinUyari ? `<span class="pill warn" title="${esc(tx('ui.common.wontPublish', { count: Number(m.yayinUyari) }))}">${esc(tx('ui.tree.warningCount', { count: Number(m.yayinUyari) }))}</span>` : '');
      sr = isEtkin ? tx('ui.tree.srMarketplaceActive') : tx('ui.tree.srMarketplace');
      if (!bad) acts += btn('plus', '+', tx('ui.tree.newPluginFor', { name: m.name }));
      acts += btn('menu', '⋯', tx('ui.tree.actionsFor', { name: m.name }));
      break;
    }
    case 'plugin': {
      const p = it.node; label = esc(p.name); hue = hueOf(p.name);
      pills = cnt(p.count);
      if (p.nameIssue) pills += p.nameIssue.level === 'error' ? `<span class="pill bad" title="${esc(p.nameIssue.message)}">!</span>` : `<span class="pill" title="${esc(p.nameIssue.message)}">${esc(p.nameIssue.message.toLocaleLowerCase(I18n.locale()))}</span>`;
      sr = tx('ui.tree.srPlugin');
      acts += btn('plus', '+', tx('ui.tree.newPromptIn', { name: p.name })) + btn('menu', '⋯', tx('ui.tree.actionsFor', { name: p.name }));
      break;
    }
    case 'dir': label = esc(it.node.name); pills = cnt(it.node.count); acts = btn('menu', '⋯', tx('ui.tree.actionsFor', { name: it.node.name })); sr = tx('ui.tree.srFolder'); break;
    case 'tdir': label = esc(it.node.name); sr = tx('ui.tree.srFolder'); icon = ICON.dir; break;
    case 'inbox': label = esc(tx('ui.tree.inbox')); pills = cnt(it.node.count); acts = btn('menu', '⋯', tx('ui.tree.actionsFor', { name: tx('ui.tree.inbox') })); break;
    case 'loose': label = esc(tx('ui.tree.loose')); pills = cnt(it.node.length);
      break;
    case 'teknik': label = esc(tx('ui.tree.technical')); cls = ' soft'; break;
    case 'gitless': label = esc(tx('ui.tree.gitless', { count: it.node.length })); icon = ICON.warn; cls = ' soft'; break;
    case 'gitlessItem': label = esc(it.node.name); pills = `<span class="pill warn">${esc(tx('ui.tree.notGitRepo'))}</span>`; icon = ICON.gitless; cls = ' soft';
      acts = `<button class="btn sm" data-act="mk-git-init" data-confirm data-name="${esc(it.node.name)}" tabindex="-1">${th('ui.tree.initGit')}</button>`; break;
    case 'tfile': label = esc(it.node.name); icon = ''; cls = ' soft'; acts = menuItemsFor(it).length ? btn('menu', '⋯', tx('ui.tree.actionsFor', { name: it.node.name })) : ''; break;
    default: { // file
      const m = it.node.meta; const txt = m && m.baslik ? m.baslik : it.node.name;
      label = esc(txt);
      icon = `<span class="dot ${m ? durumClass(m.durum) : ''}"></span>`;
      pills = (m && m.tur ? `<span class="pill">${esc(turLabel(m.tur))}</span>` : '')
        + (m && m.uyari ? `<span class="pill warn" title="${esc(tx('ui.tree.warnPublishTitle'))}" aria-label="${esc(tx('ui.tree.warnPublishLabel'))}">!</span>` : '')
        + (m && m.surum ? `<span class="pill warn" title="${esc(tx('ui.tree.warnVersionTitle'))}" aria-label="${esc(tx('ui.tree.warnVersionLabel'))}">v</span>` : '')
        + (m && m.paketUyusmuyor ? `<span class="pill warn" title="${esc(tx('ui.tree.warnPackageTitle'))}" aria-label="${esc(tx('ui.tree.warnPackageLabel'))}">p</span>` : '');
      acts = btn('menu', '⋯', tx('ui.tree.actionsFor', { name: txt }));
    }
  }
  if (it.kind === 'loose') acts = '';
  const caret = it.expandable ? `<span class="caret ${it.expanded ? 'open' : ''}"></span>` : '<span class="caret" style="visibility:hidden"></span>';
  const title = it.kind === 'loose' ? tx('ui.tree.looseTitle', { plugin: (it.mpNode && it.mpNode.defaultPlugin) || (mpByName(it.mp) || {}).defaultPlugin || '' })
    : isFileKind(it.kind) ? it.path : it.kind === 'plugin' ? (it.node.description || it.node.name) : '';
  return `<div class="row ${it.kind}${cls}${cur ? ' active' : ''}" role="treeitem" data-key="${esc(it.key)}" data-act="node"${hue === null ? '' : ` data-c="${hue}"`} tabindex="${it.key === focusKey ? 0 : -1}"
    aria-level="${it.level}" aria-posinset="${it.posinset}" aria-setsize="${it.setsize}" ${it.expandable ? `aria-expanded="${it.expanded}"` : ''} ${selected ? 'aria-selected="true"' : ''}
    style="--d:${d}" ${title ? `title="${esc(title)}"` : ''}>${it.expandable || it.level > 1 ? caret : caret}${icon}<span class="name">${label}${sr ? `<span class="sr">${esc(sr)}</span>` : ''}</span>${pills}${acts ? `<span class="acts">${acts}</span>` : ''}</div>`;
}

function treeHtml() {
  S.model = treeModel();
  S.modelMap = new Map(S.model.filter((x) => x.kind !== 'note').map((x) => [x.key, x]));
  if (!S.lib) {
    // Kök sonradan kullanılamaz olduysa (örn. diskten silindi) S.lib boşalır; "Yükleniyor…" sonsuza dek kalmasın.
    if (S.info && S.info.setup && !S.info.setup.rootOk) return `<div class="empty">${esc(tx('ui.tree.rootUnavailable'))}</div>`;
    return `<div class="empty">${esc(tx('ui.common.loading'))}</div>`;
  }
  if (!S.lib.marketplaces.length && !(S.lib.ignored || []).length) {
    return `<div class="empty">${esc(tx('ui.tree.noMarketplace'))}<br><button class="btn sm primary" data-act="new-mp" style="margin-top:8px">${esc(tx('ui.tree.newMarketplace'))}</button></div>`;
  }
  let fk = S.focusKey;
  if (!fk || !S.modelMap.has(fk)) { const f = S.model.find((x) => x.kind !== 'note'); fk = f ? f.key : null; S.focusKey = fk; }
  return S.model.map((it) => rowHtml(it, fk)).join('');
}

const whereOf = (r) => (r.kind === 'paket' ? r.plugin : r.kind === 'klasorsuz' ? tx('ui.search.whereLoose') : r.kind === 'gelenKutusu' ? tx('ui.tree.inbox') : (r.path.split('/').slice(0, -1).join('/') || tx('ui.search.whereTechnical')));

function resultsHtml() {
  const tokens = fold(S.f.q).split(/\s+/).filter(Boolean);
  if (!S.results.length) return `<div class="empty">${esc(tx('ui.search.noMatch'))}</div>`;
  return S.results.map((r, i) => {
    const act = S.cur && S.cur.mp === r.mp && S.cur.path === r.path;
    return `<div class="res ${act ? 'active' : ''}" role="listitem" tabindex="0" data-act="open" data-mp="${esc(r.mp)}" data-path="${esc(r.path)}" data-ri="${i}" ${act ? 'aria-selected="true"' : ''}>
    <div class="rt"><span class="dot ${durumClass(r.durum)}"></span><span>${hl(r.baslik, tokens)}</span>${r.tur ? `<span class="pill">${esc(turLabel(r.tur))}</span>` : ''}</div>
    <div class="rp">${esc(r.mp)} › ${esc(whereOf(r))} › ${esc(base(r.path))}</div>
    ${r.snippet ? `<div class="rs">${hl(r.snippet, tokens)}</div>` : ''}
    ${r.etiketler.length ? `<div class="rtags">${r.etiketler.map((t) => `<span class="pill" data-c="${hueOf(t)}">${esc(t)}</span>`).join('')}</div>` : ''}</div>`;
  }).join('');
}

// Liste başlığı: sunucu 300'de kesmişse "Sonuçlar (300 / 3012)", değilse "Sonuçlar (N)". mpCount > 1 ise marketplace sayısı eklenir.
function resultsTitle(results, info, mpCount) {
  const n = results.length;
  const cnt = info && info.truncated && info.total > n ? n + ' / ' + info.total : String(n);
  return mpCount > 1 ? tx('ui.search.titleMulti', { total: cnt, count: mpCount }) : tx('ui.search.title', { total: cnt });
}

// Sonuçlar kesilmişse listenin altına daraltma ipucu (HTML); aksi halde boş. `.res` olmadığı için data-ri sırasını ve klavye gezintisini etkilemez.
function resultsNote(info) {
  if (!info || !info.truncated) return '';
  return `<div class="hint res-note" role="listitem">${esc(tx('ui.search.truncated', { limit: info.limit }))}</div>`;
}

// Araç çubuğu düğmelerinin açık/kapalı durumu ve nedeni.
function paintToolbar() {
  const rok = rootOk(); const m = activeMp(); const ok = setupOk();
  const set = (id, why, off) => {
    const b = $('#' + id); const w = $('#why-' + id.slice(2).toLowerCase());
    if (!b) return;
    b.disabled = off;
    if (w) w.textContent = off ? why : '';
    b.title = off ? why : (id === 'tbPlugin' ? tx('ui.toolbar.newPluginIn', { name: activeName() }) : id === 'tbPrompt' ? tx('ui.toolbar.newPromptIn', { name: activeName() }) : tx('ui.toolbar.newMarketplace'));
  };
  set('tbMp', tx('ui.toolbar.rootNotReadyPickRoot'), !rok);
  set('tbPlugin', !rok ? tx('ui.toolbar.rootNotReady') : tx('ui.toolbar.pickMarketplace'), !(ok && m));
  set('tbPrompt', !(ok && m) ? tx('ui.toolbar.pickMarketplace') : tx('ui.toolbar.createPluginFirst'), !(ok && m && m.plugins.length));
}

function renderList() {
  const list = $('#list');
  const hadFocus = list.contains(document.activeElement) && document.activeElement.closest('[data-key],[data-ri]');
  const fk = hadFocus ? (hadFocus.dataset.key || null) : null; const fri = hadFocus ? hadFocus.dataset.ri : null;
  if (S.results) {
    list.setAttribute('role', 'list'); list.setAttribute('aria-label', tx('ui.search.resultsLabel'));
    list.innerHTML = resultsHtml() + resultsNote(S.resultsInfo);
    $('#listTitle').textContent = resultsTitle(S.results, S.resultsInfo, new Set(S.results.map((r) => r.mp)).size);
    if (fri != null) { const el = list.querySelector('[data-ri="' + fri + '"]'); if (el) el.focus(); }
  } else {

// Modal içinde Tab döngüsü kararı: son öğede Tab ilkine, ilk öğede Shift+Tab sonuncusuna sarar; odak pencere dışındaysa içeri alınır.
// Dönen öğeye odak verilir; null = odak arada bir öğede, tarayıcı kendi sıralamasıyla ilerlesin.
function tabTarget(items, active, shift) {
  if (!items.length) return null;
  const i = items.indexOf(active);
  if (i < 0) return shift ? items[items.length - 1] : items[0];
  if (shift && i === 0) return items[items.length - 1];
  if (!shift && i === items.length - 1) return items[0];
  return null;
}

// Açık #overlay penceresinde Tab ile gezilebilen görünür öğeler (DOM sırasıyla). Aynı gruptaki radyolardan yalnızca tarayıcının durağı alınır.
function modalFocusables() {
  const all = $$('button, input, select, textarea, summary, [tabindex]', $('.modal')).filter((el) =>
    !el.disabled && !el.hidden && el.tabIndex >= 0 && el.type !== 'hidden' && el.getClientRects().length > 0);
  return all.filter((el) => {
    if (el.type !== 'radio' || !el.name) return true;
    const grp = all.filter((x) => x.type === 'radio' && x.name === el.name && x.form === el.form);
    const stop = grp.find((x) => x.checked) || grp[0];
    return el === stop;
  });
}

// Pencere (modal) açıkken Tab odağı pencerenin içinde tutar. İşlendiyse true.
function trapTab(ev) {
  if (ev.key !== 'Tab' || ev.ctrlKey || ev.altKey || ev.metaKey || $('#overlay').hidden) return false;
  if (ev.target && ev.target.closest && ev.target.closest('.menu')) return false;
  const next = tabTarget(modalFocusables(), document.activeElement, ev.shiftKey);
  if (next) { ev.preventDefault(); next.focus(); }
  return true;
}

function askText(o) {
  return new Promise((resolve) => {
    let done = false; const fin = (v) => { if (!done) { done = true; resolve(v); } };
    openModal({
      title: o.title,
      html: `<form class="stack" id="askForm"><label>${esc(o.label)}<input id="askIn" value="${esc(o.value || '')}" autocomplete="off"></label>
        ${o.hint ? `<p class="hint">${esc(o.hint)}</p>` : ''}
        <div class="foot"><button type="button" class="btn" data-act="close">${esc(tx('ui.common.cancel'))}</button><button class="btn primary">${esc(o.ok || tx('ui.common.ok'))}</button></div></form>`,
      onMount: (b) => {
        $('#askForm', b).addEventListener('submit', (e) => { e.preventDefault(); fin($('#askIn', b).value.trim() || null); closeModal(); });
        $('#askIn', b).select();
      },
      onClose: () => fin(null)
    });
  });
}

function askChoice(o) {
  return new Promise((resolve) => {
    let done = false; const fin = (v) => { if (!done) { done = true; resolve(v); } };
    openModal({
      title: o.title,
      html: `<p>${esc(o.text)}</p><div class="foot">${o.choices.map((c) => `<button class="btn ${c.kind || ''}" data-choice="${esc(c.id)}">${esc(c.label)}</button>`).join('')}</div>`,
      onMount: (b) => { $$('[data-choice]', b).forEach((x) => x.addEventListener('click', () => { fin(x.dataset.choice); closeModal(); })); },

    });
