}

/* açılır menü */
let menuOff = null; let menuReturn = null;
function closeMenu(refocus) {
  $$('.menu').forEach((m) => m.remove());
  if (menuOff) { document.removeEventListener('click', menuOff); menuOff = null; }
  const key = menuReturn; menuReturn = null;
  if (refocus && key) { const el = rowEl(key); if (el) el.focus(); }
}
function showMenu(x, y, items, returnKey) {
  closeMenu();
  menuReturn = returnKey || null;
  const m = document.createElement('div');
  m.className = 'menu'; m.setAttribute('role', 'menu');
  m.innerHTML = items.map((i) => `<button class="mi ${i.danger ? 'danger' : ''}" role="menuitem" tabindex="-1" data-act="${i.act}" data-mp="${esc(i.mp || '')}" data-path="${esc(i.path || '')}" data-kind="${esc(i.kind || '')}" data-name="${esc(i.name || '')}">${esc(i.label)}</button>`).join('');
  document.body.appendChild(m);
  const r = m.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + 'px';
  m.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + 'px';
  menuOff = () => closeMenu();
  setTimeout(() => { if (menuOff) document.addEventListener('click', menuOff); }, 0);
  const first = $('.mi', m); if (first) first.focus();
}

// Marketplace yapısının parçası olan yollar (plugins/, .claude-plugin/, prompts/ ...) silinemez ya da taşınamaz:
// sunucu 403 korunanYol döner, menüde de bu işlemler gösterilmez. Kural Rules.isProtectedPath'te (sunucuyla ortak).
const PROTECTED_ACTS = ['rename', 'delete', 'm-rename-file', 'm-move', 'm-rename-plugin', 'm-delete-plugin'];
const isProtectedItem = (it) => !!it.path && Rules.isProtectedPath(it.path, libDirOf(it.mp));

// Düğüm türüne göre bağlam menüsü öğeleri.
function menuItemsFor(it) {
  const mk = (label, act, extra) => ({ label, act, mp: it.mp, path: it.path, kind: it.kind, ...extra });
  const items = [];
  switch (it.kind) {
    case 'mp':
      if (!it.node.active) items.push(mk(tx('ui.menu.activate'), 'm-activate'));
      if (it.node.state === 'hazir') items.push(mk(tx('ui.menu.newPlugin'), 'new-plugin'), mk(tx('ui.menu.gitPanel'), 'git'), mk(tx('ui.menu.marketplacePublish'), 'market'));
      items.push(mk(tx('ui.menu.copyPath'), 'm-copy-path'));
      break;
    case 'plugin':
      items.push(mk(tx('ui.menu.newPrompt'), 'm-new-prompt', { name: it.node.name }), mk(tx('ui.menu.openPackage'), 'open-package', { name: it.node.name }), mk(tx('ui.menu.editDescription'), 'm-desc', { name: it.node.name }),
        mk(tx('ui.menu.rename'), 'm-rename-plugin', { name: it.node.name }), mk(tx('ui.menu.deleteToTrash'), 'm-delete-plugin', { name: it.node.name, danger: true }));
      break;
    case 'dir':
      items.push(mk(tx('ui.menu.renameOrMove'), 'rename'), mk(tx('ui.menu.deleteToTrash'), 'delete', { danger: true }));
      break;
    case 'file': {
      if (/\.(md|markdown)$/i.test(it.path)) {
        const loose = Rules.classifyPromptPath(it.path, libDirOf(it.mp)).kind === 'klasorsuz';
        items.push(mk(loose ? tx('ui.menu.moveToPlugin') : tx('ui.menu.move'), 'm-move'), mk(tx('ui.menu.rename'), 'm-rename-file'));
      } else items.push(mk(tx('ui.menu.renameOrMove'), 'rename'));
      items.push(mk(tx('ui.menu.deleteToTrash'), 'delete', { danger: true }));
      break;
    }
    case 'tfile':
      items.push(mk(tx('ui.menu.renameOrMove'), 'rename'), mk(tx('ui.menu.deleteToTrash'), 'delete', { danger: true }));
      break;
    case 'inbox': items.push(mk(tx('ui.menu.import'), 'import')); break;
    default: break;
  }
  return isProtectedItem(it) ? items.filter((x) => !PROTECTED_ACTS.includes(x.act)) : items;
}
function openMenuFor(it, x, y) {
  const items = menuItemsFor(it);
  if (items.length) showMenu(x, y, items, it.key);
}

/* ------------------------------------------------------------------ dosya açma */
const leadOf = (p) => (p.hasFm && /^\n/.test(p.body) ? '\n' : '');
const isDirty = () => !!(S.cur && S.cur.dirty);

function computeRaw() {
  const c = S.cur;
  if (c.tab === 'raw') {
    const t = $('#fRaw');
    if (t) { const p = FM.parse(t.value); p.eol = c.eol; p.bom = c.bom; return FM.stringify(p); }
  }
  return FM.stringify(c.parsed);
}
function syncFromDom() {
  const c = S.cur; if (!c) return;
  if (c.tab === 'raw') {
    const t = $('#fRaw');
    if (t) { const p = FM.parse(t.value); p.eol = c.eol; p.bom = c.bom; c.parsed = p; c.lead = leadOf(p); }
  }
}
const uncommitted = (p) => !!(S.git && S.git.isRepo && S.git.files.some((f) => f.path === p));
function saveLabel() {
  const c = S.cur; const msg = c.commitMsg.trim();
  if (c.dirty) return msg ? tx('ui.file.saveAndCommit') : tx('ui.file.save');
  if (msg && uncommitted(c.path)) return tx('ui.file.commit');
  return tx('ui.file.save');
}
function updateDirty() {
  const c = S.cur; if (!c) return;
  c.dirty = computeRaw() !== c.savedRaw;
  const b = $('#btnSave');
  if (b) { b.disabled = !(c.dirty || (uncommitted(c.path) && c.commitMsg.trim())); b.textContent = saveLabel(); }
  const cp = $('#commitPill'); if (cp) cp.hidden = !(uncommitted(c.path) && !c.dirty);
  document.title = (c.dirty ? '• ' : '') + tx('ui.static.title');
  const n = $('#dirtyNote'); if (n) n.hidden = !c.dirty;
}

// Açık dosya kapanırken (silme, başka marketplace'e taşıma): son açılan kaydı ve sekme başlığını sıfırlar, kaydedilmemiş dosyanın "•" işareti kalmaz.
function clearCur() {
  S.cur = null; ls.set(lsKey('last'), null);
  document.title = tx('ui.static.title');
}

async function confirmDiscard() {
  if (!isDirty()) return true;
  const a = await askChoice({
    title: tx('ui.discard.title'), text: tx('ui.discard.text', { name: base(S.cur.path) }),
    choices: [{ id: 'cancel', label: tx('ui.common.cancel') }, { id: 'discard', label: tx('ui.discard.discard'), kind: 'danger' }, { id: 'save', label: tx('ui.discard.save'), kind: 'primary' }]
  });
  if (a === 'save') return save();
  if (a === 'discard') { S.cur.dirty = false; return true; }
  return false;
}

async function openFile(p, o) {
  o = o || {};
  if (S.cur && S.cur.path === p && !o.reload) { S.openSeq++; closeSide(); return; } // açık dosyaya tıklamak, yoldaki başka açılışı da geçersiz kılar
  if (!(await confirmDiscard())) return;
  const gen = S.gen;
  const seq = ++S.openSeq;
  const stale = () => gen !== S.gen || seq !== S.openSeq; // marketplace değişti ya da daha yeni bir açılış başladı
  let r;
  try { r = await get('/api/file?' + qs({ path: p })); } catch (e) {
    if (stale()) return; // bayat hata toast ya da yeniden çizim üretmez
    if (!o.quiet) fail(e); if (e.status === 404) ls.set(lsKey('last'), null); renderMain(); return;
  }
  if (stale()) return;
  const parsed = FM.parse(r.raw);
  const mp = activeName();
  S.cur = {
    mp, path: r.path, parsed, savedRaw: r.raw, mtime: r.mtime, isPrompt: r.isPrompt, isMd: r.isMd,
    generatedFrom: r.generatedFrom, publish: r.publish, eol: parsed.eol, bom: parsed.bom, lead: leadOf(parsed),
    tab: o.tab || (r.isPrompt ? 'edit' : 'raw'), hist: null, dirty: false, external: false, commitMsg: (o.reload && S.cur && S.cur.path === p) ? S.cur.commitMsg : '', ver: null
  };
  ls.set(lsKey('last'), r.path);
  expandParents(r.path, mp);
  S.sel = { mp, key: nodeKey(mp, r.path) }; S.focusKey = S.sel.key;
  closeSide(); renderList(); renderMain();
  loadVersion();
  if (S.cur.tab === 'hist') loadHistory();
  document.title = tx('ui.static.title');
  await offerLostEdit();
}

// Kurulum bozulunca kurtarılan kaydedilmemiş metin (S.lostEdit), aynı marketplace ve yol yeniden açılınca geri yüklenmek üzere önerilir.
// Pencere kapatılırsa ("Daha sonra") metin bellekte kalır; yalnızca "At" ya da geri yükleme siler.
async function offerLostEdit() {
  const l = S.lostEdit; const c = S.cur;
  if (!l || !c || l.mp !== c.mp || l.path !== c.path) return;
  const a = await askChoice({
    title: tx('ui.lostEdit.title'),
    text: l.commitMsg ? tx('ui.lostEdit.textWithMessage', { name: base(c.path) }) : tx('ui.lostEdit.text', { name: base(c.path) }),
    choices: [{ id: 'later', label: tx('ui.lostEdit.later') }, { id: 'drop', label: tx('ui.lostEdit.drop'), kind: 'danger' }, { id: 'restore', label: tx('ui.lostEdit.restore'), kind: 'primary' }]
  });
  if (S.cur !== c) return; // pencere açıkken başka dosya açıldı
  if (a === 'drop') { S.lostEdit = null; return; }
  if (a !== 'restore') return;
  const p = FM.parse(l.raw);
  c.parsed = p; c.eol = p.eol; c.bom = p.bom; c.lead = leadOf(p); c.commitMsg = l.commitMsg || '';
  S.lostEdit = null;
  renderMain(); updateDirty(); // dirty, diskteki sürümle karşılaştırılarak yeniden hesaplanır
  toast(tx('ui.lostEdit.restored'));
}

      <label for="pAd">${esc(tx('ui.fields.name'))}</label><input id="pAd" data-f="komut_adi" value="${esc(str(m.komut_adi))}" placeholder="${esc(FM.slug(stem(c.path)))}">
      <label for="pAcik">${esc(tx('ui.fields.description'))}</label><input id="pAcik" data-f="aciklama" value="${esc(str(m.aciklama))}" placeholder="${esc(tx('ui.edit.descriptionPlaceholder'))}">
      <label for="pArg">${esc(tx('ui.fields.argumentHint'))}</label><input id="pArg" data-f="arguman_ipucu" value="${esc(str(m.arguman_ipucu))}" placeholder="${esc(tx('ui.edit.argumentHintPlaceholder'))}">
      <label for="pArac">${esc(tx('ui.fields.allowedTools'))}</label><input id="pArac" data-f="izinli_araclar" value="${esc(str(m.izinli_araclar))}" placeholder="Bash(git diff:*), Read">
      <label for="pModel">${esc(tx('ui.fields.model'))}</label><input id="pModel" data-f="model" value="${esc(str(m.model))}" placeholder="sonnet">

function bodyInfoText() {
  const c = S.cur; const b = c.parsed.body.slice(c.lead.length);
  const words = (b.trim().match(/\S+/g) || []).length;
  const vars = FM.placeholders(b);
  return `<span>${esc(tx('ui.edit.bodyInfo', { count: words, chars: tx('ui.edit.charCount', { count: b.length }) }))}</span>${vars.length ? `<span>${th('ui.edit.variables', { list: I18n.raw(vars.map((v) => '<code>' + esc(v) + '</code>').join(' ')) })}</span>` : ''}<span id="dirtyNote" ${c.dirty ? '' : 'hidden'}>${esc(tx('ui.edit.dirtyNote'))}</span>`;
}

function rawPaneHtml() {
  const c = S.cur;
  return `<textarea id="fRaw" spellcheck="false" aria-label="${esc(tx('ui.edit.rawLabel'))}">${esc(FM.stringify(c.parsed).replace(/\r\n/g, '\n'))}</textarea>
  <div class="bodyinfo"><span>${esc(tx('ui.edit.rawHint'))}</span><span id="dirtyNote" ${c.dirty ? '' : 'hidden'}>${esc(tx('ui.edit.dirtyNote'))}</span></div>`;
}

const HIST_STALE = () => { const c = S.cur; return `<p class="issue warn">${th('ui.hist.stale', { mp: c.mp, active: activeName() || tx('ui.common.none') })}</p>`; };

function histModeBar(h) {
  if (!h.ver) return '';
  const b = (m, t) => `<button type="button" data-act="hist-mode" data-mode="${m}" aria-pressed="${h.mode === m}">${t}</button>`;
  return `<div class="seg" role="group" aria-label="${esc(tx('ui.hist.viewLabel'))}">${b('ver', th('ui.hist.modeVersions'))}${b('commit', th('ui.hist.modeCommits'))}</div>`;
}

function histCommitHtml(h) {
  const cm = h.commit;
  if (!cm) return `<p class="hint">${esc(tx('ui.hist.loading'))}</p>`;
  const items = [];
  const li = (hash, cls, inner) => `<li role="button" tabindex="0" data-act="hist-select" data-hash="${hash}" class="${cls}">${inner}</li>`;
  if (cm.working && (cm.working.diff || cm.working.untracked)) items.push(li('working', cm.sel === 'working' ? 'on' : '', `<div class="s">${esc(tx('ui.hist.uncommittedChanges'))}</div><div class="hint">${cm.working.untracked ? th('ui.hist.untrackedHint') : esc(tx('ui.hist.diffFromLast'))}</div>`));
  for (const k of cm.commits) items.push(li(k.hash, cm.sel === k.hash ? 'on' : '', `<div class="s">${esc(k.subject)}</div><div class="hint">${esc(fmtDate(k.date))}, ${esc(k.short)}</div>`));
  if (!items.length) return `<p class="hint">${esc(tx('ui.hist.noCommits'))}</p>`;
  return `<div class="hist"><ul class="commits">${items.join('')}</ul><div><div class="diffhead" id="diffHead"></div><pre class="diff" id="diffBox">${esc(tx('ui.hist.pickEntry'))}</pre></div></div>`;
}

const verLabel = (ref, version) => (ref === 'HEAD' ? tx('ui.hist.lastCommit') : 'v' + version);
const verByTag = (v, tag) => v.data.versions.find((x) => x.tag === tag);

function histVerHtml(h) {
  const v = h.ver; const d = v.data;
  if (!d.tracked) return `<p class="hint">${th('ui.hist.notCommitted')}</p><p class="hint">${esc(tx('ui.hist.movedHint'))}</p>`;
  if (!d.versions.length) return `<p class="hint">${esc(tx('ui.hist.noVersions'))}</p><p><button class="btn" data-act="hist-mode" data-mode="commit">${th('ui.hist.showCommits')}</button></p>${d.ignoredTags ? `<p class="issue info">${esc(tx('ui.hist.ignoredTags', { count: d.ignoredTags }))}</p>` : ''}`;
  const opts = [`<option value="HEAD">${esc(tx('ui.hist.lastCommit'))}</option>`].concat(d.versions.map((x) => `<option value="${esc(x.tag)}">${esc(x.renamed ? tx('ui.hist.versionRenamedOption', { version: x.version }) : 'v' + x.version)}</option>`)).join('');
  const tl = `<ol class="commits timeline" id="verTL" aria-label="${esc(tx('ui.hist.timelineLabel'))}"></ol>`;
  return `<div class="hist">${tl}<div>
    <div class="vbar"><label>${esc(tx('ui.hist.older'))} <select id="verA">${opts}</select></label> <span aria-hidden="true">→</span> <label>${esc(tx('ui.hist.newer'))} <select id="verB">${opts}</select></label></div>
    <div id="verMain" aria-live="polite"></div></div></div>`;
}

function histPaneHtml() {
  const h = S.cur.hist;
  if (!h || h.loading) return `<p class="hint">${esc(tx('ui.hist.loading'))}</p>`;
  if (h.stale) return HIST_STALE();
  if (h.noRepo) return `<p>${esc(tx('ui.hist.noRepo'))}</p><p><button class="btn primary" data-act="git">${esc(tx('ui.common.openGitPanel'))}</button></p>`;
  if (h.error) return `<p class="issue error">${esc(h.error)}</p>`;
  return histModeBar(h) + (h.mode === 'ver' ? histVerHtml(h) : histCommitHtml(h));
}

function renderMain() {
  if (!rootOk()) { renderSetup(); return; }
  if (!setupOk()) { renderPick(); return; }
  renderMainInner();
  paintWarnBand();
  paintRemoteBand();
}

// mp › plugin › dosya (marketplace adı ağaçta o düğüme götürür).
function crumbsHtml(c) {
  const cl = Rules.classifyPromptPath(c.path, libDirOf(c.mp));
  const parts = c.path.split('/');
  const sep = '<span class="sep">›</span>';
  let rest;
  if (cl.kind === 'paket') rest = [esc(cl.klasor)].concat(parts.slice(libDirOf(c.mp).split('/').length + 1).map(esc));
  else if (cl.kind === 'gelenKutusu') rest = [esc(tx('ui.tree.inbox'))].concat(parts.slice(libDirOf(c.mp).split('/').length + 1).map(esc));
  else if (cl.kind === 'klasorsuz') rest = [esc(tx('ui.search.whereLoose')), esc(parts[parts.length - 1])];
  else rest = parts.map(esc);
  if (cl.kind === 'paket' || cl.kind === 'gelenKutusu') { /* klasör adından sonraki parçalar zaten eklendi */ }
  return `<button type="button" class="link" data-act="reveal" title="${esc(tx('ui.main.revealInTree'))}">${esc(c.mp)}</button>` + sep + rest.join(sep);
}

function renderMainInner() {
  const main = $('#main');
  const c = S.cur;
  if (!c) { main.innerHTML = startHtml(); return; }
  const tabs = c.isPrompt ? [['edit', tx('ui.main.tabEdit')], ['raw', tx('ui.main.tabRaw')], ['hist', tx('ui.main.tabHistory')]] : [['raw', tx('ui.main.tabEdit')], ['hist', tx('ui.main.tabHistory')]];
  const crumbs = crumbsHtml(c);
  const m = FM.meta(c.parsed);
  const title = c.isPrompt
    ? `<input class="title" data-f="baslik" value="${esc(str(m.baslik))}" placeholder="${esc(stem(c.path))}" aria-label="${esc(tx('ui.fields.title'))}">`
    : `<h1 class="title static">${esc(base(c.path))}</h1>`;
  const stale = c.mp !== activeName();
  const staleBanner = stale ? `<div class="banner" role="alert">${th('ui.main.staleBanner', { mp: c.mp, active: activeName() || tx('ui.common.none') })}</div>` : '';
  const banner = c.generatedFrom
    ? `<div class="banner">${th('ui.main.generatedBanner', { source: c.generatedFrom })}<button class="btn sm" data-act="open" data-path="${esc(c.generatedFrom)}">${esc(tx('ui.main.goToSource'))}</button></div>` : '';
  const ext = c.external ? `<div class="banner">${esc(tx('ui.main.externalChanged'))}</div>` : '';
  const restore = c.restoredFrom ? `<div class="banner"><span class="restorebar">${c.restoredFrom.source === 'version' ? th('ui.main.restoredVersion', { version: c.restoredFrom.version }) : th('ui.main.restoredCommit', { short: c.restoredFrom.short })}<button class="btn sm" data-act="ver-restore-cancel">${esc(tx('ui.main.undoRestore'))}</button></span></div>` : '';
  let pane = '';
  if (c.tab === 'edit' && c.isPrompt) pane = editPaneHtml();
  else if (c.tab === 'hist') pane = histPaneHtml();
  else pane = rawPaneHtml();
  const cl = Rules.classifyPromptPath(c.path, libDirOf(c.mp));
  main.innerHTML = `<section class="card" data-c="${hueOf(cl.kind === 'paket' ? cl.klasor : c.mp)}">
    <div class="crumbs">${crumbs}</div>
    <div class="titlebar">${title}
      <div class="tbtns">${c.isMd ? `<button class="btn" data-act="copy" title="${esc(tx('ui.main.copyTitle'))}">${esc(tx('ui.main.copy'))}</button>` : ''}<button class="btn primary" id="btnSave" data-act="save" ${c.dirty || (uncommitted(c.path) && c.commitMsg.trim()) ? '' : 'disabled'} title="Ctrl+S">${esc(saveLabel())}</button></div>
    </div>
    <div class="commitbar" id="commitBar" ${S.git && S.git.isRepo ? '' : 'hidden'}>
      <label for="commitMsg" class="hint">${esc(tx('ui.main.commitMessageLabel', { mp: c.mp }))}</label>
      <input id="commitMsg" value="${esc(c.commitMsg)}" placeholder="${esc(tx('ui.main.commitPlaceholder'))}" autocomplete="off">
      <span id="commitPill" class="pill warn" ${uncommitted(c.path) && !c.dirty ? '' : 'hidden'}>${esc(tx('ui.main.commitPending'))}</span>
    </div>
    ${staleBanner}${banner}${ext}${restore}
    <div class="tabs" role="tablist">${tabs.map((t) => `<button class="tab ${c.tab === t[0] ? 'on' : ''}" role="tab" aria-selected="${c.tab === t[0]}" data-act="tab" data-tab="${t[0]}">${esc(t[1])}</button>`).join('')}</div>
    <div class="pane" id="pane">${pane}</div></section>`;
  if (c.tab === 'edit') { autosize($('#fBody')); $('#bodyInfo').innerHTML = bodyInfoText(); paintPaketHint(); }
  if (c.tab === 'raw') autosize($('#fRaw'));
  if (c.tab === 'hist') paintHist();
  paintVerHint(); paintVerWarn();
}

// Ön sayfa (bento): başlık karosu (süs şekilleri aria-hidden), durum ve tür sayımları, tıklanabilir etiketler, son değişenler.
// Sayım etiketleri mevcut sözlük anahtarlarıdır; renkler plugin/etiket adından (hueOf) gelir.
function startHtml() {
  const n = Number(S.facets.total) || 0;
  const F = S.facets || {};
  const sum = (list, pick) => (list || []).filter(pick).reduce((a, x) => a + x.count, 0);
  const recent = S.recent.length
    ? `<section class="tile front"><h2>${esc(tx('ui.main.recent'))}</h2><div class="recent">${S.recent.map((r) => `<div class="res" role="button" tabindex="0" data-act="open" data-mp="${esc(r.mp)}" data-path="${esc(r.path)}" data-c="${hueOf(r.plugin || r.mp)}"><div class="rt"><span class="dot ${durumClass(r.durum)}"></span><span>${esc(r.baslik)}</span></div><div class="rp">${esc(r.mp)} › ${esc(whereOf(r))} › ${esc(base(r.path))}</div></div>`).join('')}</div></section>` : '';
  const shapes = '<div class="shapes" aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i><i class="s6"></i><svg class="s5" viewBox="0 0 130 26"><polyline points="3,20 19,6 35,20 51,6 67,20 83,6 99,20 115,6 127,16"/></svg></div>';
  const hero = `<section class="tile hero">${shapes}<div class="hero-txt"><h1>${esc(n ? tx('ui.main.startPick') : tx('ui.main.startEmpty'))}</h1>
    <p>${esc(n ? tx('ui.main.startIntro', { count: n }) : tx('ui.main.startEmptyHint'))}</p>
    <div class="btns"><button class="btn primary" data-act="new-prompt">${esc(tx('ui.static.newPrompt'))}</button><button class="btn" data-act="import">${esc(tx('ui.main.importTxt'))}</button></div></div></section>`;
  let stats = '';
  if (n) {
    const st = [['kararli', tx('ui.static.statusStable')], ['taslak', tx('ui.static.statusDraft')], ['arsiv', tx('ui.static.statusArchived')]]
      .map(([k, label]) => [k, label, sum(F.durum, (x) => durumClass(x.name) === k)]);
    st.push(['bos', tx('ui.mp.statusEmpty'), Math.max(0, n - st.reduce((a, x) => a + x[2], 0))]);
    const shown = st.filter((x) => x[2] > 0);
    const types = [['komut', tx('ui.static.typeCommand')], ['ajan', tx('ui.static.typeAgent')], ['skill', tx('ui.static.typeSkill')]]
      .map(([k, label]) => [label, sum(F.tur, (x) => x.name === k)]);
    types.push([tx('ui.static.notPublished'), Math.max(0, n - types.reduce((a, x) => a + x[1], 0))]);
    stats = `<div class="tile stat"><div class="big">${n}</div><div class="bar" aria-hidden="true">${shown.map((x) => `<span class="b-${x[0]}" style="flex:${x[2]}"></span>`).join('')}</div>
      <ul class="legend">${shown.map((x) => `<li><span class="dot ${x[0] === 'bos' ? '' : x[0]}"></span>${esc(x[1])}<b>${x[2]}</b></li>`).join('')}</ul></div>
      <div class="tile types"><ul>${types.map((x) => `<li><b>${x[1]}</b><span>${esc(x[0])}</span></li>`).join('')}</ul></div>`;
  }
  const tags = (F.tags || []).slice(0, 18);
  const tagTile = tags.length ? `<div class="tile tags"><h2>${esc(tx('ui.filters.allTags', { count: (F.tags || []).length }))}</h2><div class="tagcloud">${tags.map((t) => `<button type="button" class="tagbtn" data-act="tag" data-tag="${esc(t.name)}" data-c="${hueOf(t.name)}">${esc(t.name)}<span class="n">${t.count}</span></button>`).join('')}</div></div>` : '';
  return `<div class="start home"><div class="bento">${hero}${stats}${tagTile}${recent}</div></div>`;
}

/* ---------------------------------------------------------------- düzenleme */
function setField(key, value) {
  const c = S.cur;
  FM.set(c.parsed, key, typeof value === 'string' ? value.trim() : value);
  c.lead = c.lead || leadOf(c.parsed);
  updateDirty();
  if (key === 'tur') {
    c.turClearedExplicitly = !str(value).trim();
  }
  if (c.isPrompt && (key === 'tur' || Rules.PUBLISH_FIELDS.includes(key))) refreshPubWarn();
  if (key === 'paket') paintPaketHint();
  if (key === 'versiyon') paintVerHint();
}

// Sürüm alanı yorumlanamıyorsa ya da eski biçimdeyse ipucu gösterir.
function paintVerHint() {
  const c = S.cur; const h = $('#verHint'); if (!c || !h) return;
  const raw = str(FM.meta(c.parsed).versiyon).trim();
  const v = Rules.coerceVersion(raw);
  let t = '';
  if (v === null) t = tx('ui.edit.versionUnreadable');
  else if (v.legacy) t = tx('ui.edit.versionLegacy', { raw, version: v.version });
  h.hidden = !t; h.textContent = t;
}

async function loadVersion() {
  const c = S.cur; if (!c || !c.isPrompt) return;
  const gen = S.gen;
  try {
    const v = await get('/api/version?' + qs({ path: c.path }));
    if (S.cur === c && gen === S.gen) { c.ver = v; paintVerWarn(); }
  } catch (e) { /* sessiz */ }
}

function paintVerWarn() {
  const c = S.cur; const w = $('#verWarn'); if (!c || !w) return;
  const u = c.ver && c.ver.uyari;
  w.hidden = !u;
  if (u) {
    w.textContent = tx('ui.edit.changedSince', { version: c.ver.sonSurum.version });
    w.title = u.message; w.setAttribute('aria-label', u.message);
  }
}

// Klasörle uyuşmayan "paket" alanı için uyarı ve "Alanı klasöre eşitle" düğmesi.
function paintPaketHint() {
  const c = S.cur; const h = $('#paketHint'); if (!c || !h) return;
  const cl = Rules.classifyPromptPath(c.path, libDirOf(c.mp));
  const alan = str(FM.meta(c.parsed).paket).trim();
  const bad = cl.kind === 'paket' && !!alan && FM.slug(alan) !== cl.paket;
  h.hidden = !bad;
  h.innerHTML = bad ? esc(Rules.MSG.paketUyusmuyor(cl.klasor, alan)) + ' <button type="button" class="btn sm" data-act="paket-esitle">' + esc(tx('ui.edit.syncFieldToFolder')) + '</button> <button type="button" class="btn sm" data-act="m-move" data-path="' + esc(c.path) + '">' + esc(tx('ui.edit.moveFile')) + '</button>' : '';
}

function refreshPubWarn() {
  const chk = curCheck();
  const pp = $('#pubPill'); if (pp) pp.innerHTML = pubPill();
  const w = $('#pubWarn');
  if (w) {
    const nt = curNotice();
    w.hidden = !nt; w.textContent = nt ? nt.reason : ''; w.className = 'issue ' + (nt && nt.level === 'warn' ? 'warn' : 'info');
  }
}

function refreshChips(key) {
  const c = S.cur; const el = $('[data-chips="' + key + '"]'); if (!el) return;
  const ph = key === 'etiketler' ? tx('ui.edit.tagsPlaceholder') : tx('ui.edit.projectsPlaceholder');
  const wrap = document.createElement('div');
  wrap.innerHTML = chipsHtml(key, toList(FM.meta(c.parsed)[key]), ph);
  // Odaktaki eski giriş kaldırılırken tarayıcı senkron focusout tetikler; giriş hâlâ doluysa işleyici addChips'i
  // iç içe çağırıp aynı kabı ikinci kez değiştirir ve dıştaki replaceWith NotFoundError ile patlar. Önce boşalt.
  const old = el.querySelector('.chip-in'); if (old) old.value = '';
  if (!el.parentNode) return;
  el.replaceWith(wrap.firstElementChild);
}
function addChips(key, raw, keepFocus) {
  const c = S.cur; const list = toList(FM.meta(c.parsed)[key]);
  for (const v of toList(raw)) if (!list.some((x) => fold(x) === fold(v))) list.push(v);
  setField(key, list); refreshChips(key);
  if (keepFocus) { const i = $('[data-chip-in="' + key + '"]'); if (i) i.focus(); }
}
function removeChip(key, val) {
  const c = S.cur;
  setField(key, toList(FM.meta(c.parsed)[key]).filter((x) => x !== val));
  refreshChips(key);
}

function setTab(tab) {
  const c = S.cur; if (!c || c.tab === tab) return;
  syncFromDom();
  c.tab = tab;
  renderMain();
  if (tab === 'hist') loadHistory();
}

// "tur" kaldırılıyorsa onay ister. false dönerse işlem iptal edilmiştir.
async function confirmTurRemoval(c, force) {
  const before = c.isPrompt ? Rules.normTur(FM.meta(FM.parse(c.savedRaw)).tur) : '';
  if (c.isPrompt && before && !Rules.normTur(FM.meta(c.parsed).tur) && !c.turClearedExplicitly && !force) {
    const a = await askChoice({
      title: tx('ui.edit.unpublishTitle'),
      text: c.publish ? tx('ui.edit.unpublishTextPublished', { value: before, target: c.publish.target }) : tx('ui.edit.unpublishText', { value: before }),
      choices: [{ id: 'cancel', label: tx('ui.common.cancel') }, { id: 'restore', label: tx('ui.edit.restoreTurAndSave', { value: before }) }, { id: 'go', label: tx('ui.edit.saveAnyway'), kind: 'danger' }]
    });
    if (a === 'cancel' || !a) return false;
    if (a === 'restore') {
      FM.set(c.parsed, 'tur', before);
      renderMain();
    }
  }
  return true;
}

// Git kimliği penceresi. Kimlik kaydedilirse true döner.
function askIdentity() {
  return new Promise((resolve) => {
    let done = false; const fin = (v) => { if (!done) { done = true; resolve(v); } };
    const idn = (S.git && S.git.identity) || {};
    const opener = document.activeElement;
    openModal({
      title: tx('ui.identity.title'),
      html: `<form class="stack" id="idForm"><p>${esc(tx('ui.identity.text'))}</p>
        <label>${esc(tx('ui.identity.name'))}<input id="idName" value="${esc(idn.name || '')}" autocomplete="name"></label>
        <label>${esc(tx('ui.identity.email'))}<input id="idMail" type="email" value="${esc(idn.email || '')}" autocomplete="email"></label>
        <div id="idErr" class="issue error" role="alert" hidden></div>
        <div class="foot"><button type="button" class="btn" data-act="close">${esc(tx('ui.common.cancel'))}</button><button class="btn primary">${esc(tx('ui.file.save'))}</button></div></form>`,
      onMount: (b) => {
        $('#idForm', b).addEventListener('submit', async (e) => {
          e.preventDefault();
          try {
            await api('POST', '/api/git/identity', { name: $('#idName', b).value, email: $('#idMail', b).value });
            await loadGit();
            fin(true); closeModal();
          } catch (err) { const er = $('#idErr', b); er.textContent = err.message; er.hidden = false; }
        });
      },
      onClose: () => { fin(false); if (opener && opener.isConnected && opener.focus) opener.focus(); else { const sb = $('#btnSave'); if (sb) sb.focus(); } }
    });
  });
}

// Yalnızca commit: dosya zaten kaydedilmiş, mesaj dolu.
async function commitOnly() {
  const c = S.cur; if (!c) return false;
  if (staleGuard()) return false;
  const message = c.commitMsg.trim();
  if (!message) return false;
  try {
    const r = await api('POST', '/api/git/commit', { message, paths: [c.path] });
    c.commitMsg = ''; const i = $('#commitMsg'); if (i) i.value = '';
    toast(tx('ui.save.committed', { hash: r.commit }));
    updateDirty();
    afterWrite();
    return true;
  } catch (e) {
    if (e.data && e.data.needIdentity) {
      if (await askIdentity()) return commitOnly();
      return false;
    }
    fail(e); return false;
  }
}

// +1: sürüm penceresi. Sunucu dosyayı yazar, commit eder ve tag atar; hata olursa her şeyi geri alır.
async function openBump() {

  if (staleGuard()) return;
  syncFromDom();

  try { v = await get('/api/version?' + qs({ path: c.path })); } catch (e) { fail(e); return; }

  const opener = document.activeElement;
  const m = FM.meta(c.parsed);

  const last = v.sonSurum;
  const base = cv ? (cv.version || (last ? last.version : '')) : null;
  const first = !!cv && !base;
  const sug = cv ? { buyuk: Rules.bumpVersion(base, 'buyuk'), kucuk: Rules.bumpVersion(base, 'kucuk'), yama: Rules.bumpVersion(base, 'yama') } : null;
  const note0 = [c.commitMsg.trim(), v.notOnerisi].filter(Boolean).join('\n\n');

  const levels = first

  const hintTxt = cv === null ? `<p class="issue error">${esc(tx('ui.edit.versionUnreadable'))}</p>` : '';
  const current = curRaw || tx('ui.common.none');
  const html = `<form class="stack" id="bumpForm">

    ${levels}${hintTxt}
    <label>${esc(tx('ui.bump.note'))}<textarea id="bumpNote" rows="5" required ${first ? 'autofocus' : ''}>${esc(note0)}</textarea></label>
    <p class="hint">${esc(tx('ui.bump.tagLabel'))} <code id="bumpTag"></code></p>
    ${c.dirty ? `<p class="issue warn">${esc(tx('ui.bump.unsavedIncluded'))}</p>` : ''}
    ${v.degisti === false ? `<p class="hint">${esc(tx('ui.bump.unchanged'))}</p>` : ''}
    <div id="bumpErr" class="issue error" role="alert" hidden></div>
    <div class="foot"><button type="button" class="btn" data-act="close">${esc(tx('ui.common.cancel'))}</button><button class="btn primary" id="bumpOk">${esc(tx('ui.bump.create'))}</button></div></form>`;
  openModal({
    title: tx('ui.bump.title'), html,
    onClose: () => { if (opener && opener.isConnected && opener.focus) opener.focus(); },
    onMount: (b) => {
      const level = () => { const r = $('input[name="bumpLevel"]:checked', b); return r ? r.value : 'yama'; };
      const paintTag = () => { $('#bumpTag', b).textContent = v.tagOnek + 'v' + (first ? Rules.DEFAULT_VERSION : sug ? sug[level()] : 'X.Y.Z'); };
      paintTag();
      $$('input[name="bumpLevel"]', b).forEach((r) => r.addEventListener('change', paintTag));
      const showErr = (msg, extra) => {
        const er = $('#bumpErr'); if (!er) { toast(msg, 'error'); return; }
        er.textContent = msg; er.hidden = false;
        if (extra) { const bt = document.createElement('button'); bt.type = 'button'; bt.className = 'btn sm'; bt.dataset.act = extra.act; bt.textContent = extra.label; er.appendChild(document.createTextNode(' ')); er.appendChild(bt); }
      };
      const send = async (force, pick) => {
        const body = { path: c.path, level: pick.level, note: pick.note,
          raw: c.dirty ? FM.stringify(c.parsed) : undefined, baseMtime: force ? undefined : c.mtime };
        try {
          const r = await api('POST', '/api/version/bump', body);
          c.parsed = FM.parse(r.raw); c.savedRaw = r.raw; c.mtime = r.mtime; c.lead = leadOf(c.parsed); c.dirty = false; c.commitMsg = '';
          closeModal(); renderMain();
          toast(tx('ui.bump.created', { version: r.version, tag: r.tag }));
          afterWrite();
          return;
        } catch (e) {
          const d = e.data || {};
          if (d.needIdentity) { if (await askIdentity()) return send(force, pick); return; }
          if (e.status === 409 && d.conflict) {
            const a = await askChoice({
              title: tx('ui.conflict.title'), text: tx('ui.conflict.textBump'),
              choices: [{ id: 'cancel', label: tx('ui.common.cancel') }, { id: 'reload', label: tx('ui.conflict.reload') }, { id: 'force', label: tx('ui.conflict.overwrite'), kind: 'danger' }]
            });
            if (a === 'force') return send(true, pick);
            if (a === 'reload') { c.dirty = false; closeModal(); await openFile(c.path, { reload: true, tab: c.tab }); }
            return;
          }
          if (d.rollbackFailed) showErr(errText(e), { act: 'git', label: tx('ui.common.openGitPanel') });
          else showErr(errText(e));
          const ok = $('#bumpOk'); if (ok) ok.disabled = false;
        }
      };
      $('#bumpForm', b).addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const note = $('#bumpNote', b).value.trim();
        const er = $('#bumpErr', b);
        if (!note) { er.textContent = tx('ui.bump.noteEmpty'); er.hidden = false; $('#bumpNote', b).focus(); return; }
        er.hidden = true;
        if (c.dirty && !(await confirmTurRemoval(c, false))) return;
        $('#bumpOk', b).disabled = true;
        await send(false, { level: level(), note });
      });
    }
  });
}

async function save(force) {
  const c = S.cur; if (!c) return false;
  if (staleGuard()) return false;
  syncFromDom();
  if (!c.dirty && c.commitMsg.trim() && uncommitted(c.path)) return commitOnly();
  const before = c.isPrompt ? Rules.normTur(FM.meta(FM.parse(c.savedRaw)).tur) : '';
  if (!(await confirmTurRemoval(c, force))) return false;
  const raw = FM.stringify(c.parsed);
  const msg = c.commitMsg.trim();
  try {
    const r = await api('PUT', '/api/file', { path: c.path, raw, baseMtime: force ? undefined : c.mtime, commitMessage: msg || undefined });
    c.savedRaw = raw; c.mtime = r.mtime; c.dirty = false; c.external = false;
    c.restoredFrom = null; c.autoMsg = null;
    c.turClearedExplicitly = false;
    let needId = false;
    if (r.commit) {
      toast(tx('ui.save.savedAndCommitted', { hash: r.commit }));
      c.commitMsg = ''; const i = $('#commitMsg'); if (i) i.value = '';
    } else if (r.commitSkipped) toast(tx('ui.save.savedNothingToCommit'));
    else if (r.commitError && r.commitError.needIdentity) { toast(tx('ui.save.saved')); needId = true; }
    else if (r.commitError) toast(tx('ui.save.savedCommitFailed', { reason: errText(r.commitError) }), 'error');
    else toast(S.git && S.git.isRepo ? tx('ui.save.savedNoCommit') : tx('ui.save.saved'));
    if (c.isPrompt && !before) {
      const chk = Rules.publishCheck({ meta: FM.meta(c.parsed), hasFm: c.parsed.hasFm, fmBroken: Rules.isFmBroken(raw, c.parsed.hasFm) });
      if (chk && (chk.code === 'turYok' || chk.code === 'turGecersiz')) toast(chk.reason, 'warn', 7000);
    }
    updateDirty();
    const aw = afterWrite();
    if (needId) { await aw; if (await askIdentity()) await commitOnly(); }
    return true;
  } catch (e) {
    if (e.status === 409 && e.data && e.data.conflict) {
      const a = await askChoice({
        title: tx('ui.conflict.title'), text: tx('ui.conflict.textSave'),
        choices: [{ id: 'cancel', label: tx('ui.common.cancel') }, { id: 'reload', label: tx('ui.conflict.reload'), kind: '' }, { id: 'force', label: tx('ui.conflict.overwrite'), kind: 'danger' }]
      });
      if (a === 'force') return save(true);
      if (a === 'reload') { c.dirty = false; await openFile(c.path, { reload: true, tab: c.tab }); }
      return false;
    }
    fail(e); return false;
  }
}

async function afterWrite() {
  const gen = S.gen;
  await Promise.all([loadLibrary(), loadFacets(), loadGit(), loadRecent()]);
  if (gen !== S.gen) return; // bu arada marketplace değişti
  renderFilters(); renderList();
  if (isFiltering()) runSearch();
  const c = S.cur;
  if (c && c.isPrompt) {
    loadVersion();
    try { const r = await get('/api/file?' + qs({ path: c.path })); if (gen !== S.gen || S.cur !== c) return; c.publish = r.publish; c.generatedFrom = r.generatedFrom; const pp = $('#pubPill'); if (pp) pp.innerHTML = pubPill(); const u = $('#pubUsage'); if (u && r.publish) u.innerHTML = r.publish.tur === 'ajan' ? th('ui.edit.usageAgent', { name: r.publish.ad }) : th('ui.edit.usageCommand', { paket: r.publish.paket, name: r.publish.ad }); } catch (e) { /* sessiz */ }
  }
}

// Durum: c.hist = { mode: 'ver'|'commit', ver, commit } ya da { loading | stale | noRepo | error }.
async function loadCommitData(c, h) {
  const gen = S.gen;
  const [log, wd] = await Promise.all([get('/api/git/log?' + qs({ path: c.path })), get('/api/git/diff?' + qs({ path: c.path, working: 1 }))]);
  if (gen !== S.gen || S.cur !== c || c.hist !== h) return false;
  h.commit = { commits: log.commits, working: wd, sel: (wd.diff || wd.untracked) ? 'working' : (log.commits[0] ? log.commits[0].hash : null), diffs: {} };
  return true;
}

// Varsayılan seçim: en yeni iki sürüm; tek sürüm varsa o sürüm ile son commit; `pre` verilmişse o sürüm ve bir öncesi.
function newVerState(d, pre) {
  const vs = d.versions;
  const v = { data: d, a: null, b: null, sel: null, view: null, cmp: null, cache: {} };
  if (!vs.length) return v;
  const i = pre ? vs.findIndex((x) => x.tag === pre) : -1;
  if (i >= 0) { v.sel = vs[i].tag; v.b = vs[i].tag; v.a = vs[i + 1] ? vs[i + 1].tag : vs[i].tag; }
  else if (vs.length >= 2) { v.sel = vs[0].tag; v.b = vs[0].tag; v.a = vs[1].tag; }
  else { v.sel = vs[0].tag; v.a = vs[0].tag; v.b = 'HEAD'; }
  return v;
}

async function loadHistory() {
  const c = S.cur; if (!c) return;
  const gen = S.gen;
  const pre = S.histPreselect; S.histPreselect = null;
  c.hist = { loading: true }; paintHist();
  if (c.mp !== activeName()) { c.hist = { stale: true }; paintHist(); return; }
  const live = () => gen === S.gen && S.cur === c;
  try {
    const st = S.git || await loadGit();
    if (!live()) return;
    if (!st.isRepo) { c.hist = { noRepo: true }; paintHist(); return; }
    const h = { mode: 'commit', ver: null, commit: null };
    if (c.isPrompt) {
      const d = await get('/api/history/versions?' + qs({ path: c.path }));
      if (!live()) return;
      if (d.ad) {
        h.ver = newVerState(d, pre);
        h.mode = pre ? 'ver' : (S.histMode || (d.versions.length ? 'ver' : 'commit'));
      }
    }
    c.hist = h;
    if (h.mode === 'commit' && !(await loadCommitData(c, h))) return;
    paintHist();
    if (h.mode === 'ver') loadCompare();
  } catch (e) { if (S.cur === c) { c.hist = { error: e.message }; paintHist(); } }
}

async function setHistMode(mode) {
  const c = S.cur; const h = c && c.hist;
  if (!h || !h.ver || h.mode === mode) return;
  S.histMode = mode; h.mode = mode;
  try {
    if (mode === 'commit' && !h.commit) { paintHist(); if (!(await loadCommitData(c, h))) return; }
  } catch (e) { if (S.cur === c) { c.hist = { error: e.message }; paintHist(); } return; }
  paintHist();
  if (mode === 'ver') loadCompare();
}

function diffHtml(d) {
  return d.split('\n').map((l) => {
    let k = '';
    if (/^(\+\+\+|---|diff |index |new file|deleted file)/.test(l)) k = 'meta';
    else if (l.startsWith('@@')) k = 'hunk';
    else if (l[0] === '+') k = 'add';
    else if (l[0] === '-') k = 'del';
    return `<span class="dl ${k}">${esc(l) || ' '}</span>`;
  }).join('');
}

/** Summary: Frontmatter anahtarı -> görünen etiket sözlük anahtarı. */
const FIELD_LABEL_KEYS = { baslik: 'ui.fields.title', etiketler: 'ui.fields.tags', projeler: 'ui.fields.projects', durum: 'ui.fields.status', versiyon: 'ui.fields.version', olusturma: 'ui.fields.created', tur: 'ui.fields.type', paket: 'ui.fields.package', komut_adi: 'ui.fields.name', aciklama: 'ui.fields.description', arguman_ipucu: 'ui.fields.argumentHint', izinli_araclar: 'ui.fields.allowedTools', model: 'ui.fields.model' };

/** Summary: Frontmatter anahtarının görünen etiketi; bilinmeyen anahtar için boş döner. */
function fieldLabel(key) {
  if (!Object.prototype.hasOwnProperty.call(FIELD_LABEL_KEYS, key)) return '';
  const k = FIELD_LABEL_KEYS[key];
  return tx(k);
}

function verTimelineHtml(v) {
  return v.data.versions.map((x, i) => `<li><button type="button" class="tl" data-act="ver-pick" data-tag="${esc(x.tag)}" aria-current="${x.tag === v.sel}"><div class="s"><b>v${esc(x.version)}</b>${i === 0 ? ` <span class="pill ok">${esc(tx('ui.ver.latest'))}</span>` : ''}${x.renamed ? ` <span class="pill">${esc(tx('ui.ver.oldName', { name: base(x.pathAtTag) }))}</span>` : ''}${x.annotated ? '' : ` <span class="pill">${esc(tx('ui.ver.pillNoNote'))}</span>`}</div><div class="hint">${esc(fmtDate(x.date))}</div>${x.subject ? `<div>${esc(x.subject)}</div>` : ''}</button></li>`).join('');
}

function verCardHtml(v, x) {
  const i = v.data.versions.indexOf(x);
  const prev = v.data.versions[i + 1];
  return `<div class="vcard"><div><code>${esc(x.tag)}</code> <span class="hint">${esc(fmtDate(x.date))}</span></div>
    <div class="hint">${esc(x.tagger ? tx('ui.ver.byTagger', { tagger: x.tagger, short: x.short }) : tx('ui.ver.commitOnly', { short: x.short }))}</div>
    ${x.note ? `<div class="note">${esc(x.note)}</div>` : `<div class="hint">${esc(tx('ui.ver.noNoteHint'))}</div>`}
    <div class="btns"><button class="btn sm" data-act="ver-view" data-tag="${esc(x.tag)}">${esc(tx('ui.ver.view'))}</button><button class="btn sm" data-act="ver-load" data-tag="${esc(x.tag)}">${esc(tx('ui.ver.loadIntoEditor'))}</button>${prev ? `<button class="btn sm" data-act="ver-prev" data-tag="${esc(x.tag)}">${esc(tx('ui.ver.compareWithPrevious'))}</button>` : ''}</div></div>`;
}

function verViewHtml(v) {
  const w = v.view;
  if (w.loading) return `<p class="hint">${esc(tx('ui.ver.loading'))}</p>`;
  if (w.error) return `<p class="issue error">${esc(w.error)}</p><p><button class="btn sm" data-act="ver-view-close">${esc(tx('ui.static.close'))}</button></p>`;
  return `<div class="diffhead"><span><b>v${esc(w.version)}</b> <span class="hint">${esc(tx('ui.ver.readOnly', { date: fmtDate(w.date) }))}</span></span><button class="btn sm" data-act="ver-load" data-tag="${esc(w.tag)}">${esc(tx('ui.ver.loadIntoEditor'))}</button><button class="btn sm" data-act="ver-view-close">${esc(tx('ui.static.close'))}</button></div>
    <pre class="diff" aria-label="${esc(tx('ui.ver.contentLabel'))}">${w.raw.replace(/\r\n/g, '\n').split('\n').map((l) => `<span class="dl">${esc(l) || ' '}</span>`).join('')}</pre>`;
}

function fieldCellsHtml(f) {
  if (f.list) {
    const a = f.from.map((x) => (f.removed.includes(x) ? `<del class="chip"><span class="sr">${esc(tx('ui.hist.srRemoved'))} </span>−${esc(x)}</del>` : `<span class="chip">${esc(x)}</span>`)).join('');
    const b = f.to.map((x) => (f.added.includes(x) ? `<ins class="chip"><span class="sr">${esc(tx('ui.hist.srAdded'))} </span>+${esc(x)}</ins>` : `<span class="chip">${esc(x)}</span>`)).join('');
    return [a || '—', (b || '—') + (f.kind === 'sira' ? `<div class="hint">${esc(tx('ui.hist.orderOnly'))}</div>` : '')];
  }
  return [f.from == null ? '—' : `<del>${esc(f.from)}</del>`, f.to == null ? '—' : `<ins>${esc(f.to)}</ins>`];
}

function wordDiffHtml(hunks) {
  const tok = (t) => (t.t === '=' ? esc(t.s) : t.t === '-' ? `<del class="wd"><span class="sr">${esc(tx('ui.hist.srRemoved'))} </span>${esc(t.s)}</del>` : `<ins class="wd"><span class="sr">${esc(tx('ui.hist.srAdded'))} </span>${esc(t.s)}</ins>`);
  return hunks.map((h) => `<span class="dl hunk">${esc(tx('ui.hist.hunk', { line: h.newStart }))}</span>` + h.lines.map((ln) => `<span class="dl">${ln.map(tok).join('') || ' '}</span>`).join('')).join('');
}

function verCompareHtml(v) {
  if (!v.a || !v.b) return '';
  if (v.a === v.b) return `<p class="hint">${esc(tx('ui.ver.nothingToCompare'))}</p>`;
  const s = v.cmp;
  if (!s || s.loading) return `<p class="hint">${esc(tx('ui.ver.diffLoading'))}</p>`;
  if (s.error) return `<p class="issue ${s.code === 'ayniSurum' ? 'info' : 'error'}">${esc(s.code === 'ayniSurum' ? tx('ui.ver.sameContent') : s.error)}</p>`;
  const c = s.data;
  const la = verLabel(c.a.ref, c.a.version); const lb = verLabel(c.b.ref, c.b.version);
  let h = '';
  if (v.data.versions.length === 1 && v.b === 'HEAD') h += `<p class="hint">${esc(tx('ui.ver.singleVersion'))}</p>`;
  if (c.renamed) h += `<p class="hint">${esc(tx('ui.ver.renamedInRange', { from: c.a.pathAtRef, to: c.b.pathAtRef }))}</p>`;
  if (c.fmBroken.a || c.fmBroken.b) {
    if (c.fmBroken.a) h += `<p class="issue warn">${esc(tx('ui.ver.fmBroken', { label: la }))}</p>`;
    if (c.fmBroken.b) h += `<p class="issue warn">${esc(tx('ui.ver.fmBroken', { label: lb }))}</p>`;
  } else if (!c.fields.length) h += `<p class="hint">${esc(tx('ui.ver.noFieldChanges'))}</p>`;
  else {
    h += `<table class="fdiff"><caption>${esc(tx('ui.ver.fieldsCaption'))}</caption><thead><tr><th scope="col">${esc(tx('ui.ver.fieldColumn'))}</th><th scope="col">${esc(la)}</th><th scope="col">${esc(lb)}</th></tr></thead><tbody>${c.fields.map((f) => { const [x, y] = fieldCellsHtml(f); return `<tr><th scope="row">${fieldLabel(f.key) ? esc(fieldLabel(f.key)) : `<code>${esc(f.key)}</code>`}</th><td>${x}</td><td>${y}</td></tr>`; }).join('')}</tbody></table>`;
  }
  h += c.body.same ? `<p class="hint">${esc(tx('ui.ver.noBodyChanges'))}</p>` : `<pre class="diff wdiff" aria-label="${esc(tx('ui.ver.bodyDiffLabel'))}">${wordDiffHtml(c.body.hunks)}</pre>`;
  if (c.body.truncated) h += `<p class="hint">${esc(tx('ui.ver.truncated'))}</p>`;
  if (c.commits.length) {
    h += `<details><summary>${th('ui.ver.rangeCommits', { total: c.commits.length + (c.commitsTruncated ? '+' : '') })}</summary><ul class="commits" style="max-height:30vh">${c.commits.map((k) => `<li role="button" tabindex="0" data-act="ver-commit" data-hash="${esc(k.hash)}" data-path="${esc(k.path || '')}"><div class="s">${esc(k.subject)}</div><div class="hint">${esc(fmtDate(k.date))}, ${esc(k.short)}</div></li>`).join('')}</ul><pre class="diff" id="verCDiff" hidden></pre></details>`;
  }
  return h + `<p class="hint">${esc(tx('ui.ver.excludesUncommitted'))}</p>`;
}

function verMainHtml(v) {
  if (v.view) return verViewHtml(v);
  const x = v.sel && verByTag(v, v.sel);
  return (x ? verCardHtml(v, x) : '') + `<div id="verCmp" tabindex="-1" aria-label="${esc(tx('ui.ver.compareLabel'))}">${verCompareHtml(v)}</div>`;
}

function paintVer() {
  const c = S.cur; if (!c || c.tab !== 'hist') return;
  const h = c.hist; if (!h || h.mode !== 'ver' || !h.ver) return;
  const v = h.ver; const tl = $('#verTL'); const m = $('#verMain'); if (!tl || !m) return;
  if (!tl.firstChild) tl.innerHTML = verTimelineHtml(v);
  else $$('.tl', tl).forEach((b) => b.setAttribute('aria-current', String(b.dataset.tag === v.sel)));
  m.innerHTML = verMainHtml(v);
  const a = $('#verA'); const b = $('#verB');
  if (a && v.a) a.value = v.a;
  if (b && v.b) b.value = v.b;
}

async function loadCompare() {
  const c = S.cur; const h = c && c.hist; if (!h || !h.ver) return;
  const v = h.ver; const gen = S.gen;
  if (!v.a || !v.b || v.a === v.b) { v.cmp = null; paintVer(); return; }
  const key = v.a + '|' + v.b;
  if (v.cache[key]) { v.cmp = v.cache[key]; paintVer(); return; }
  v.cmp = { loading: true }; paintVer();
  let res;
  try { res = { data: await get('/api/history/compare?' + qs({ path: c.path, a: v.a, b: v.b })) }; } catch (e) { res = { error: e.message, code: e.data && e.data.code }; }
  if (gen !== S.gen || S.cur !== c || c.hist !== h) return;
  if (!res.error || res.code === 'ayniSurum') v.cache[key] = res;
  if (v.a + '|' + v.b === key) { v.cmp = res; paintVer(); }
}

function verPick(tag) {
  const h = S.cur && S.cur.hist; const v = h && h.ver; if (!v) return;
  const vs = v.data.versions; const i = vs.findIndex((x) => x.tag === tag); if (i < 0) return;
  v.sel = tag; v.view = null; v.b = tag; v.a = vs[i + 1] ? vs[i + 1].tag : tag;
  paintVer(); loadCompare();
}

function verSelChange() {
  const h = S.cur && S.cur.hist; const v = h && h.ver; if (!v) return;
  const vs = v.data.versions;
  const rank = (t) => (t === 'HEAD' ? -1 : vs.findIndex((x) => x.tag === t));
  let a = $('#verA').value; let b = $('#verB').value;
  if (rank(a) < rank(b)) [a, b] = [b, a]; // eski olan A, yeni olan B (HEAD her zaman en yeni)
  v.a = a; v.b = b; v.view = null;
  if (b !== 'HEAD') v.sel = b;
  paintVer(); loadCompare();
}

async function verView(tag) {
  const c = S.cur; const h = c && c.hist; const v = h && h.ver; if (!v) return;
  v.view = { tag, loading: true }; paintVer();
  let w;
  try { const r = await get('/api/history/show?' + qs({ path: c.path, tag })); w = { tag, version: r.version, date: r.date, raw: r.raw }; } catch (e) { w = { tag, error: e.message }; }
  if (S.cur !== c || c.hist !== h || !v.view || v.view.tag !== tag) return;
  v.view = w; paintVer();
  const b = $('#verMain button'); if (b) b.focus();
}

async function loadVersionIntoEditor(tag) {
  const c = S.cur; const h = c && c.hist; const v = h && h.ver; if (!v) return;
  if (staleGuard()) return;
  let r = v.view && v.view.tag === tag && v.view.raw != null ? v.view : null;
  if (!r) { try { r = await get('/api/history/show?' + qs({ path: c.path, tag })); } catch (e) { fail(e); return; } }
  if (S.cur !== c) return;
  await loadRawIntoEditor(r.raw, { source: 'version', version: r.version });
}

async function paintHist() {
  const c = S.cur; if (!c || c.tab !== 'hist') return;
  const pane = $('#pane'); if (!pane) return;
  pane.innerHTML = histPaneHtml();
  const h = c.hist; if (!h) return;
  if (h.mode === 'ver' && h.ver) { paintVer(); return; }
  const cm = h.commit; if (!cm || !cm.sel || !$('#diffBox')) return;
  const head = $('#diffHead'); const box = $('#diffBox');
  if (cm.sel === 'working') {
    if (cm.working.untracked) { box.textContent = tx('ui.hist.untrackedDiff'); head.innerHTML = ''; return; }
    box.innerHTML = diffHtml(cm.working.diff); head.innerHTML = `<span class="hint">${esc(tx('ui.hist.diffHead'))}</span>`;
    return;
  }
  const k = cm.commits.find((x) => x.hash === cm.sel); if (!k) return;
  head.innerHTML = `<span><b>${esc(k.subject)}</b> <span class="hint">${esc(fmtDate(k.date))}, ${esc(k.author)}</span></span><button class="btn sm" data-act="hist-load" data-hash="${k.hash}">${esc(tx('ui.ver.loadIntoEditor'))}</button>`;
  try {
    if (!cm.diffs[k.hash]) cm.diffs[k.hash] = (await get('/api/git/diff?' + qs({ hash: k.hash, path: k.path || c.path }))).diff;
    if (c.hist === h && cm.sel === k.hash) box.innerHTML = diffHtml(cm.diffs[k.hash] || tx('ui.hist.noDiff'));
  } catch (e) { box.textContent = e.message; }
}

async function loadOldVersion(hash) {
  const c = S.cur; const k = c && c.hist && c.hist.commit && c.hist.commit.commits.find((x) => x.hash === hash); if (!k) return;
  if (staleGuard()) return;
  let r;
  try { r = await get('/api/git/show?' + qs({ hash, path: k.path || c.path })); } catch (e) { fail(e); return; }
  if (S.cur !== c) return;
  await loadRawIntoEditor(r.raw, { source: 'commit', short: k.short });
}

// Eski bir içeriği yalnızca editöre koyar (diske yazmaz). Kaydedilmemiş değişiklik varsa önce sorar.
// c.savedRaw ve c.mtime değişmez: dirty olur, 409 çakışma koruması sürer. `versiyon` geriye gitmez.
async function loadRawIntoEditor(raw, from) {
  const c = S.cur; if (!c) return false;
  if (staleGuard()) return false;
  const isVersion = from.source === 'version';
  if (isDirty()) {
    const a = await askChoice({
      title: tx('ui.discard.title'),
      text: isVersion ? tx('ui.hist.replaceUnsavedVersion', { name: base(c.path), version: from.version }) : tx('ui.hist.replaceUnsavedCommit', { name: base(c.path), short: from.short }),
      choices: [{ id: 'cancel', label: tx('ui.common.cancel') }, { id: 'discard', label: tx('ui.hist.discardAndLoad'), kind: 'danger' }, { id: 'save', label: tx('ui.hist.saveFirst'), kind: 'primary' }]
    });
    if (a === 'save') { if (!(await save())) return false; } else if (a !== 'discard') return false;
    if (S.cur !== c) return false;
  }
  const p = FM.parse(raw); p.eol = c.eol; p.bom = c.bom;
  if (c.isPrompt) FM.set(p, 'versiyon', FM.meta(FM.parse(c.savedRaw)).versiyon);
  c.parsed = p; c.lead = leadOf(p);
  c.restoredFrom = from;
  const msg = isVersion ? tx('ui.hist.restoreMsgVersion', { version: from.version }) : tx('ui.hist.restoreMsgCommit', { short: from.short });
  if (!c.commitMsg.trim()) { c.commitMsg = msg; c.autoMsg = msg; }
  c.tab = c.isPrompt ? 'edit' : 'raw';
  renderMain(); updateDirty();
  toast(tx('ui.hist.loadedToast'));
  return true;
}

function cancelRestore() {
  const c = S.cur; if (!c || !c.restoredFrom) return;
  c.parsed = FM.parse(c.savedRaw); c.lead = leadOf(c.parsed);
  c.restoredFrom = null;
  if (c.autoMsg && c.commitMsg === c.autoMsg) c.commitMsg = '';
  c.autoMsg = null;
  renderMain(); updateDirty();
}

function templates() {

  };
}

const hasWord = (v) => /[\p{L}\p{N}]/u.test(v);
// Yolun plugin klasörü adı; klasörsüz/gelen kutusu/dışarıdaki yollar için ''.
const pluginOfPath = (p, mp) => { const cl = Rules.classifyPromptPath(p || '', libDirOf(mp)); return cl.kind === 'paket' ? cl.klasor : ''; };
const pluginOfItem = (it) => (!it ? '' : it.kind === 'plugin' ? it.node.name : (() => { const cl = Rules.classifyPromptPath(it.path || '', libDirOf(it.mp)); return cl.kind === 'paket' ? cl.klasor : ''; })());

// Yeni prompt için ön değer: seçili düğüm, açık dosya, son kullanılan, ilk plugin.
function defaultPlugin() {
  const m = activeMp(); if (!m) return '';
  const names = m.plugins.map((p) => p.name);
  const cands = [];
  if (S.sel && S.sel.mp === m.name) cands.push(pluginOfItem(S.modelMap.get(S.sel.key)));
  if (S.cur && S.cur.mp === m.name) cands.push(pluginOfItem({ path: S.cur.path, mp: S.cur.mp }));
  cands.push(ls.get(lsKey('sonPlugin'), ''));
  for (const c of cands) if (c && names.includes(c)) return c;
  return names[0] || '';
}

        const opts = targetOpts(name);
        const keep = $('#mvTarget', b).value;
        $('#mvTarget', b).innerHTML = opts.length ? opts.map((o) => `<option value="${esc(o.v)}">${esc(o.label)}</option>`).join('') : `<option value="">${esc(tx('ui.move.noPlugins'))}</option>`;
        const want = cross ? keep : (keep || defTarget);
        if (opts.some((o) => o.v === want)) $('#mvTarget', b).value = want;
        else if (!cross && opts.some((o) => o.v === defTarget)) $('#mvTarget', b).value = defTarget;
        $('#mvName', b).disabled = cross;
        if (cross) $('#mvName', b).value = base(path);
        $('#mvNote', b).textContent = cross ? tx('ui.move.noteCross', { name, from }) : tx('ui.move.noteSame');
      };
      fill();
      $('#mvMp', b).addEventListener('change', fill);
      $('#moveForm', b).addEventListener('submit', async (e) => {
        e.preventDefault();
        const toMp = $('#mvMp', b).value; const tv = $('#mvTarget', b).value; const er = $('#mvErr', b);
        const showErr = (msg) => { er.textContent = msg; er.hidden = false; };
        if (!tv) { showErr(tx('ui.move.pickTarget')); return; }
        if (activeName() !== from) { showErr(tx('ui.common.activeChangedRetry')); return; }
        if (S.cur && S.cur.path === path && !(await confirmDiscard())) return;
        try {
          if (toMp !== from) {
            await api('POST', '/api/prompts/transfer', { path, toMp, toPlugin: tv.slice(2) });
            closeModal();
            if (S.cur && S.cur.path === path) clearCur();
            S.mpOpen.add(toMp); saveMpOpen();
            await afterWrite(); renderMain();
            toast(tx('ui.move.movedCross', { toMp, from }), 'ok', 7000);
            return;
          }
          const kind = tv.charAt(0); const nm = tv.slice(2);
          const dir = kind === 'p' ? m.libraryDir + '/' + nm : kind === 'i' ? m.libraryDir + '/' + Rules.INBOX_DIR : m.libraryDir;
          let file = $('#mvName', b).value.trim() || base(path);
          if (!/\.[^.]+$/.test(file)) file += (path.match(/\.[^.]+$/) || ['.md'])[0];
          const to = dir + '/' + file;
          if (to === path) { closeModal(); return; }
          const r = await api('POST', '/api/rename', { from: path, to });
          closeModal();
          if (S.cur && S.cur.path === path) { S.cur.path = r.path; ls.set(lsKey('last'), r.path); }
          expandParents(r.path);
          await afterWrite(); renderMain();
          toast(tx('ui.move.movedSame'), 'ok', 6000);
        } catch (err) { showErr(err.message); }
      });
    }
  });
}

// Prompt dosyasını aynı klasörde yeniden adlandırır.
async function renameFile(path) {
  const dir = path.split('/').slice(0, -1).join('/');
  const nm = await askText({ title: tx('ui.menu.rename'), label: tx('ui.rename.newFileName'), value: base(path), ok: tx('ui.rename.apply') });
  if (!nm || nm === base(path)) return;
  let file = nm; if (!/\.[^.]+$/.test(file)) file += (path.match(/\.[^.]+$/) || ['.md'])[0];
  await renameItem(path, dir + '/' + file);
}

async function renameItem(p, to) {
  if (to === undefined) to = await askText({ title: tx('ui.menu.renameOrMove'), label: tx('ui.rename.newPath'), value: p, hint: tx('ui.rename.pathHint'), ok: tx('ui.rename.apply') });
  if (!to || to === p) return;
  if (S.cur && (S.cur.path === p || S.cur.path.startsWith(p + '/')) && !(await confirmDiscard())) return;
  try {
    const r = await api('POST', '/api/rename', { from: p, to });
    if (S.cur && (S.cur.path === p || S.cur.path.startsWith(p + '/'))) { S.cur.path = r.path + S.cur.path.slice(p.length); ls.set(lsKey('last'), S.cur.path); }
    expandParents(r.path); await afterWrite(); renderMain();
    toast(tx('ui.rename.moved'), 'ok', 5000);
  } catch (e) { fail(e); }
}

async function renamePlugin(name) {
  const m = activeMp(); if (!m) return;
  const to = await askText({ title: tx('ui.rename.pluginTitle'), label: tx('ui.rename.newName'), value: name, hint: tx('ui.rename.pluginHint'), ok: tx('ui.rename.continue') });
  if (!to || to === name) return;
  const slug = FM.slug(to);
  const a = await askChoice({
    title: tx('ui.rename.pluginConfirmTitle'),
    text: tx('ui.rename.pluginConfirmText', { name, slug, output: FM.slug(name) }),
    choices: [{ id: 'no', label: tx('ui.common.cancel') }, { id: 'yes', label: tx('ui.menu.rename'), kind: 'primary' }]
  });
  if (a !== 'yes') return;
  const old = m.libraryDir + '/' + name;
  if (S.cur && S.cur.path.startsWith(old + '/') && !(await confirmDiscard())) return;
  try {
    const r = await api('POST', '/api/package/rename', { from: name, to });
    const ex = expOf(m.name);
    if (ex.delete(old)) ex.add(r.plugin.path);
    saveExp(m.name);
    if (S.cur && S.cur.path.startsWith(old + '/')) { S.cur.path = r.plugin.path + S.cur.path.slice(old.length); ls.set(lsKey('last'), S.cur.path); }
    if (ls.get(lsKey('sonPlugin'), '') === name) ls.set(lsKey('sonPlugin'), r.plugin.name);
    S.sel = { mp: m.name, key: nodeKey(m.name, r.plugin.path) }; S.focusKey = S.sel.key;
    await afterWrite(); renderMain();
    toast(tx('ui.rename.pluginRenamed', { name: r.plugin.name, count: r.moved }), 'ok', 5000);
  } catch (e) { fail(e); }
}

async function editPluginDesc(name) {
  const pl = pluginsOf(activeMp()).find((p) => p.name === name);
  const d = await askText({ title: tx('ui.pluginDesc.title', { name }), label: tx('ui.fields.description'), value: (pl && pl.description) || '', hint: tx('ui.pluginDesc.hint'), ok: tx('ui.file.save') });
  if (!d) return;
  try { await api('PUT', '/api/package', { name, description: d }); await afterWrite(); toast(tx('ui.pluginDesc.saved')); } catch (e) { fail(e); }
}

async function deleteItem(p, text) {
  const a = await askChoice({ title: tx('ui.delete.title'), text: text || tx('ui.delete.text', { path: p }), choices: [{ id: 'no', label: tx('ui.common.cancel') }, { id: 'yes', label: tx('ui.delete.confirm'), kind: 'danger' }] });
  if (a !== 'yes') return;
  try {
    await api('DELETE', '/api/file?' + qs({ path: p }));
    if (S.cur && (S.cur.path === p || S.cur.path.startsWith(p + '/'))) clearCur();
    await afterWrite(); renderMain(); toast(tx('ui.delete.trashed'));
  } catch (e) { fail(e); }
}

              const res = await api('POST', '/api/import/run', { dir: r.dir, files, target: String(f.get('target')).trim() || lib + '/' + Rules.INBOX_DIR });

/* --------------------------------------------------------------------- git */
function renderGitBadge() {
  const b = $('#gitBadge'); const g = S.git;
  if (!g) { b.hidden = true; return; }
  if (!g.isRepo) { b.hidden = false; b.className = 'badge warn'; b.textContent = '!'; b.title = tx('ui.tree.notGitRepo'); return; }
  const n = g.files.length;
  b.className = 'badge'; b.hidden = !n; b.textContent = n; b.title = tx('ui.git.badgePending', { count: n });
}

/** Summary: Git durum kodu -> görünen etiket sözlük anahtarı. */
const GLABEL_KEYS = { '?': 'ui.git.changeNew', M: 'ui.git.changeModified', D: 'ui.git.changeDeleted', A: 'ui.git.changeAdded', R: 'ui.git.changeMoved' };

/** Summary: Git durum kodunun görünen etiketi; bilinmeyen kod ham döner. */
function changeLabel(code) {
  if (!Object.prototype.hasOwnProperty.call(GLABEL_KEYS, code)) return code;
  const k = GLABEL_KEYS[code];
  return tx(k);
}

const gitTitle = () => (S.info.activeMarketplace ? tx('ui.git.title', { name: S.info.activeMarketplace }) : tx('ui.git.titleNoMarketplace'));
const gitTarget = () => `<p class="hint" style="margin:0">${th('ui.git.target', { name: S.info.activeMarketplace || '', root: S.info.root || '' })}</p>`;

async function openGit(tab) {
  S.gitLogLimit = 300;
  if (!setupOk()) {
    openModal({
      title: tx('ui.static.git'),
      html: `<p>${th('ui.git.disabled', { error: firstError() || '' })}</p><div class="foot"><button class="btn primary" data-act="settings">${esc(tx('ui.common.openSettings'))}</button></div>`
    });
    return;
  }
  openModal({ title: gitTitle(), wide: true, html: `<p class="hint">${esc(tx('ui.common.loading'))}</p>`, noFocus: true });
  await loadGit();
  if (tab === 'log') return paintGitLog();
  if (tab === 'remote') return paintGitRemote();
  paintGit();
}

function gitTabs(on) {
  const changes = S.git && S.git.isRepo ? tx('ui.git.tabChangesCount', { count: S.git.files.length }) : tx('ui.git.tabChanges');
  return `<div class="tabs" role="tablist"><button class="tab ${on === 'changes' ? 'on' : ''}" data-act="git-tab" data-tab="changes">${esc(changes)}</button><button class="tab ${on === 'log' ? 'on' : ''}" data-act="git-tab" data-tab="log">${esc(tx('ui.main.tabHistory'))}</button><button class="tab ${on === 'remote' ? 'on' : ''}" data-act="git-tab" data-tab="remote">${esc(tx('ui.git.tabRemote'))}</button></div><div style="height:14px"></div>`;
}

// Git panelindeki dal etiketi (düz metin). Ayrık HEAD'de dal adı yoktur: 'main' yazılmaz, kısa commit gösterilir.
function branchLabel(g) {
  if (g.detached) return tx('ui.git.detachedHead', { head: g.head || '?' });
  return g.branch || '?';
}

// Dal satırı (HTML). Ayrıkken ek bir satır, commit'lerin bir dala bağlı olmadığını söyler.
function branchLine(g) {
  if (g.detached) {
    return `<div class="hint"><b>${esc(branchLabel(g))}</b></div><div class="hint" id="detachedHint">${esc(tx('ui.git.detachedHint'))}</div>`;
  }
  return `<div class="hint">${g.hasCommits ? th('ui.git.branch', { branch: branchLabel(g) }) : th('ui.git.branchNoCommits', { branch: branchLabel(g) })}</div>`;
}

function paintGit() {
  const g = S.git; const body = $('#mBody');
  if (!g.isRepo) {
    // Kurulum hazırken normalde ulaşılmaz; savunma amaçlı.
    body.innerHTML = `<p>${g.error ? th('ui.git.notInitializedError', { error: g.error }) : esc(tx('ui.git.notInitialized'))}</p>
      <p class="hint">${th('ui.git.initHint', { root: S.info.root || '' })}</p>
      <div class="foot"><button class="btn primary" data-act="mk-git-init" data-name="${esc(S.info.activeMarketplace)}">${esc(tx('ui.common.initGit'))}</button></div>`;
    return;
  }
  if (!S.gitSel) S.gitSel = new Set();
  const paths = g.files.map((f) => f.path);
  for (const p of Array.from(S.gitSel)) if (!paths.includes(p)) S.gitSel.delete(p);
  if (S.gitSel.size === 0 && !S.gitSelTouched) paths.forEach((p) => S.gitSel.add(p));
  const idOpen = !g.identity.name || !g.identity.email;
  const suggestion = g.files.length === 1 ? tx('ui.git.suggestOne', { name: stem(g.files[0].path) }) : (g.files.length ? tx('ui.git.suggestMany', { count: g.files.length }) : '');
  body.innerHTML = gitTabs('changes') + `<div class="gitgrid"><div class="gitleft">
    ${gitTarget()}
    ${branchLine(g)}
    ${g.files.length ? `<div class="ftable">${g.files.map((f) => `<div class="gf" data-gpath="${esc(f.path)}"><input type="checkbox" data-gsel="${esc(f.path)}" ${S.gitSel.has(f.path) ? 'checked' : ''} aria-label="${esc(tx('ui.git.includeInCommit', { path: f.path }))}"><button class="link" data-act="git-diff" data-path="${esc(f.path)}" title="${esc(f.path)}">${esc(f.path)}</button><span class="pill ${f.code === 'D' ? 'bad' : f.code === '?' ? 'ok' : 'warn'}">${esc(changeLabel(f.code))}</span></div>`).join('')}</div>
      <button class="btn sm" data-act="git-selall" style="justify-self:start">${esc(tx('ui.import.toggleAll'))}</button>`
      : `<p>${esc(tx('ui.git.noChanges'))}</p>`}
    <details id="gitId" ${idOpen ? 'open' : ''}><summary>${idOpen ? esc(tx('ui.git.identityRequired')) : esc(tx('ui.identity.title')) + ' '}</summary>
      <div class="stack" style="margin-top:8px"><input id="gName" placeholder="${esc(tx('ui.identity.name'))}" value="${esc(g.identity.name)}" aria-label="${esc(tx('ui.git.identityNameLabel'))}"><input id="gMail" placeholder="${esc(tx('ui.git.identityEmailPlaceholder'))}" value="${esc(g.identity.email)}" aria-label="${esc(tx('ui.git.identityEmailLabel'))}"><button class="btn sm" data-act="git-identity" style="justify-self:start">${esc(tx('ui.git.saveIdentity'))}</button></div></details>
    ${g.files.length ? `<label>${esc(tx('ui.git.commitMessage'))}<textarea id="gMsg" rows="4" placeholder="${esc(tx('ui.git.commitPlaceholder'))}">${esc(S.gitMsg || suggestion)}</textarea></label>
      <button class="btn primary" data-act="git-commit">${esc(tx('ui.git.commitSelected'))}</button>` : ''}
    </div><div><pre class="diff" id="gDiff">${esc(tx('ui.git.diffPlaceholder'))}</pre></div></div>`;
}

const GITLOG_MODES = ['file', 'commit', 'version'];

function gitLogBar(mode) {
  const b = (m, label) => `<button type="button" data-act="gitlog-mode" data-mode="${m}" aria-pressed="${mode === m}">${esc(label)}</button>`;
  return `<div class="seg" role="group" aria-label="${esc(tx('ui.hist.viewLabel'))}">${b('file', tx('ui.git.logByFile'))}${b('commit', tx('ui.git.logByCommit'))}${b('version', tx('ui.git.logByVersion'))}</div> <span class="hint">${th('ui.git.activeRepo', { name: S.info.activeMarketplace || '' })}</span>`;
}

async function paintGitLog() {
  const body = $('#mBody');
  if (!S.git.isRepo) return paintGit();
  let mode = ls.get('pp.gitLogMode', 'file'); if (!GITLOG_MODES.includes(mode)) mode = 'file';
  const tok = S.glTok = (S.glTok || 0) + 1;
  const head = gitTabs('log') + gitLogBar(mode);
  body.innerHTML = head + `<div id="glBody"><p class="hint">${esc(tx('ui.common.loading'))}</p></div>`;
  const live = () => tok === S.glTok && $('#glBody');
  const fill = (html) => { if (live()) $('#glBody').innerHTML = html; };
  try {
    if (mode === 'commit') {
      const r = await get('/api/git/log');
      fill(r.commits.length
        ? `<div class="hist"><ul class="commits" style="max-height:62vh">${r.commits.map((k) => `<li role="button" tabindex="0" data-act="git-show" data-hash="${k.hash}"><div class="s">${esc(k.subject)}</div><div class="hint">${esc(fmtDate(k.date))}, ${esc(k.short)}</div></li>`).join('')}</ul><pre class="diff" id="gDiff">${esc(tx('ui.hist.pickEntry'))}</pre></div>`
        : `<p>${esc(tx('ui.git.noCommitsYet'))}</p>`);
    } else if (mode === 'file') {
      const r = await get('/api/history/changes?' + qs({ group: 'file', limit: S.gitLogLimit || 300 }));
      if (!r.files.length) { fill(`<p>${esc(tx('ui.git.noCommitsYet'))}</p>`); return; }
      const files = r.files.map((f) => `<details class="gfile"><summary>${esc(f.path)} <span class="hint">${esc(tx('ui.git.fileCommits', { count: f.count, date: fmtDate(f.last.date) }))}</span>${f.status === 'D' ? ` <span class="pill bad">${esc(tx('ui.git.fileDeleted'))}</span>` : ''}${f.oldPaths.length ? ` <span class="pill">${esc(tx('ui.git.fileRenamed'))}</span>` : ''}</summary>
        <div class="gcs">${f.exists ? `<div><button class="btn sm" data-act="open-close" data-mp="${esc(r.mp)}" data-path="${esc(f.path)}">${esc(tx('ui.git.openFile'))}</button></div>` : ''}${f.commits.map((k) => `<button type="button" class="link" data-act="gitlog-file-commit" data-hash="${esc(k.hash)}" data-path="${esc(k.path)}">${esc(k.subject)} <span class="hint">${esc(fmtDate(k.date))}, ${esc(k.short)}${k.oldPath ? ', ' + esc(k.oldPath) + ' → ' + esc(k.path) : ''}</span></button>`).join('')}</div></details>`).join('');
      const more = r.hasMore && (S.gitLogLimit || 300) < 3000 ? `<p><button class="btn sm" data-act="gitlog-more">${esc(tx('ui.git.loadOlder'))}</button></p>` : (r.hasMore ? `<p class="hint">${esc(tx('ui.git.olderLimit', { limit: 3000 }))}</p>` : '');
      fill(`<div class="hist"><div><div class="gfilelist">${files}</div>${more}</div><pre class="diff" id="gDiff">${esc(tx('ui.git.fileDiffPlaceholder'))}</pre></div>`);
    } else {
      const r = await get('/api/history/changes?group=version');
      if (!r.prompts.length && !r.unmatched.length) { fill(`<p>${esc(tx('ui.git.noVersions'))}</p>`); return; }
      const ver = (p, v) => `<li><button type="button" class="link" data-act="gitlog-ver" data-path="${esc(p)}" data-tag="${esc(v.tag)}">v${esc(v.version)}</button> <span class="hint">${esc(fmtDate(v.date))}${v.subject ? ', ' + esc(v.subject) : ''}</span></li>`;
      fill(`<div class="gfilelist">${r.prompts.map((p) => `<details class="gfile"><summary>${esc(p.ad)} <span class="hint">${esc(tx('ui.git.latestVersion', { version: p.versions[0].version }))}</span></summary><ul>${p.versions.map((v) => ver(p.path, v)).join('')}</ul></details>`).join('')}</div>`
        + (r.unmatched.length ? `<h3>${esc(tx('ui.git.unmatchedVersions'))}</h3><ul>${r.unmatched.map((u) => `<li><code>${esc(u.ad)}</code>: ${u.versions.map((v) => 'v' + esc(v.version)).join(', ')}</li>`).join('')}</ul>` : ''));
    }
  } catch (e) { fill(`<p class="issue error">${esc(e.message)}</p>`); }
}

// "Sürüme göre" listesinden bir sürüme gidiş: dosyayı Geçmiş sekmesinde, o sürüm seçili açar.
async function openVersionInHistory(path, tag) {
  closeModal();
  S.histPreselect = tag;
  try {
    const c = S.cur;
    if (c && c.path === path && c.mp === activeName()) {
      // Dosya zaten açık: openFile erken döndüğü için sekme doğrudan değiştirilir.
      if (c.tab === 'hist') loadHistory(); else setTab('hist');
    } else await openIn(activeName(), path, { tab: 'hist' });
  } finally { S.histPreselect = null; }
}

async function gitDiffFor(p) {
  const box = $('#gDiff'); if (!box) return;
  $$('.gf').forEach((x) => x.classList.toggle('on', x.dataset.gpath === p));
  const f = S.git.files.find((x) => x.path === p);
  try {
    if (f && f.code === '?') {
      const r = await get('/api/file?' + qs({ path: p }));
      box.innerHTML = diffHtml(('+++ ' + tx('ui.git.newFile', { path: p }) + '\n' + r.raw.replace(/\r\n/g, '\n').replace(/\n$/, '').split('\n').map((l) => '+' + l).join('\n')));
      return;
    }
    const r = await get('/api/git/diff?' + qs({ path: p, working: 1 }));
    box.innerHTML = r.diff ? diffHtml(r.diff) : esc(tx('ui.git.noDiff'));
  } catch (e) { box.textContent = e.message; }
}

async function gitCommit() {
  const msg = ($('#gMsg') || {}).value || '';
  const paths = Array.from(S.gitSel || []);
  if (!paths.length) { toast(tx('ui.git.pickFile'), 'error'); return; }
  if (!msg.trim()) { toast(tx('ui.git.writeMessage'), 'error'); return; }
  try {
    const r = await api('POST', '/api/git/commit', { message: msg, paths });
    S.gitMsg = ''; S.gitSel = null; S.gitSelTouched = false;
    toast(tx('ui.git.committed', { hash: r.commit }));
    await loadGit(); paintGit(); loadRecent();
    if (S.cur && S.cur.tab === 'hist') loadHistory();
  } catch (e) {
    if (e.data && e.data.needIdentity) { const d = $('#gitId'); if (d) d.open = true; }
    fail(e);
  }
}

async function mkUpdate() {
  const st = S.mk; if (!st) return;
  const writes = st.items.filter((i) => i.state !== 'guncel').length;

  const list = st.orphans.slice(0, 6).map((o) => o.target).join(', ') + (removes > 6 ? ' …' : '');

  if (a !== 'yes') { openMarket(); return; }
  try {

    const sk = (r.skippedPackages || []).length ? { names: r.skippedPackages.map((x) => x.name).join(', ') } : null;

/** Summary: Paket sayfasındaki değişim kodu (yeni|degisti|ayni) -> görünen etiket sözlük anahtarı. */

/** Summary: Paket sayfasındaki değişim kodunun görünen etiketi; bilinmeyen kod ham döner. */
function pkChangeLabel(code) {
  if (!Object.prototype.hasOwnProperty.call(PK_CHANGE_KEYS, code)) return code == null ? '' : String(code);
  const k = PK_CHANGE_KEYS[code];
  return tx(k);
}

// Seçilebilir sürüm seçenekleri: [{ id, label, value }]
function pkOptions(d) {
  const p = d.proposal; const base = d.baseVersion;
  if (!base) return [{ id: 'ilk', label: tx('ui.pkg.optFirst', { version: Rules.DEFAULT_VERSION }), value: Rules.DEFAULT_VERSION }];
  if (p.tagOnly) return [{ id: 'etiket', label: tx('ui.pkg.optTagExisting', { version: base }), value: base }];
  return Rules.VERSION_LEVELS.map((lv) => {
    const next = Rules.bumpVersion(base, lv);
    const params = { level: Rules.LEVEL_LABEL[lv], version: String(next) };
    return { id: lv, label: p.level === lv ? tx('ui.pkg.optLevelRecommended', params) : tx('ui.pkg.optLevel', params), value: next };
  });
}

// Seçili sürüm: { value, custom }
function pkChosen() {
  const r = $$('input[name="pkLevel"]').find((x) => x.checked);
  if (!r) return { value: '', custom: false };
  return r.dataset.id === 'ozel' ? { value: ($('#pkCustom').value || '').trim(), custom: true } : { value: r.value, custom: false };
}

// Anında doğrulama; Yayınla düğmesini ve nedenini günceller. Geçerliyse true.
function pkValidate() {
  const pk = S.pk; const d = pk && pk.d; if (!d || !$('#pkGo')) return false;
  const ch = pkChosen();
  const why = [];
  let verErr = '';
  if (ch.custom || d.baseVersion) {
    verErr = Rules.checkVersion(ch.value) || '';
    if (!verErr && d.baseVersion) {
      const cmp = Rules.compareVersions(ch.value, d.baseVersion);
      if (cmp < 0 || (cmp === 0 && !d.proposal.tagOnly)) verErr = tx('ui.pkg.errNotGreater', { base: d.baseVersion });
    }
    if (!verErr && d.tags.some((t) => t.version === ch.value)) verErr = tx('ui.pkg.errTagExists', { tag: 'paket/' + d.name + '/v' + ch.value });
  }
  const cat = ($('#pkCat').value || '').trim();
  let catErr = Rules.checkVersion(cat) || '';
  if (!catErr && Rules.compareVersions(cat, Rules.coerceVersion(d.marketplaceVersion.current).version || '0.0.0') < 0) catErr = tx('ui.pkg.errCatalogLower', { current: d.marketplaceVersion.current });
  showFieldErr('pkVerErr', verErr); showFieldErr('pkCatErr', catErr);
  const cu = $('#pkCustom'); if (cu) { if (verErr && ch.custom) cu.setAttribute('aria-invalid', 'true'); else cu.removeAttribute('aria-invalid'); }
  if ((d.issues || []).length) why.push(tx('ui.pkg.whyBlockers'));
  if ((d.dirty || []).length) why.push(tx('ui.pkg.whyDirty'));
  if (!d.exportedCount) why.push(tx('ui.pkg.whyEmpty'));
  if (d.proposal.noChange && !ch.custom) why.push(tx('ui.pkg.whyNoChange'));
  if (verErr) why.push(verErr);
  if (catErr) why.push(catErr);
  $('#pkGo').disabled = why.length > 0;
  $('#pkWhy').textContent = why.join(' ');
  return why.length === 0;
}

// Yayınla: onay bilgisi sayfa içinde gösterilir (pencere değişmez).
function pkAsk() {
  const pk = S.pk; const d = pk && pk.d; if (!d || !pkValidate()) return;
  const ch = pkChosen(); const cat = $('#pkCat').value.trim(); const push = !!$('#pkPush').checked && !$('#pkPush').disabled;
  const w = d.prompts.filter((p) => p.change !== 'ayni').length; const rm = d.removed.length;
  const params = { name: d.name, version: ch.value, writes: w, removes: rm, catalog: cat, tag: 'paket/' + d.name + '/v' + ch.value, remote: d.remote || '' };
  const text = push ? tx('ui.pkg.confirmTextPush', params) : tx('ui.pkg.confirmText', params);
  pk.pending = { version: ch.value, marketplaceVersion: cat, push };
  $('#pkConfirm').innerHTML = `<div class="issue warn" role="alert">${esc(text)}</div><div class="foot-left"><button class="btn primary" data-act="pk-confirm" id="pkOk">${esc(tx('ui.pkg.confirmGo'))}</button><button class="btn" data-act="pk-cancel">${esc(tx('ui.common.cancel'))}</button></div>`;
  $('#pkOk').focus();
}

async function pkPublish() {
  const pk = S.pk; const d = pk && pk.d; if (!d || !pk.pending) return;
  const body = { name: d.name, ...pk.pending };
  $('#pkConfirm').innerHTML = '';
  const go = $('#pkGo'); if (go) go.disabled = true;
  const steps = [tx('ui.pkg.stepWrite'), tx('ui.pkg.stepCommit')].concat(body.push ? [tx('ui.pkg.stepPush')] : []);
  let i = 0;
  const prog = $('#pkProg'); if (prog) prog.textContent = steps[0];
  const tick = setInterval(() => { i = Math.min(i + 1, steps.length - 1); const p2 = $('#pkProg'); if (p2) p2.textContent = steps[i]; }, 1500);
  try {
    const r = await api('POST', '/api/package/publish', body);
    clearInterval(tick);
    toast(r.push && r.push.ok ? tx('ui.pkg.publishedPushed', { name: d.name, version: r.version }) : tx('ui.pkg.published', { name: d.name, version: r.version }), 'ok', 4000);
    if (S.pk) S.pk.msg = r.push && !r.push.ok ? { kind: 'warn', text: tx('ui.pkg.localPublishedPushPending', { error: r.push.error || '' }), retry: true } : null;
    afterWrite(); if (S.cur && S.cur.tab === 'hist') loadHistory();
  } catch (e) {
    clearInterval(tick);
    if (S.pk) S.pk.msg = { kind: 'error', text: e.data && e.data.needIdentity ? tx('ui.pkg.errorNeedIdentity', { error: errText(e) }) : errText(e) };
  }
  if (S.pk) { S.pk.pending = null; S.pk.noFocus = false; await pkLoad(); }
}

async function pkPushOnly() {
  const pk = S.pk; if (!pk) return;
  try {
    const r = await api('POST', '/api/git/push', {});
    pk.msg = r.ok ? { kind: 'info', text: tx('ui.pkg.pushedMsg') } : { kind: 'warn', text: tx('ui.pkg.pushFailed', { error: r.error || '' }), retry: true };
    if (r.ok) toast(tx('ui.remote.pushed'));
  } catch (e) { pk.msg = { kind: 'error', text: e.message }; }
  pk.noFocus = false; await pkLoad(); loadGit();
}

async function pkAlignField(path) {
