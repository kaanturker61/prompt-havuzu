/** Summary: Uzak depo sağlayıcısının görünen adı (github|gitlab|diger); bilinmeyen değer ham döner. */
function providerLabel(provider) {
  if (provider === 'github') return 'GitHub';
  if (provider === 'gitlab') return 'GitLab';
  if (provider === 'diger') return tx('ui.remote.providerOther');
  return provider == null ? '' : String(provider);
}

/** Summary: Uzak depo durum satırı (HTML): dal, varsa izlenen dal, ileri/geri sayısı ve varsa son kontrol saati. */
function remoteStatusLine(r, time) {
  const p = { branch: r.branch || '?', upstream: r.upstream, ahead: r.ahead, behind: r.behind, time };
  if (r.upstream) return time ? th('ui.remote.statusBranchUpstreamChecked', p) : th('ui.remote.statusBranchUpstream', p);
  return time ? th('ui.remote.statusBranchChecked', p) : th('ui.remote.statusBranch', p);
}

async function paintGitRemote() {
  const body = $('#mBody');
  if (!S.git.isRepo) return paintGit();
  const tok = S.glTok = (S.glTok || 0) + 1;
  body.innerHTML = gitTabs('remote') + `<div id="rmBody"><p class="hint">${esc(tx('ui.common.loading'))}</p></div>`;
  let r;
  try { r = await get('/api/git/remotes'); } catch (e) { if (tok === S.glTok && $('#rmBody')) $('#rmBody').innerHTML = `<p class="issue error">${esc(e.message)}</p>`; return; }
  if (tok !== S.glTok || !$('#rmBody')) return;
  S.remote = r;
  const lc = r.lastCheck;
  const time = lc && lc.at ? I18n.time(lc.at) : null;
  const canPull = r.behind > 0 && r.ahead === 0;
  const whyNo = !r.remotes.length ? tx('ui.remote.whyNoRemote') : r.behind === 0 ? tx('ui.remote.whyUpToDate') : r.ahead > 0 ? tx('ui.remote.whyDiverged') : '';
  const hasR = r.remotes.length > 0;
  $('#rmBody').innerHTML = `<p class="hint" style="margin:0">${th('ui.git.activeRepo', { name: activeName() })}</p>
    ${r.remotes.length ? `<div class="mklist">${r.remotes.map((x) => `<div class="mkrow"><div><b>${esc(x.name)}</b> <span class="pill">${esc(providerLabel(x.provider))}</span><div class="hint mono">${esc(x.url)}</div></div><div></div><div class="mkbtns"><button class="btn sm" data-act="remote-edit" data-name="${esc(x.name)}" data-url="${esc(x.url)}">${esc(tx('ui.main.tabEdit'))}</button></div></div>`).join('')}</div>` : `<p class="hint">${esc(tx('ui.remote.none'))}</p>`}
    <form class="stack" id="rmAdd" novalidate style="margin:10px 0"><h3>${esc(tx('ui.remote.addTitle'))}</h3>
      <div class="inline"><label>${esc(tx('ui.fields.name'))}<input id="rmName" value="${r.remotes.length ? '' : 'origin'}" autocomplete="off" style="width:110px"></label><label class="grow">${esc(tx('ui.remote.urlLabel'))}<input id="rmUrl" autocomplete="off" aria-describedby="rmUrlHint rmErr" placeholder="${esc(tx('ui.newMp.urlPlaceholder'))}"></label><button class="btn" data-act="remote-add">${esc(tx('ui.remote.add'))}</button></div>
      <div class="hint" id="rmUrlHint">${esc(tx('ui.remote.urlHint'))}</div>
      <div class="issue error" id="rmErr" role="alert" hidden></div></form>
    ${hasR ? `<h3>${esc(tx('ui.fields.status'))}</h3><p>${remoteStatusLine(r, time)}</p>
      ${lc && lc.ok === false ? `<div class="issue warn" role="status">${th('ui.remote.lastCheckFailed', { error: lc.error || '' })}</div>` : ''}
      ${r.pendingTags.length ? `<p class="issue warn">${th('ui.remote.pendingTags', { tags: r.pendingTags.join(', ') })}</p>` : ''}
      <div class="inline"><button class="btn primary" data-act="remote-push">${esc(tx('ui.remote.push'))}</button><button class="btn" data-act="remote-fetch">${esc(tx('ui.remote.check'))}</button>
        <button class="btn" data-act="remote-pull" ${canPull ? '' : 'disabled'} aria-describedby="rmWhy">${esc(tx('ui.remote.update'))}</button></div>
      <div class="hint" id="rmWhy">${esc(canPull ? tx('ui.remote.whyCanPull', { count: r.behind }) : whyNo)}</div>
      <div id="rmMsg" aria-live="polite"></div>
      ${lc && lc.newCommits && lc.newCommits.length ? `<h3>${esc(tx('ui.remote.newCommits'))}</h3><ul>${lc.newCommits.map((c) => `<li>${esc(c.subject)} <span class="hint">${esc(c.short)}, ${esc(fmtDate(c.date))}</span></li>`).join('')}</ul>` : ''}
      ${lc && lc.newTags && lc.newTags.length ? `<h3>${esc(tx('ui.remote.newTags'))}</h3><ul>${lc.newTags.map((t) => `<li><code>${esc(t)}</code></li>`).join('')}</ul>` : ''}` : ''}`;
}

function rmMsg(html, kind) {
  const m = $('#rmMsg'); if (m) m.innerHTML = `<div class="issue ${kind || 'warn'}" role="alert">${html}</div>`;
}

async function remoteAdd() {
  const name = $('#rmName').value.trim(); const raw = $('#rmUrl').value.trim();

async function remoteEdit(name, url) {
  const v = await askText({ title: tx('ui.remote.editTitle', { name }), label: tx('ui.remote.urlLabel'), value: url, ok: tx('ui.file.save') });
  if (!v) { await paintGitRemote(); return; }
  const n = Rules.normalizeRepoUrl(v);
  if (n.error) { toast(n.error, 'error'); await openGit('remote'); return; }
  try { await api('PUT', '/api/git/remotes', { name, url: n.url }); toast(tx('ui.remote.urlUpdated')); } catch (e) { fail(e); }
  await openGit('remote');
}

function netErrHtml(r) {
  return esc(r.error) + (r.code === 'reddedildi' ? ' ' + cmdLine('git -C ' + (S.info.root || '') + ' pull --rebase') : '');
}

async function remotePush() {
  try {
    const r = await api('POST', '/api/git/push', {});

async function remoteFetch(manual) {

  } catch (e) { fail(e); }
}

// Yalnızca ileri sarma. Şeritten ve Uzak depo sekmesinden aynı eylem.
async function remotePull() {
  try {
    const r = await api('POST', '/api/git/pull', {});
    toast(r.adoptedTags.length ? tx('ui.remote.updatedWithTags', { count: r.adoptedTags.length }) : tx('ui.remote.updated'));
    S.remoteCheck = { ok: true, behind: 0, ahead: 0, newTags: [], newCommits: [], checkedAt: new Date().toISOString() };
    paintRemoteBadge(); paintRemoteBand();
    await afterWrite(); if (S.cur && S.cur.tab === 'hist') loadHistory();
    if ($('#rmBody')) await paintGitRemote();
  } catch (e) {
    const c = e.data && e.data.code;
    let html = esc(e.message);

    else if (c === 'ayristi') html = esc(tx('ui.remote.divergedMsg')) + cmdLine('git -C ' + (S.info.root || '') + ' pull --rebase');
    if ($('#rmMsg')) rmMsg(html);
    else { toast(e.message, 'error', 8000); if (c === 'kirliCalismaAgaci' || c === 'ayristi') openGit('remote'); }
  }
}

/* arka plan kontrolü, rozet ve şerit */
async function backgroundRemoteCheck() {
  if (!setupOk()) return;
  const gen = S.gen;
  try {
    const r = await api('POST', '/api/git/fetch', { background: true });
    if (gen !== S.gen) return;
    if (r.skipped || r.code === 'remoteYok' || r.code === 'mesgul') { S.remoteCheck = null; }
    else S.remoteCheck = r;
  } catch (e) { return; }
  paintRemoteBadge(); paintRemoteBand();
}

function paintRemoteBadge() {
  const b = $('#gitDown'); if (!b) return;
  const r = S.remoteCheck;
  if (!r || !setupOk()) { b.hidden = true; return; }
  if (r.ok === false) { b.hidden = false; b.className = 'badge warn'; b.textContent = '?'; b.title = tx('ui.remote.badgeFailed'); b.setAttribute('aria-label', b.title); return; }
  const n = r.behind || 0;
  b.hidden = !n; b.className = 'badge'; b.textContent = '↓' + n; b.title = tx('ui.remote.badgeBehind', { count: n }); b.setAttribute('aria-label', b.title);
}

function paintRemoteBand() {
  const old = $('#remoteBand'); if (old) old.remove();
  const r = S.remoteCheck;
  if (!r || r.ok === false || !setupOk()) return;
  const at = r.checkedAt || r.at || '';
  if (!(r.behind > 0 || (r.newTags && r.newTags.length))) return;
  if (ls.get(lsKey('dismissedCheck'), '') === at) return;
  const band = document.createElement('div');
  band.id = 'remoteBand'; band.className = 'warnband'; band.setAttribute('role', 'status');
  const parts = [];
  if (r.behind) parts.push(tx('ui.remote.bandCommits', { count: r.behind }));
  if (r.newTags && r.newTags.length) parts.push(r.newTags.slice(0, 3).join(', ') + (r.newTags.length > 3 ? ' …' : ''));
  band.innerHTML = `<div style="flex:1">${th('ui.remote.bandNew', { list: parts.join(', ') })} <button class="link" data-act="remote-details">${esc(tx('ui.remote.bandDetails'))}</button> <button class="btn sm" data-act="remote-pull" ${r.behind > 0 ? '' : 'disabled'}>${esc(tx('ui.remote.bandUpdate'))}</button></div><button class="btn sm ghost" data-act="remote-band-close" aria-label="${esc(tx('ui.remote.bandCloseLabel'))}">${esc(tx('ui.static.close'))}</button>`;
  $('#main').prepend(band);
}

/** Summary: Kurulum sorunu eylem kodu -> düğme etiketi sözlük anahtarı. */
const ACTION_LABEL_KEYS = { ayarlar: 'ui.common.openSettings', yeniMarketplace: 'ui.tree.newMarketplace', marketplaceSec: 'ui.setup.pickFromTree', gitBaslat: 'ui.common.initGit', ppConfigSil: 'ui.menu.deleteToTrash' };

/** Summary: Kurulum sorunu eylem kodunun düğme etiketi; bilinmeyen kod için boş döner. */
function actionLabel(code) {
  if (!Object.prototype.hasOwnProperty.call(ACTION_LABEL_KEYS, code)) return '';
  const k = ACTION_LABEL_KEYS[code];
  return tx(k);
}

function issueButton(i) {
  const label = esc(actionLabel(i.action));
  if (i.action === 'ayarlar') return '<button class="btn sm" data-act="settings">' + label + '</button>';
  if (i.action === 'yeniMarketplace') return '<button class="btn sm primary" data-act="new-mp">' + label + '</button>';
  if (i.action === 'marketplaceSec') return '<button class="btn sm primary" data-act="pick-mp">' + label + '</button>';
  if (i.action === 'gitBaslat') return `<button class="btn sm primary" data-act="mk-git-init" data-confirm data-name="${esc(S.info.activeMarketplace)}">${label}</button>`;
  if (i.action === 'ppConfigSil') return '<button class="btn sm" data-act="mk-ppconfig-sil">' + label + '</button>';
  return '';
}

function renderSetup() {
  const st = S.info.setup;
  $('#main').innerHTML = `<div class="start"><h1 id="setupTitle" tabindex="-1">${esc(tx('ui.setup.title'))}</h1>
    <p>${esc(tx('ui.setup.intro'))}</p>
    <ul class="setup-list">${st.issues.map((i) => `<li><span class="pill ${i.level === 'error' ? 'bad' : 'warn'}">${esc(i.level === 'error' ? tx('ui.setup.levelError') : tx('ui.setup.levelWarn'))}</span><span class="msg">${esc(i.message)}</span>${issueButton(i)}</li>`).join('')}</ul>

}

// Library kökü hazır ama etkin marketplace yok: ağaçtan seçilir.
function renderPick() {
  const codes = S.info.setup.issues.map((i) => i.code);
  if (!codes.includes('marketplaceSecilmedi') && !codes.includes('marketplaceYok')) { renderSetup(); return; }
  const none = codes.includes('marketplaceYok');

  $('#main').prepend(band);
}

// Üst bardaki etkin marketplace göstergesi (aria-live ile duyurulur).
function paintMkCur() {
  const b = $('#mkCur'); if (!b) return;
  const n = activeName();
  b.innerHTML = n ? th('ui.setup.mkCurrent', { name: n }) : esc(tx('ui.setup.mkNone'));

// Düğmeleri ve kenar çubuğunu kurulum durumuna göre ayarlar.
function applySetupUi() {
  const ok = setupOk(); const rok = rootOk();
  const why = tx('ui.setup.notComplete', { reason: firstError() });
  $$('[data-needs-setup]').forEach((b) => {
    if (b.dataset.title0 === undefined) b.dataset.title0 = b.getAttribute('title') || '';
    b.disabled = !ok;
    if (ok) { if (b.dataset.title0) b.title = b.dataset.title0; else b.removeAttribute('title'); } else b.title = why;
  });
  ['q', 'fDurum', 'fTur', 'fScope'].forEach((id) => { const el = $('#' + id); if (el) el.disabled = !rok; });
  if (!rok) {
    $('#list').setAttribute('role', 'list');
    $('#list').innerHTML = `<div class="empty">${esc(tx('ui.setup.listWaitingRoot'))}</div>`;
    $('#listTitle').textContent = tx('ui.static.library');
    $('#tagbar').innerHTML = '';
  }
  if (!ok) { $('#gitBadge').hidden = true; $('#mkBadge').hidden = true; }
  paintMkCur();
  paintToolbar();
}

// Kurulum bozulurken açık dosyadaki kaydedilmemiş metin ve commit mesajı bellekte saklanır (S.lostEdit); kurulum ekranındaki kart gösterir.
function keepLostEdit() {
  const c = S.cur; if (!c) return false;
  syncFromDom(); // Ham metin sekmesindeki yazılanlar da alınır
  if (!c.dirty && !String(c.commitMsg || '').trim()) return false;
  S.lostEdit = { mp: c.mp, path: c.path, raw: FM.stringify(c.parsed), commitMsg: c.commitMsg || '' };
  return true;
}

function onSetupLost(setup) {
  const kept = keepLostEdit();
  S.info.setup = setup; S.info.root = null; S.info.isRepo = false;
  S.cur = null; S.git = null; S.gen++;
  if (!setup.rootOk) { S.lib = null; S.results = null; }
  document.title = tx('ui.static.title');
  applySetupUi(); renderList(); renderMain();
  if (kept) toast(tx('ui.setup.lostToast'), 'error', 9000);
}

// Kurulum ekranındaki "kaydedilmemiş metin" kartı (HTML); korunan metin yoksa boş.
function lostEditHtml() {
  const l = S.lostEdit; if (!l) return '';

    <div class="lostbtns"><button type="button" class="btn primary" data-act="lost-copy">${esc(tx('ui.lostEdit.copyText'))}</button><button type="button" class="btn" data-act="lost-drop">${esc(tx('ui.lostEdit.drop'))}</button></div>
    <p class="hint">${esc(tx('ui.lostEdit.cardHint'))}</p>
  </section>`;
}

async function lostCopy() {
  const l = S.lostEdit; if (!l) return;
  const ok = await copyText(l.raw);
  toast(ok ? tx('ui.lostEdit.copied') : tx('ui.lostEdit.copyFailed'), ok ? 'ok' : 'error');
}

async function lostDrop() {
  if (!S.lostEdit) return;
  const a = await askChoice({ title: tx('ui.lostEdit.dropTitle'), text: tx('ui.lostEdit.dropText'), choices: [{ id: 'no', label: tx('ui.common.cancel') }, { id: 'yes', label: tx('ui.lostEdit.drop'), kind: 'danger' }] });

// Sunucudan gelen yeni /api/info ile etkin marketplace'e geçiş durumunu uygular.
function adoptInfo(info) {
  S.info = info; S.gen++;
  S.cur = null; S.git = null; S.mk = null; S.gitSel = null; S.gitMsg = ''; S.gitSelTouched = false;
  if (S.lib) {
    S.lib.active = info.activeMarketplace;
    S.lib.marketplaces.forEach((m) => { m.active = m.name === info.activeMarketplace; });
    const a = S.lib.marketplaces.find((m) => m.active && m.state === 'hazir');
    S.lib.libraryDir = a ? a.libraryDir : null;
  }
  document.title = tx('ui.static.title');
  applySetupUi();
}

// Yerinde marketplace geçişi (sayfa yeniden yüklenmez). Başarılıysa true.
async function activateMarketplace(name, o) {
  o = o || {};
  if (name === activeName()) return true;
  if (!(await confirmDiscard())) return false;
  let r;
  try { r = await api('POST', '/api/marketplaces/activate', { name }); } catch (e) { fail(e); return false; }
  adoptInfo(r.info);
  const m = mpByName(name);
  if (m && m.state === 'hazir') { S.mpOpen.add(name); saveMpOpen(); ensureDefaultExp(name); }
  S.remoteCheck = null; paintRemoteBadge();
  if (setupOk()) await loadGit();
  renderMkBadge(); renderFilters(); renderList(); renderMain();
  if (!o.quiet) toast(tx('ui.setup.activated', { name }));
  backgroundRemoteCheck();
  return true;
}

// Ağaçta, arama sonuçlarında ve "Son değişenler"de tıklanınca: gerekirse marketplace'i etkinleştirip dosyayı açar.
async function openIn(mp, path, o) {
  mp = mp || activeName();
  if (mp !== activeName() && !(await activateMarketplace(mp))) return;
  await openFile(path, o);
}

// Başka sekmede etkin marketplace değişmişse (409 etkinDegil) durumu sunucuyla eşler. Açık dosya korunur ama yazması engellenir.
let resyncing = false;
async function resyncActive() {
  if (resyncing) return; resyncing = true;
  try {
    const info = await get('/api/info');
    S.info = info; S.gen++; S.git = null; S.mk = null;
    if (S.lib) S.lib.marketplaces.forEach((m) => { m.active = m.name === info.activeMarketplace; });
    applySetupUi();
    await refreshAll();
    if (S.cur) renderMainKeepEdits();
  } catch (e) { /* sessiz */ } finally { resyncing = false; }
}

// Etkin marketplace aynı kalıp kurulum durumu değiştiğinde (git başlatma, dışarıdan düzeltme) yerinde yeniler.
async function reloadState() {
  const info = await get('/api/info');
  const changed = info.activeMarketplace !== activeName() || info.setup.ok !== setupOk() || info.setup.rootOk !== rootOk();
  if (changed) adoptInfo(info); else { S.info = info; applySetupUi(); }
  if (!rootOk()) { renderList(); renderMain(); return; }
  await Promise.all([loadLibrary(), loadFacets(), loadGit(), loadRecent()]);
  if (!S.mpOpen.size) initExpansion();
  ensureDefaultExp(activeName());
  renderFilters(); renderList();
  if (!S.cur) renderMain();
}

async function mkGitInit(name, ask) {
  if (!name) return;
  const fromSettings = !$('#overlay').hidden && !!modalState && modalState.kind === 'settings';
  if (ask) {
    const a = await askChoice({
      title: tx('ui.common.initGit'), text: tx('ui.setup.gitInitText', { name }),
      choices: [{ id: 'no', label: tx('ui.common.cancel') }, { id: 'yes', label: tx('ui.common.initGit'), kind: 'primary' }]
    });
    if (a !== 'yes') { if (fromSettings) openSettings('mk'); return; }
  }
  try {
    const r = await api('POST', '/api/marketplaces/git-init', { name });
    await reloadState();
    toast(tx('ui.setup.gitInited', { name }));
    if (fromSettings) openSettings('mk');
    return r;
  } catch (e) { fail(e); if (fromSettings) openSettings('mk'); }
}

const ROOT_BAD = ['kokAyarlanmadi', 'kokYok', 'kokAracReposunda', 'gitBulunamadi'];

function mkRowHtml(i, kind) {
  const tool = kind === 'ignored' && i.reasonCode === 'aracReposu';
  const pills = [];
  if (kind === 'item') {
    if (i.active) pills.push(`<span class="pill ok">${esc(tx('ui.tree.pillActive'))}</span>`);
    if (!i.valid) pills.push(`<span class="pill bad">${esc(tx('ui.tree.pillInvalid', { reason: i.reason || '' }))}</span>`);
    if (!i.hasManifest) pills.push(`<span class="pill warn">${esc(tx('ui.settings.pillNoManifest'))}</span>`);
  } else pills.push(`<span class="pill ${tool ? '' : 'warn'}">${esc(i.reason)}</span>`);
  const btns = [];
  if (!tool && !i.active) btns.push(`<button type="button" class="btn sm" data-act="mk-activate" data-name="${esc(i.name)}">${esc(tx('ui.menu.activate'))}</button>`);
  // Geçerli olmayan ama .git içeren klasörde sunucu git başlatmayı reddeder; yalnızca git deposu olmayanlarda göster.
  if (kind === 'ignored' && !tool) btns.push(`<button type="button" class="btn sm" data-act="mk-git-init" data-confirm data-name="${esc(i.name)}">${esc(tx('ui.common.initGit'))}</button>`);
  return `<div class="mkrow ${tool ? 'dim' : ''}"><div><b>${esc(i.name)}</b> ${pills.join(' ')}<div class="hint mono">${esc(i.path)}</div></div><div></div><div class="mkbtns">${btns.join('')}</div></div>`;
}

    </form>
    <h3>${esc(tx('ui.settings.language'))}</h3>
    <label>${esc(tx('ui.settings.language'))}<select id="setLanguage">${langOpts}</select></label>
    <h3>${esc(tx('ui.git.tabRemote'))}</h3>
    <label>${esc(tx('ui.settings.remoteCheck'))}<select id="setRemoteCheck"><option value="acilista" ${s.remoteCheck !== 'elle' ? 'selected' : ''}>${esc(tx('ui.settings.remoteCheckStartup'))}</option><option value="elle" ${s.remoteCheck === 'elle' ? 'selected' : ''}>${esc(tx('ui.settings.remoteCheckManual'))}</option></select></label>
    <h3 id="setMkTitle" tabindex="-1">${esc(tx('ui.settings.marketplaces'))}</h3>
    ${rows ? `<div class="mklist">${rows}</div>` : `<p class="hint">${esc(rootBad ? tx('ui.settings.needRoot') : tx('ui.settings.noMarketplaces'))}</p>`}

  </div>`;

function showFieldErr(id, msg) {
  const el = $('#' + id); if (!el) return;
  el.textContent = msg || ''; el.hidden = !msg;
}

function reloadWith(msg) {
  try { if (msg) sessionStorage.setItem('pp.flash', msg); } catch (e) { /* özel pencere */ }
  location.reload();
}

/** Summary: Dil ayarını kaydedip sayfayı yeni dille yeniden yükler; kaydedilmemiş değişiklik varsa önce sorulur, reopenSettings vazgeçme/hatada Ayarlar'ı yeniden açar. */
async function setLanguage(setting, { reopenSettings = true } = {}) {
  if (!(await confirmDiscard())) { if (reopenSettings) openSettings(); return false; }
  try { await api('PUT', '/api/settings', { language: setting }); } catch (e) { fail(e); if (reopenSettings) openSettings(); return false; }
  const lang = resolveLang(setting);
  writeLangCache(lang);
  reloadWith(tx('ui.settings.languageChanged', {}, { lang }));
  return true;
}

/** Summary: Üst çubuk TR/EN kısayolu; etkin dile tıklamak bir şey yapmaz, vazgeçme/hata Ayarlar'ı açmaz. */
async function quickLanguage(lang) {
  if (!I18n.LANGUAGES.includes(lang) || lang === I18n.current()) return false;
  return setLanguage(lang, { reopenSettings: false });
}

// Library kökü değişince (bilinçli ve nadir) sayfa yeniden yüklenir.
async function saveRoot(create, onVal) {
  const val = onVal != null ? onVal : $('#setRoot').value;
  showFieldErr('setRootErr', '');
  const before = { root: S.info.libraryRoot, active: S.info.activeMarketplace, ok: setupOk() };
  try {
    const r = await api('PUT', '/api/settings', { libraryRoot: val, create: !!create });
    toast(tx('ui.settings.rootSaved'));
    S.info = await get('/api/info');
    const changed = before.root !== S.info.libraryRoot || before.active !== S.info.activeMarketplace || before.ok !== setupOk();
    if (changed) reloadWith(tx('ui.settings.rootSaved')); else openSettings();
    return r;
  } catch (e) {
    if (create) { showFieldErr('setRootErr', e.message); const i = $('#setRoot'); if (i) i.focus(); return; }
    if (e.status === 404 && e.data && e.data.notFound) {
      const a = await askChoice({
        title: tx('ui.settings.folderMissingTitle'), text: tx('ui.settings.folderMissingText', { path: val.trim() }),
        choices: [{ id: 'no', label: tx('ui.common.cancel') }, { id: 'yes', label: tx('ui.common.create'), kind: 'primary' }]
      });
      if (a === 'yes') return saveRoot(true, val);
      openSettings();
      return;
    }
    showFieldErr('setRootErr', e.message); $('#setRoot').focus();
  }
}

async function openSettings(section) {
  let s; let m;
  try { [s, m] = await Promise.all([get('/api/settings'), get('/api/marketplaces')]); } catch (e) { fail(e); return; }
  openModal({
    title: tx('ui.static.settings'), kind: 'settings', wide: true, html: settingsHtml(s, m), noFocus: true,
    onClose: () => { const b = $('.actions [data-act="settings"]'); if (b) b.focus(); },
    onMount: (b) => { $('#setRootForm', b).addEventListener('submit', (e) => { e.preventDefault(); saveRoot(false); }); }
  });
  const target = section === 'mk' ? $('#setMkTitle') : $('#setRoot');
  if (target) { if (section === 'mk') target.scrollIntoView({ block: 'nearest' }); target.focus(); }
}

// Ağaç satırına tıklama / Enter / Space. Marketplace ve plugin'e tıklamak o marketplace'i etkinleştirir.
async function nodeClick(it) {
  S.sel = { mp: it.mp, key: it.key }; S.focusKey = it.key;
  switch (it.kind) {
    case 'mp': {
      if (!it.node.active) {
        if (!(await activateMarketplace(it.mp))) return;
        if (it.node.state === 'hazir') { S.mpOpen.add(it.mp); saveMpOpen(); }
      } else if (it.expandable) toggleItem(it);
      break;
    }
    case 'plugin':
      if (!(await activateMarketplace(it.mp, { quiet: true }))) return;
      toggleItem(it); ls.set(lsKey('sonPlugin', it.mp), it.node.name);
      break;
    case 'file': case 'tfile':
      await openIn(it.mp, it.path);
      return;
    case 'gitlessItem': break;
    default: toggleItem(it);
  }
  renderList();
}

function menuKey(ev, menu) {
  const items = $$('.mi', menu); const n = items.length; if (!n) return;
  const i = items.indexOf(document.activeElement);
  if (ev.key === 'ArrowDown') { ev.preventDefault(); items[(i + 1) % n].focus(); }
  else if (ev.key === 'ArrowUp') { ev.preventDefault(); items[(i - 1 + n) % n].focus(); }
  else if (ev.key === 'Home') { ev.preventDefault(); items[0].focus(); }
  else if (ev.key === 'End') { ev.preventDefault(); items[n - 1].focus(); }
  else if (ev.key === 'Tab') { ev.preventDefault(); closeMenu(true); }
}

// Ağaç ve arama sonuçları için klavye gezintisi (WAI-ARIA tree kalıbı). İşlendiyse true.
function listKey(ev, t) {
  if (S.results) {
    const rs = $$('#list .res'); const i = rs.indexOf(t.closest('.res'));
    if (i < 0) return false;
    const go = (x) => { if (x) { ev.preventDefault(); x.focus(); } };
    if (ev.key === 'ArrowDown') go(rs[i + 1]); else if (ev.key === 'ArrowUp') go(rs[i - 1]);
    else if (ev.key === 'Home') go(rs[0]); else if (ev.key === 'End') go(rs[rs.length - 1]);
    else return false;
    return true;
  }
  const row = t.closest('[data-key]'); if (!row) return false;
  const it = S.modelMap.get(row.dataset.key); if (!it) return false;
  const vis = S.model.filter((x) => x.kind !== 'note');
  const idx = vis.findIndex((x) => x.key === it.key);
  const go = (x) => {
    if (!x) return;
    S.focusKey = x.key;
    $$('#list [data-key]').forEach((r) => { r.tabIndex = r.dataset.key === x.key ? 0 : -1; });
    const el = rowEl(x.key); if (el) { el.focus(); el.scrollIntoView({ block: 'nearest' }); }
  };
  switch (ev.key) {
    case 'ArrowDown': ev.preventDefault(); go(vis[idx + 1]); return true;
    case 'ArrowUp': ev.preventDefault(); go(vis[idx - 1]); return true;
    case 'Home': ev.preventDefault(); go(vis[0]); return true;
    case 'End': ev.preventDefault(); go(vis[vis.length - 1]); return true;
    case 'ArrowRight':
      ev.preventDefault();
      if (it.expandable && !it.expanded) { setExpanded(it, true); renderList(); }
      else if (it.expandable && it.expanded) go(vis.find((x) => x.parentKey === it.key));
      return true;
    case 'ArrowLeft':
      ev.preventDefault();
      if (it.expandable && it.expanded) { setExpanded(it, false); renderList(); }
      else if (it.parentKey) go(S.modelMap.get(it.parentKey));
      return true;
    case 'F2':
      ev.preventDefault();
      if (it.kind === 'plugin') (async () => { if (await activateMarketplace(it.mp, { quiet: true })) renamePlugin(it.node.name); })();
      else if (it.kind === 'file' && /\.(md|markdown)$/i.test(it.path)) (async () => { if (await activateMarketplace(it.mp, { quiet: true })) renameFile(it.path); })();
      return true;
    case 'ContextMenu': case 'F10':
      if (ev.key === 'F10' && !ev.shiftKey) return false;
      ev.preventDefault();
      { const r = row.getBoundingClientRect(); openMenuFor(it, r.left + 28, r.bottom - 4); }
      return true;
    default: return false;
  }
}

document.addEventListener('click', async (ev) => {

      ev.preventDefault();
      const f = new FormData($('#mkForm'));
      const verBox = $('#mkVerErr'); const verIn = $('#mkForm [name="version"]');
      const showVerErr = (msg) => { verBox.textContent = msg; verBox.hidden = false; verIn.setAttribute('aria-invalid', 'true'); verIn.focus(); };
      verBox.hidden = true; verBox.textContent = ''; verIn.removeAttribute('aria-invalid');
      const verErr = Rules.checkVersion(f.get('version'));
      if (verErr) { showVerErr(verErr); break; }
      const cfgBody = { name: f.get('name'), owner: f.get('owner'), version: f.get('version'), description: f.get('description') };
      try { const r = await api('POST', '/api/marketplace/init', { config: cfgBody }); S.info = await get('/api/info'); toast(tx('ui.mp.filesWritten', { packages: r.packages.join(', ') })); await mkReload(); }
      catch (e) { if (e.status === 400 && e.data && e.data.field === 'version') showVerErr(e.message); else fail(e); }
      break;
    }
    default: break;
  }
});

document.addEventListener('contextmenu', (ev) => {
  const row = ev.target.closest('#list [data-key]');
  if (!row) return;
  const it = S.modelMap.get(row.dataset.key);
  if (!it) return;
  ev.preventDefault();
  S.focusKey = it.key;
  openMenuFor(it, ev.clientX, ev.clientY);
});

document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.id === 'q') { S.f.q = t.value; runSearch(); return; }
  if (S.pk && t.closest && t.closest('.pkrel')) { pkValidate(); return; }
  if (!S.cur) return;
  if (t.id === 'commitMsg') { S.cur.commitMsg = t.value; updateDirty(); return; }
  if (t.dataset && t.dataset.f) { setField(t.dataset.f, t.value); return; }
  if (t.id === 'fBody') {
    S.cur.parsed.body = S.cur.lead + t.value;
    autosize(t); updateDirty();
    $('#bodyInfo').innerHTML = bodyInfoText();
  } else if (t.id === 'fRaw') { autosize(t); updateDirty(); }
});

document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.id === 'fDurum') { S.f.durum = t.value; runSearch(); }
  else if (t.id === 'fTur') { S.f.tur = t.value; runSearch(); }
  else if (t.id === 'setRemoteCheck') { api('PUT', '/api/settings', { remoteCheck: t.value }).then(() => toast(tx('ui.settings.saved'))).catch(fail); }
  else if (t.id === 'setLanguage') { setLanguage(t.value); }
  else if (S.pk && t.closest && t.closest('.pkrel')) pkValidate();
  else if (t.id === 'verA' || t.id === 'verB') verSelChange();
  else if (t.id === 'fScope') { S.f.scope = t.checked ? 'all' : 'library'; runSearch(); }
  else if (t.dataset && t.dataset.gsel !== undefined) { S.gitSelTouched = true; t.checked ? S.gitSel.add(t.dataset.gsel) : S.gitSel.delete(t.dataset.gsel); }
  else if (t.dataset && t.dataset.f && S.cur) setField(t.dataset.f, t.value);
});

document.addEventListener('toggle', (ev) => { if (ev.target.id === 'pubBox') ls.set('pp.pubOpen', ev.target.open); }, true);

document.addEventListener('keydown', (ev) => {
  const t = ev.target;
  if (trapTab(ev)) return;
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); save(); return; }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); document.body.classList.add('side-open'); $('#q').focus(); $('#q').select(); return; }
  if (ev.key === 'Enter' && t.id === 'commitMsg' && S.cur) { ev.preventDefault(); save(); return; }
  if (ev.key === 'Escape') { if (!$('#overlay').hidden) closeModal(); closeMenu(true); if (t.id === 'q') t.blur(); return; }
  const menu = t.closest && t.closest('.menu');
  if (menu) { menuKey(ev, menu); return; }
  if (t.closest && t.closest('#list') && listKey(ev, t)) return;
  if (t.classList && t.classList.contains('chip-in') && S.cur) {
    const key = t.dataset.chipIn;
    if (ev.key === 'Enter' || ev.key === ',') { ev.preventDefault(); if (t.value.trim()) addChips(key, t.value, true); }
    else if (ev.key === 'Backspace' && !t.value) { const l = toList(FM.meta(S.cur.parsed)[key]); if (l.length) { removeChip(key, l[l.length - 1]); const i = $('[data-chip-in="' + key + '"]'); if (i) i.focus(); } }
    return;
  }
  if ((ev.key === 'Enter' || ev.key === ' ') && t.matches && t.matches('#list [role="treeitem"], #list .res, .recent .res, .commits li[role="button"]')) { ev.preventDefault(); t.click(); }
  if (ev.key === 'Tab' && t.id === 'fBody') { /* Tab ile odak ilerlesin; girinti için boşluk kullan */ }
});

document.addEventListener('focusout', (ev) => {
  const t = ev.target;
  if (S.cur && t.classList && t.classList.contains('chip-in') && t.value.trim()) addChips(t.dataset.chipIn, t.value, false);
});

$('#overlay').addEventListener('mousedown', (ev) => { if (ev.target.id === 'overlay') closeModal(); });

window.addEventListener('beforeunload', (ev) => { if (isDirty()) { ev.preventDefault(); ev.returnValue = ''; } });

window.addEventListener('focus', async () => {
  if (!S.info) return;
  if (!setupOk()) {
    // Kullanıcı sorunu dışarıdan gidermiş olabilir (örn. klasörü geri koymuş): sayfa yenilenmeden toparlanır.
    try {
      const i = await get('/api/info');
      if (i.setup.ok || i.setup.rootOk !== rootOk() || i.activeMarketplace !== activeName()) await reloadState();
      else if (rootOk()) await refreshAll();
    } catch (e) { /* sessiz */ }
    return;
  }
  await refreshAll();
  const c = S.cur;
  if (c && c.mp !== activeName()) return;
  if (c && !c.dirty) {
    try {
      const r = await get('/api/file?' + qs({ path: c.path }));
      if (r.mtime !== c.mtime) { await openFile(c.path, { reload: true, tab: c.tab }); toast(tx('ui.events.reloadedFromDisk')); }
    } catch (e) { /* silinmiş olabilir */ }
  } else if (c && c.dirty) {
    try { const r = await get('/api/file?' + qs({ path: c.path })); if (r.mtime !== c.mtime && !c.external) { c.external = true; renderMainKeepEdits(); } } catch (e) { /* sessiz */ }
  }
});

function renderMainKeepEdits() { syncFromDom(); renderMain(); updateDirty(); }

/* ------------------------------------------------------------------ başlangıç */
async function init() {
  try { S.info = await get('/api/info'); } catch (e) { $('#main').innerHTML = `<div class="start"><h1>${esc(tx('ui.init.serverDownTitle'))}</h1><p>${th('ui.init.serverDownText')}</p></div>`; return; }
  S.info = await syncLanguage(S.info);
  // Eski (marketplace'siz) anahtarlar bir kez silinir.
  try { localStorage.removeItem('pp.last'); localStorage.removeItem('pp.expanded'); } catch (e) { /* özel pencere */ }
  try { const f = sessionStorage.getItem('pp.flash'); if (f) { sessionStorage.removeItem('pp.flash'); toast(f, 'ok', 5000); } } catch (e) { /* özel pencere */ }
  applySetupUi();
  if (!rootOk()) { renderMain(); return; }
  try { await Promise.all([loadLibrary(), loadFacets(), loadGit(), loadRecent()]); } catch (e) { if (e.setupRequired) return; throw e; }
  if (!S.info.gitAvailable) toast(tx('ui.init.gitMissing'), 'error', 8000);
  initExpansion();
  renderFilters(); renderList();
  const last = setupOk() ? ls.get(lsKey('last'), null) : null;
  if (last) await openFile(last, { quiet: true }); else renderMain();
  if (!S.cur) renderMain();
  backgroundRemoteCheck();
}
init();
})();
</script>
</body>
</html>
