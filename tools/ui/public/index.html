/* ------------------------------------------------------------------- geçmiş */
// Durum: c.hist = { mode: 'ver'|'commit', ver, commit } ya da { loading | stale | noRepo | error }.
async function loadCommitData(c, h) {
  const gen = S.gen;
  const [log, wd] = await Promise.all([get('/api/git/log?' + qs({ path: c.path })), get('/api/git/diff?' + qs({ path: c.path, working: 1 }))]);
  if (gen !== S.gen || S.cur !== c || c.hist !== h) return false;
  h.commit = { commits: log.commits, working: wd, sel: (wd.diff || wd.untracked) ? 'working' : (log.commits[0] ? log.commits[0].hash : null), diffs: {} };
  return true;
}

// Varsayılan seçim: en yeni iki sürüm; tek sürüm varsa o sürüm ile son commit; `pre` verilmişse o sürüm ve bir öncesi.
function newVerState(d, pre) {
  const vs = d.versions;
  const v = { data: d, a: null, b: null, sel: null, view: null, cmp: null, cache: {} };
  if (!vs.length) return v;
  const i = pre ? vs.findIndex((x) => x.tag === pre) : -1;
  if (i >= 0) { v.sel = vs[i].tag; v.b = vs[i].tag; v.a = vs[i + 1] ? vs[i + 1].tag : vs[i].tag; }
  else if (vs.length >= 2) { v.sel = vs[0].tag; v.b = vs[0].tag; v.a = vs[1].tag; }
  else { v.sel = vs[0].tag; v.a = vs[0].tag; v.b = 'HEAD'; }
  return v;
}

async function loadHistory() {
  const c = S.cur; if (!c) return;
  const gen = S.gen;
  const pre = S.histPreselect; S.histPreselect = null;
  c.hist = { loading: true }; paintHist();
  if (c.mp !== activeName()) { c.hist = { stale: true }; paintHist(); return; }
  const live = () => gen === S.gen && S.cur === c;
  try {
    const st = S.git || await loadGit();
    if (!live()) return;
    if (!st.isRepo) { c.hist = { noRepo: true }; paintHist(); return; }
    const h = { mode: 'commit', ver: null, commit: null };
    if (c.isPrompt) {
      const d = await get('/api/history/versions?' + qs({ path: c.path }));
      if (!live()) return;
      if (d.ad) {
        h.ver = newVerState(d, pre);
        h.mode = pre ? 'ver' : (S.histMode || (d.versions.length ? 'ver' : 'commit'));
      }
    }
    c.hist = h;
    if (h.mode === 'commit' && !(await loadCommitData(c, h))) return;
    paintHist();
    if (h.mode === 'ver') loadCompare();
  } catch (e) { if (S.cur === c) { c.hist = { error: e.message }; paintHist(); } }
}

async function setHistMode(mode) {
  const c = S.cur; const h = c && c.hist;
  if (!h || !h.ver || h.mode === mode) return;
  S.histMode = mode; h.mode = mode;
  try {
    if (mode === 'commit' && !h.commit) { paintHist(); if (!(await loadCommitData(c, h))) return; }
  } catch (e) { if (S.cur === c) { c.hist = { error: e.message }; paintHist(); } return; }
  paintHist();
  if (mode === 'ver') loadCompare();
}

function diffHtml(d) {
  return d.split('\n').map((l) => {
    let k = '';
    if (/^(\+\+\+|---|diff |index |new file|deleted file)/.test(l)) k = 'meta';
    else if (l.startsWith('@@')) k = 'hunk';
    else if (l[0] === '+') k = 'add';
    else if (l[0] === '-') k = 'del';
    return `<span class="dl ${k}">${esc(l) || ' '}</span>`;
  }).join('');
}

const FIELD_LABEL = { baslik: 'Başlık', etiketler: 'Etiketler', projeler: 'Projeler', durum: 'Durum', versiyon: 'Versiyon', olusturma: 'Oluşturma', tur: 'Tür', paket: 'Paket', komut_adi: 'Ad', aciklama: 'Açıklama', arguman_ipucu: 'Argüman ipucu', izinli_araclar: 'İzinli araçlar', model: 'Model' };

function verTimelineHtml(v) {
  return v.data.versions.map((x, i) => `<li><button type="button" class="tl" data-act="ver-pick" data-tag="${esc(x.tag)}" aria-current="${x.tag === v.sel}"><div class="s"><b>v${esc(x.version)}</b>${i === 0 ? ' <span class="pill ok">Son sürüm</span>' : ''}${x.renamed ? ` <span class="pill">Eski ad: ${esc(base(x.pathAtTag))}</span>` : ''}${x.annotated ? '' : ' <span class="pill">Notsuz</span>'}</div><div class="hint">${esc(fmtDate(x.date))}</div>${x.subject ? `<div>${esc(x.subject)}</div>` : ''}</button></li>`).join('');
}

function verCardHtml(v, x) {
  const i = v.data.versions.indexOf(x);
  const prev = v.data.versions[i + 1];
  return `<div class="vcard"><div><code>${esc(x.tag)}</code> <span class="hint">${esc(fmtDate(x.date))}</span></div>
    <div class="hint">${x.tagger ? 'Sürümü oluşturan: ' + esc(x.tagger) + ', ' : ''}commit ${esc(x.short)}</div>
    ${x.note ? `<div class="note">${esc(x.note)}</div>` : '<div class="hint">Bu sürümde not yok.</div>'}
    <div class="btns"><button class="btn sm" data-act="ver-view" data-tag="${esc(x.tag)}">Görüntüle</button><button class="btn sm" data-act="ver-load" data-tag="${esc(x.tag)}">Bu sürümü editöre al</button>${prev ? `<button class="btn sm" data-act="ver-prev" data-tag="${esc(x.tag)}">Bir öncekiyle karşılaştır</button>` : ''}</div></div>`;
}

function verViewHtml(v) {
  const w = v.view;
  if (w.loading) return '<p class="hint">Sürüm yükleniyor…</p>';
  if (w.error) return `<p class="issue error">${esc(w.error)}</p><p><button class="btn sm" data-act="ver-view-close">Kapat</button></p>`;
  return `<div class="diffhead"><span><b>v${esc(w.version)}</b> <span class="hint">(${esc(fmtDate(w.date))}), salt okunur</span></span><button class="btn sm" data-act="ver-load" data-tag="${esc(w.tag)}">Bu sürümü editöre al</button><button class="btn sm" data-act="ver-view-close">Kapat</button></div>
    <pre class="diff" aria-label="Sürümün içeriği">${w.raw.replace(/\r\n/g, '\n').split('\n').map((l) => `<span class="dl">${esc(l) || ' '}</span>`).join('')}</pre>`;
}

function fieldCellsHtml(f) {
  if (f.list) {
    const a = f.from.map((x) => (f.removed.includes(x) ? `<del class="chip"><span class="sr">silinen: </span>−${esc(x)}</del>` : `<span class="chip">${esc(x)}</span>`)).join('');
    const b = f.to.map((x) => (f.added.includes(x) ? `<ins class="chip"><span class="sr">eklenen: </span>+${esc(x)}</ins>` : `<span class="chip">${esc(x)}</span>`)).join('');
    return [a || '—', (b || '—') + (f.kind === 'sira' ? '<div class="hint">Yalnızca sıra değişti</div>' : '')];
  }
  return [f.from == null ? '—' : `<del>${esc(f.from)}</del>`, f.to == null ? '—' : `<ins>${esc(f.to)}</ins>`];
}

function wordDiffHtml(hunks) {
  const tok = (t) => (t.t === '=' ? esc(t.s) : t.t === '-' ? `<del class="wd"><span class="sr">silinen: </span>${esc(t.s)}</del>` : `<ins class="wd"><span class="sr">eklenen: </span>${esc(t.s)}</ins>`);
  return hunks.map((h) => `<span class="dl hunk">@@ satır ${h.newStart} @@</span>` + h.lines.map((ln) => `<span class="dl">${ln.map(tok).join('') || ' '}</span>`).join('')).join('');
}

function verCompareHtml(v) {
  if (!v.a || !v.b) return '';
  if (v.a === v.b) return '<p class="hint">Karşılaştırılacak önceki sürüm yok (ilk sürüm) ya da iki seçim aynı. Farklı iki sürüm seç.</p>';
  const s = v.cmp;
  if (!s || s.loading) return '<p class="hint">Fark yükleniyor…</p>';
  if (s.error) return `<p class="issue ${s.code === 'ayniSurum' ? 'info' : 'error'}">${esc(s.code === 'ayniSurum' ? 'Karşılaştırılacak fark yok: seçilen iki sürüm aynı içeriğe işaret ediyor.' : s.error)}</p>`;
  const c = s.data;
  const la = verLabel(c.a.ref, c.a.version); const lb = verLabel(c.b.ref, c.b.version);
  let h = '';
  if (v.data.versions.length === 1 && v.b === 'HEAD') h += '<p class="hint">Karşılaştırmak için ikinci bir sürüm yok; tek sürüm son commit ile karşılaştırılıyor.</p>';
  if (c.renamed) h += `<p class="hint">Dosya bu aralıkta yeniden adlandırıldı: ${esc(c.a.pathAtRef)} → ${esc(c.b.pathAtRef)}</p>`;
  if (c.fmBroken.a || c.fmBroken.b) {
    if (c.fmBroken.a) h += `<p class="issue warn">${esc(la)} sürümünde frontmatter kapanmamış; alanlar karşılaştırılamadı.</p>`;
    if (c.fmBroken.b) h += `<p class="issue warn">${esc(lb)} sürümünde frontmatter kapanmamış; alanlar karşılaştırılamadı.</p>`;
  } else if (!c.fields.length) h += '<p class="hint">Frontmatter alanlarında değişiklik yok.</p>';
  else {
    h += `<table class="fdiff"><caption>Frontmatter alanları</caption><thead><tr><th scope="col">Alan</th><th scope="col">${esc(la)}</th><th scope="col">${esc(lb)}</th></tr></thead><tbody>${c.fields.map((f) => { const [x, y] = fieldCellsHtml(f); return `<tr><th scope="row">${FIELD_LABEL[f.key] ? esc(FIELD_LABEL[f.key]) : `<code>${esc(f.key)}</code>`}</th><td>${x}</td><td>${y}</td></tr>`; }).join('')}</tbody></table>`;
  }
  h += c.body.same ? '<p class="hint">Gövdede değişiklik yok.</p>' : `<pre class="diff wdiff" aria-label="Gövde farkı">${wordDiffHtml(c.body.hunks)}</pre>`;
  if (c.body.truncated) h += '<p class="hint">Fark çok büyük, kısaltıldı.</p>';
  if (c.commits.length) {
    h += `<details><summary>Bu aralıktaki commit'ler (${c.commits.length}${c.commitsTruncated ? '+' : ''})</summary><ul class="commits" style="max-height:30vh">${c.commits.map((k) => `<li role="button" tabindex="0" data-act="ver-commit" data-hash="${esc(k.hash)}" data-path="${esc(k.path || '')}"><div class="s">${esc(k.subject)}</div><div class="hint">${esc(fmtDate(k.date))}, ${esc(k.short)}</div></li>`).join('')}</ul><pre class="diff" id="verCDiff" hidden></pre></details>`;
  }
  return h + '<p class="hint">Kaydedilmemiş ve commit edilmemiş değişiklikler karşılaştırmaya dahil değildir.</p>';
}

function verMainHtml(v) {
  if (v.view) return verViewHtml(v);
  const x = v.sel && verByTag(v, v.sel);
  return (x ? verCardHtml(v, x) : '') + `<div id="verCmp" tabindex="-1" aria-label="Sürüm karşılaştırması">${verCompareHtml(v)}</div>`;
}

function paintVer() {
  const c = S.cur; if (!c || c.tab !== 'hist') return;
  const h = c.hist; if (!h || h.mode !== 'ver' || !h.ver) return;
  const v = h.ver; const tl = $('#verTL'); const m = $('#verMain'); if (!tl || !m) return;
  if (!tl.firstChild) tl.innerHTML = verTimelineHtml(v);
  else $$('.tl', tl).forEach((b) => b.setAttribute('aria-current', String(b.dataset.tag === v.sel)));
  m.innerHTML = verMainHtml(v);
  const a = $('#verA'); const b = $('#verB');
  if (a && v.a) a.value = v.a;
  if (b && v.b) b.value = v.b;
}

async function loadCompare() {
  const c = S.cur; const h = c && c.hist; if (!h || !h.ver) return;
  const v = h.ver; const gen = S.gen;
  if (!v.a || !v.b || v.a === v.b) { v.cmp = null; paintVer(); return; }
  const key = v.a + '|' + v.b;
  if (v.cache[key]) { v.cmp = v.cache[key]; paintVer(); return; }
  v.cmp = { loading: true }; paintVer();
  let res;
  try { res = { data: await get('/api/history/compare?' + qs({ path: c.path, a: v.a, b: v.b })) }; } catch (e) { res = { error: e.message, code: e.data && e.data.code }; }
  if (gen !== S.gen || S.cur !== c || c.hist !== h) return;
  if (!res.error || res.code === 'ayniSurum') v.cache[key] = res;
  if (v.a + '|' + v.b === key) { v.cmp = res; paintVer(); }
}

function verPick(tag) {
  const h = S.cur && S.cur.hist; const v = h && h.ver; if (!v) return;
  const vs = v.data.versions; const i = vs.findIndex((x) => x.tag === tag); if (i < 0) return;
  v.sel = tag; v.view = null; v.b = tag; v.a = vs[i + 1] ? vs[i + 1].tag : tag;
  paintVer(); loadCompare();
}

function verSelChange() {
  const h = S.cur && S.cur.hist; const v = h && h.ver; if (!v) return;
  const vs = v.data.versions;
  const rank = (t) => (t === 'HEAD' ? -1 : vs.findIndex((x) => x.tag === t));
  let a = $('#verA').value; let b = $('#verB').value;
  if (rank(a) < rank(b)) [a, b] = [b, a]; // eski olan A, yeni olan B (HEAD her zaman en yeni)
  v.a = a; v.b = b; v.view = null;
  if (b !== 'HEAD') v.sel = b;
  paintVer(); loadCompare();
}

async function verView(tag) {
  const c = S.cur; const h = c && c.hist; const v = h && h.ver; if (!v) return;
  v.view = { tag, loading: true }; paintVer();
  let w;
  try { const r = await get('/api/history/show?' + qs({ path: c.path, tag })); w = { tag, version: r.version, date: r.date, raw: r.raw }; } catch (e) { w = { tag, error: e.message }; }
  if (S.cur !== c || c.hist !== h || !v.view || v.view.tag !== tag) return;
  v.view = w; paintVer();
  const b = $('#verMain button'); if (b) b.focus();
}

async function loadVersionIntoEditor(tag) {
  const c = S.cur; const h = c && c.hist; const v = h && h.ver; if (!v) return;
  if (staleGuard()) return;
  let r = v.view && v.view.tag === tag && v.view.raw != null ? v.view : null;
  if (!r) { try { r = await get('/api/history/show?' + qs({ path: c.path, tag })); } catch (e) { fail(e); return; } }
  if (S.cur !== c) return;
  await loadRawIntoEditor(r.raw, { what: 'v' + r.version + ' sürümünün', msg: 'v' + r.version + ' sürümüne geri dönüldü' });
}

async function paintHist() {
  const c = S.cur; if (!c || c.tab !== 'hist') return;
  const pane = $('#pane'); if (!pane) return;
  pane.innerHTML = histPaneHtml();
  const h = c.hist; if (!h) return;
  if (h.mode === 'ver' && h.ver) { paintVer(); return; }
  const cm = h.commit; if (!cm || !cm.sel || !$('#diffBox')) return;
  const head = $('#diffHead'); const box = $('#diffBox');
  if (cm.sel === 'working') {
    if (cm.working.untracked) { box.textContent = 'Bu dosya henüz git\'e eklenmedi. Git panelinden commit edebilirsin.'; head.innerHTML = ''; return; }
    box.innerHTML = diffHtml(cm.working.diff); head.innerHTML = '<span class="hint">Son commit ile şu anki dosya arasındaki fark</span>';
    return;
  }
  const k = cm.commits.find((x) => x.hash === cm.sel); if (!k) return;
  head.innerHTML = `<span><b>${esc(k.subject)}</b> <span class="hint">${esc(fmtDate(k.date))}, ${esc(k.author)}</span></span><button class="btn sm" data-act="hist-load" data-hash="${k.hash}">Bu sürümü editöre al</button>`;
  try {
    if (!cm.diffs[k.hash]) cm.diffs[k.hash] = (await get('/api/git/diff?' + qs({ hash: k.hash, path: k.path || c.path }))).diff;
    if (c.hist === h && cm.sel === k.hash) box.innerHTML = diffHtml(cm.diffs[k.hash] || '(fark yok)');
  } catch (e) { box.textContent = e.message; }
}

async function loadOldVersion(hash) {
  const c = S.cur; const k = c && c.hist && c.hist.commit && c.hist.commit.commits.find((x) => x.hash === hash); if (!k) return;
  if (staleGuard()) return;
  let r;
  try { r = await get('/api/git/show?' + qs({ hash, path: k.path || c.path })); } catch (e) { fail(e); return; }
  if (S.cur !== c) return;
  await loadRawIntoEditor(r.raw, { what: k.short + ' commit\'inin', msg: k.short + ' commit\'ine geri dönüldü' });
}

// Eski bir içeriği yalnızca editöre koyar (diske yazmaz). Kaydedilmemiş değişiklik varsa önce sorar.
// c.savedRaw ve c.mtime değişmez: dirty olur, 409 çakışma koruması sürer. `versiyon` geriye gitmez.
async function loadRawIntoEditor(raw, { what, msg }) {
  const c = S.cur; if (!c) return false;
  if (staleGuard()) return false;
  if (isDirty()) {
    const a = await askChoice({
      title: 'Kaydedilmemiş değişiklikler var',
      text: '"' + base(c.path) + '" dosyasındaki kaydedilmemiş değişiklikler, ' + what + ' içeriğiyle değiştirilecek.',
      choices: [{ id: 'cancel', label: 'Vazgeç' }, { id: 'discard', label: 'Değişiklikleri at ve yükle', kind: 'danger' }, { id: 'save', label: 'Önce kaydet', kind: 'primary' }]
    });
    if (a === 'save') { if (!(await save())) return false; } else if (a !== 'discard') return false;
    if (S.cur !== c) return false;
  }
  const p = FM.parse(raw); p.eol = c.eol; p.bom = c.bom;
  if (c.isPrompt) FM.set(p, 'versiyon', FM.meta(FM.parse(c.savedRaw)).versiyon);
  c.parsed = p; c.lead = leadOf(p);
  c.restoredFrom = { what };
  if (!c.commitMsg.trim()) { c.commitMsg = msg; c.autoMsg = msg; }
  c.tab = c.isPrompt ? 'edit' : 'raw';
  renderMain(); updateDirty();
  toast('Eski içerik editöre alındı. Kaydedene kadar dosya değişmez.');
  return true;
}

function cancelRestore() {
  const c = S.cur; if (!c || !c.restoredFrom) return;
  c.parsed = FM.parse(c.savedRaw); c.lead = leadOf(c.parsed);
  c.restoredFrom = null;
  if (c.autoMsg && c.commitMsg === c.autoMsg) c.commitMsg = '';
  c.autoMsg = null;
  renderMain(); updateDirty();
}

  komut: { label: 'Claude Code komutu', meta: { tur: 'komut', arguman_ipucu: '[argüman]' }, body: 'Görev: $ARGUMENTS\n\nArgüman boşsa ne yapılacağını sor ve dur.\n\nÇıktı biçimi:\n1. \n' },

};

const hasWord = (v) => /[\p{L}\p{N}]/u.test(v);
// Yolun plugin klasörü adı; klasörsüz/gelen kutusu/dışarıdaki yollar için ''.
const pluginOfPath = (p, mp) => { const cl = Rules.classifyPromptPath(p || '', libDirOf(mp)); return cl.kind === 'paket' ? cl.klasor : ''; };
const pluginOfItem = (it) => (!it ? '' : it.kind === 'plugin' ? it.node.name : (() => { const cl = Rules.classifyPromptPath(it.path || '', libDirOf(it.mp)); return cl.kind === 'paket' ? cl.klasor : ''; })());

// Yeni prompt için ön değer: seçili düğüm, açık dosya, son kullanılan, ilk plugin.
function defaultPlugin() {
  const m = activeMp(); if (!m) return '';
  const names = m.plugins.map((p) => p.name);
  const cands = [];
  if (S.sel && S.sel.mp === m.name) cands.push(pluginOfItem(S.modelMap.get(S.sel.key)));
  if (S.cur && S.cur.mp === m.name) cands.push(pluginOfItem({ path: S.cur.path, mp: S.cur.mp }));
  cands.push(ls.get(lsKey('sonPlugin'), ''));
  for (const c of cands) if (c && names.includes(c)) return c;
  return names[0] || '';
}

    onMount: (b) => {
      $('#nmName', b).addEventListener('input', (e) => { $('#nmSlug', b).textContent = hasWord(e.target.value) ? 'Klasör adı: ' + FM.slug(e.target.value) : ''; });
      const mode = () => $$('input[name="nmMode"]', b).find((x) => x.checked).value;
      $$('input[name="nmMode"]', b).forEach((x) => x.addEventListener('change', () => {
        const k = mode() === 'klon';
        $('#nmCloneBox', b).hidden = !k; $('#nmNewBox', b).hidden = k;
        $('#newMkForm button.primary', b).textContent = k ? 'Klonla' : 'Oluştur';
        (k ? $('#nmUrl', b) : $('#nmName', b)).focus();
      }));
      $('#nmUrl', b).addEventListener('input', (e) => {
        const n = Rules.normalizeRepoUrl(e.target.value);
        if (!n.error && !$('#nmCloneName', b).dataset.touched) $('#nmCloneName', b).value = n.slugName;
      });
      $('#nmCloneName', b).addEventListener('input', (e) => { e.target.dataset.touched = '1'; });
      $('#newMkForm', b).addEventListener('submit', async (e) => {
        e.preventDefault();
        showFieldErr('nmErr', '');
        if (mode() === 'klon') {
          const n = Rules.normalizeRepoUrl($('#nmUrl', b).value);
          if (n.error) { showFieldErr('nmErr', n.error); $('#nmUrl', b).focus(); return; }
          const cname = $('#nmCloneName', b).value.trim();
          if (!(await confirmDiscard())) return;
          const btn = $('#newMkForm button.primary', b);
          btn.disabled = true; btn.setAttribute('aria-busy', 'true'); btn.textContent = 'Klonlanıyor…';
          try {
            const r = await api('POST', '/api/marketplaces/clone', { url: n.url, name: cname || undefined, activate: true });
            closeModal();
            const made = r.marketplace && r.marketplace.name;
            adoptInfo(await get('/api/info'));
            await Promise.all([loadLibrary(), loadFacets(), loadGit(), loadRecent()]);
            if (made) { S.mpOpen.add(made); saveMpOpen(); S.sel = { mp: made, key: nodeKey(made, '') }; S.focusKey = nodeKey(made, ''); ensureDefaultExp(made); }
            renderFilters(); renderList(); renderMain();
            if (r.warnings && r.warnings.length) cloneResultModal(r); else toast('Marketplace klonlandı');
            backgroundRemoteCheck();
          } catch (err) {
            btn.disabled = false; btn.removeAttribute('aria-busy'); btn.textContent = 'Klonla';
            showFieldErr('nmErr', err.message + (err.data && err.data.detail ? ' (' + err.data.detail + ')' : ''));
            (err.status === 409 ? $('#nmCloneName', b) : $('#nmUrl', b)).focus();
          }
          return;
        }
        const name = $('#nmName', b).value.trim();
        if (!hasWord(name)) { showFieldErr('nmErr', 'Bir ad gir'); $('#nmName', b).focus(); return; }
        if (!(await confirmDiscard())) return;
        try {
          const r = await api('POST', '/api/marketplaces', { name, description: $('#nmDesc', b).value.trim(), owner: $('#nmOwner', b).value.trim(), activate: true });
          closeModal();
          const made = (r.marketplace && r.marketplace.name) || FM.slug(name);
          adoptInfo(await get('/api/info'));
          await Promise.all([loadLibrary(), loadFacets(), loadGit(), loadRecent()]);
          S.mpOpen.add(made); saveMpOpen();
          S.sel = { mp: made, key: nodeKey(made, '') }; S.focusKey = nodeKey(made, '');
          ensureDefaultExp(made);
          renderFilters(); renderList(); renderMain();
          toast("Marketplace oluşturuldu. İlk commit'i Git panelinden atabilirsin.", 'ok', 5000);
        } catch (err) { showFieldErr('nmErr', err.message); $('#nmName', b).focus(); }
      });
    }
  });
}

// Yeni plugin: klasör + .gitkeep (+ açıklama). Commit atılmaz.
function openNewPlugin() {
  const m = activeMp();
  if (!m) { toast('Önce bir marketplace seç', 'error'); return; }
  const lib = m.libraryDir;
  openModal({
    title: 'Yeni plugin: ' + m.name,
    html: `<form class="stack" id="newPlForm" novalidate>
      <label>Ad<input id="plName" autocomplete="off" aria-describedby="plPrev plErr plWarn" placeholder="Örn. kod-inceleme" autofocus></label>
      <p class="hint" id="plPrev" style="margin:0"></p>
      <p class="issue error" id="plErr" role="alert" style="margin:0" hidden></p>
      <p class="issue warn" id="plWarn" style="margin:0" hidden></p>
      <label>Açıklama<input id="plDesc" autocomplete="off" placeholder="Bu plugin ne işe yarar?"></label>
      <p class="hint" style="margin:0">Boş bırakılabilir. Yayında açıklama gerekir.</p>
      <div id="plSrvErr" class="issue error" role="alert" hidden></div>
      <div class="foot"><button type="button" class="btn" data-act="close">Vazgeç</button><button class="btn primary">Oluştur</button></div></form>`,
    onMount: (b) => {
      const check = () => {
        const v = $('#plName', b).value; const slug = hasWord(v) ? FM.slug(v) : '';
        $('#plPrev', b).textContent = slug ? `Klasör: ${lib}/${slug}/ · Claude Code'da: /${slug}:<komut>` : '';
        const err = slug ? Rules.checkPluginName(slug) : null; const warn = slug ? Rules.pluginNameWarn(slug) : null;
        showFieldErr('plErr', err); showFieldErr('plWarn', err ? '' : warn);
        $('#plName', b).setAttribute('aria-invalid', err ? 'true' : 'false');
        return { slug, err };
      };
      $('#plName', b).addEventListener('input', check);
      $('#newPlForm', b).addEventListener('submit', async (e) => {
        e.preventDefault();
        const { slug, err } = check();
        if (!slug) { showFieldErr('plErr', 'Plugin adı gerekli'); $('#plName', b).focus(); return; }
        if (err) { $('#plName', b).focus(); return; }
        if (activeName() !== m.name) { showFieldErr('plSrvErr', 'Etkin marketplace değişti. Pencereyi kapatıp yeniden dene.'); return; }
        try {
          const r = await api('POST', '/api/package', { name: $('#plName', b).value, description: $('#plDesc', b).value.trim() });
          closeModal();
          ls.set(lsKey('sonPlugin'), r.plugin.name);
          await afterWrite();
          expOf(m.name).add(r.plugin.path); S.mpOpen.add(m.name); saveExp(m.name); saveMpOpen();
          S.sel = { mp: m.name, key: nodeKey(m.name, r.plugin.path) }; S.focusKey = S.sel.key;
          renderList();
          toast('Plugin oluşturuldu: ' + r.plugin.name + ". Commit'i Git panelinden atabilirsin.", 'ok', 5000);
        } catch (err2) { showFieldErr('plSrvErr', err2.message); }
      });
    }
  });
}

function openNewPrompt(o) {
  o = o || {};
  const m = activeMp();
  if (!m) { toast('Önce bir marketplace seç', 'error'); return; }
  if (!m.plugins.length) {
    openModal({
      title: 'Yeni prompt',
      html: `<p>Bu marketplace'te henüz plugin yok.</p><div class="foot"><button class="btn" data-act="close">Kapat</button><button class="btn primary" data-act="new-plugin">Yeni plugin</button></div>`
    });
    return;
  }
  const names = m.plugins.map((p) => p.name);
  const sel = o.plugin && names.includes(o.plugin) ? o.plugin : defaultPlugin();
  openModal({
    title: 'Yeni prompt',
    html: `<form class="stack" id="newForm">
      <p class="hint" style="margin:0">Marketplace: <b>${esc(m.name)}</b></p>
      <label>Başlık<input name="title" required autofocus placeholder="Örn. C# kod inceleme" autocomplete="off"></label>

    onMount: (b) => {
      $('#newForm', b).addEventListener('submit', async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const title = String(f.get('title')).trim(); if (!title) return;

        const p = FM.parse('');

        if (!(await confirmDiscard())) return;
        try {
          const r = await api('POST', '/api/file', { path: m.libraryDir + '/' + plugin + '/' + FM.slug(title) + '.md', raw: FM.stringify(p), unique: true });
          ls.set(lsKey('sonPlugin'), plugin);

          const bd = $('#fBody'); if (bd) bd.focus();
          toast('Prompt oluşturuldu');
        } catch (err) { fail(err); }
      });

}

// Prompt taşı: aynı marketplace'te /api/rename, başka marketplace'e /api/prompts/transfer.
async function openMove(path) {
  const m = activeMp(); if (!m) return;
  const from = m.name;
  const mps = S.lib.marketplaces.filter((x) => x.state === 'hazir');
  const cl = Rules.classifyPromptPath(path, m.libraryDir);
  const targetOpts = (name) => {
    const mm = mpByName(name); const opts = mm.plugins.map((p) => ({ v: 'p:' + p.name, label: p.name }));
    if (name === from) { opts.push({ v: 'i:', label: 'Gelen kutusu' }, { v: 'l:', label: 'Klasörsüz promptlar' }); }
    return opts;
  };
  const defTarget = cl.kind === 'paket' ? 'p:' + cl.klasor : cl.kind === 'gelenKutusu' ? 'i:' : 'l:';
  openModal({
    title: 'Taşı: ' + base(path),
    html: `<form class="stack" id="moveForm">
      <label>Marketplace<select id="mvMp">${mps.map((x) => `<option value="${esc(x.name)}" ${x.name === from ? 'selected' : ''}>${esc(x.name)}${x.name === from ? ' (etkin)' : ''}</option>`).join('')}</select></label>
      <label>Hedef<select id="mvTarget"></select></label>
      <label>Dosya adı<input id="mvName" value="${esc(base(path))}" autocomplete="off"></label>
      <p class="hint" id="mvNote" style="margin:0"></p>
      <div id="mvErr" class="issue error" role="alert" hidden></div>
      <div class="foot"><button type="button" class="btn" data-act="close">Vazgeç</button><button class="btn primary">Taşı</button></div></form>`,
    onMount: (b) => {
      const fill = () => {
        const name = $('#mvMp', b).value; const cross = name !== from;
        const opts = targetOpts(name);
        const keep = $('#mvTarget', b).value;
        $('#mvTarget', b).innerHTML = opts.length ? opts.map((o) => `<option value="${esc(o.v)}">${esc(o.label)}</option>`).join('') : '<option value="">(bu marketplace\'te plugin yok)</option>';
        const want = cross ? keep : (keep || defTarget);
        if (opts.some((o) => o.v === want)) $('#mvTarget', b).value = want;
        else if (!cross && opts.some((o) => o.v === defTarget)) $('#mvTarget', b).value = defTarget;
        $('#mvName', b).disabled = cross;
        if (cross) $('#mvName', b).value = base(path);
        $('#mvNote', b).textContent = cross
          ? `Hedef marketplace: ${name}. Dosya orada yeni (commit edilmemiş) olarak görünür, kaynak çöp kutusuna taşınır. Sürüm tag'leri ve geçmiş "${from}" deposunda kalır. Commit'i iki depoda ayrı atarsın.`
          : "Bu promptun sürüm tag'leri eski yola bağlı kalır. Yayınlanmışsa eski hedef Marketplace panelinde \"kaynağı kalmayan dosyalar\" altında görünür.";
      };
      fill();
      $('#mvMp', b).addEventListener('change', fill);
      $('#moveForm', b).addEventListener('submit', async (e) => {
        e.preventDefault();
        const toMp = $('#mvMp', b).value; const tv = $('#mvTarget', b).value; const er = $('#mvErr', b);
        const showErr = (msg) => { er.textContent = msg; er.hidden = false; };
        if (!tv) { showErr('Hedef seç'); return; }
        if (activeName() !== from) { showErr('Etkin marketplace değişti. Pencereyi kapatıp yeniden dene.'); return; }
        if (S.cur && S.cur.path === path && !(await confirmDiscard())) return;
        try {
          if (toMp !== from) {
            await api('POST', '/api/prompts/transfer', { path, toMp, toPlugin: tv.slice(2) });
            closeModal();
            if (S.cur && S.cur.path === path) { S.cur = null; ls.set(lsKey('last'), null); }
            S.mpOpen.add(toMp); saveMpOpen();
            await afterWrite(); renderMain();
            toast(`Taşındı: ${toMp}. Sürüm tag'leri ve geçmiş "${from}" deposunda kaldı; iki depoda da commit bekleyen değişiklik var.`, 'ok', 7000);
            return;
          }
          const kind = tv.charAt(0); const nm = tv.slice(2);
          const dir = kind === 'p' ? m.libraryDir + '/' + nm : kind === 'i' ? m.libraryDir + '/' + Rules.INBOX_DIR : m.libraryDir;
          let file = $('#mvName', b).value.trim() || base(path);
          if (!/\.[^.]+$/.test(file)) file += (path.match(/\.[^.]+$/) || ['.md'])[0];
          const to = dir + '/' + file;
          if (to === path) { closeModal(); return; }
          const r = await api('POST', '/api/rename', { from: path, to });
          closeModal();
          if (S.cur && S.cur.path === path) { S.cur.path = r.path; ls.set(lsKey('last'), r.path); }
          expandParents(r.path);
          await afterWrite(); renderMain();
          toast("Taşındı. Bu promptun sürüm tag'leri eski yola bağlı kalır. Yayınlanmışsa eski hedef Marketplace panelinde \"kaynağı kalmayan dosyalar\" altında görünür.", 'ok', 6000);
        } catch (err) { showErr(err.message); }
      });
    }
  });
}

// Prompt dosyasını aynı klasörde yeniden adlandırır.
async function renameFile(path) {
  const dir = path.split('/').slice(0, -1).join('/');
  const nm = await askText({ title: 'Yeniden adlandır', label: 'Yeni dosya adı', value: base(path), ok: 'Uygula' });
  if (!nm || nm === base(path)) return;
  let file = nm; if (!/\.[^.]+$/.test(file)) file += (path.match(/\.[^.]+$/) || ['.md'])[0];
  await renameItem(path, dir + '/' + file);
}

async function renameItem(p, to) {
  if (to === undefined) to = await askText({ title: 'Yeniden adlandır veya taşı', label: 'Yeni yol', value: p, hint: 'Başka bir klasöre taşımak için yolu düzenle.', ok: 'Uygula' });
  if (!to || to === p) return;
  if (S.cur && (S.cur.path === p || S.cur.path.startsWith(p + '/')) && !(await confirmDiscard())) return;
  try {
    const r = await api('POST', '/api/rename', { from: p, to });
    if (S.cur && (S.cur.path === p || S.cur.path.startsWith(p + '/'))) { S.cur.path = r.path + S.cur.path.slice(p.length); ls.set(lsKey('last'), S.cur.path); }
    expandParents(r.path); await afterWrite(); renderMain();
    toast('Taşındı. Yayınlanmışsa eski hedef Marketplace panelinde "kaynağı kalmayan dosyalar" altında görünür.', 'ok', 5000);
  } catch (e) { fail(e); }
}

async function renamePlugin(name) {
  const m = activeMp(); if (!m) return;
  const to = await askText({ title: "Plugin'i yeniden adlandır", label: 'Yeni ad', value: name, hint: 'Klasör adı ve yayın adı buna göre değişir.', ok: 'Devam' });
  if (!to || to === name) return;
  const slug = FM.slug(to);
  const a = await askChoice({
    title: 'Plugin yeniden adlandırılsın mı?',
    text: `"${name}" → "${slug}". Promptların sürüm tag'leri eski adla kalır, yayınlanmış çıktı (plugins/${FM.slug(name)}) kaynaksız kalır ve bir sonraki yayında temizlenir.`,
    choices: [{ id: 'no', label: 'Vazgeç' }, { id: 'yes', label: 'Yeniden adlandır', kind: 'primary' }]
  });
  if (a !== 'yes') return;
  const old = m.libraryDir + '/' + name;
  if (S.cur && S.cur.path.startsWith(old + '/') && !(await confirmDiscard())) return;
  try {
    const r = await api('POST', '/api/package/rename', { from: name, to });
    const ex = expOf(m.name);
    if (ex.delete(old)) ex.add(r.plugin.path);
    saveExp(m.name);
    if (S.cur && S.cur.path.startsWith(old + '/')) { S.cur.path = r.plugin.path + S.cur.path.slice(old.length); ls.set(lsKey('last'), S.cur.path); }
    if (ls.get(lsKey('sonPlugin'), '') === name) ls.set(lsKey('sonPlugin'), r.plugin.name);
    S.sel = { mp: m.name, key: nodeKey(m.name, r.plugin.path) }; S.focusKey = S.sel.key;
    await afterWrite(); renderMain();
    toast('Plugin yeniden adlandırıldı: ' + r.plugin.name + ' (' + r.moved + ' prompt)', 'ok', 5000);
  } catch (e) { fail(e); }
}

async function editPluginDesc(name) {
  const pl = pluginsOf(activeMp()).find((p) => p.name === name);
  const d = await askText({ title: 'Plugin açıklaması: ' + name, label: 'Açıklama', value: (pl && pl.description) || '', hint: 'Bu plugin ne işe yarar? Yayında açıklama gerekir.', ok: 'Kaydet' });
  if (!d) return;
  try { await api('PUT', '/api/package', { name, description: d }); await afterWrite(); toast('Açıklama kaydedildi'); } catch (e) { fail(e); }
}

async function deleteItem(p, text) {
  const a = await askChoice({ title: 'Silinsin mi?', text: text || ('"' + p + '" çöp kutusuna (.pp/trash) taşınır. Git ile takip ediliyorsa geçmişte de durur.'), choices: [{ id: 'no', label: 'Vazgeç' }, { id: 'yes', label: 'Sil', kind: 'danger' }] });
  if (a !== 'yes') return;
  try {
    await api('DELETE', '/api/file?' + qs({ path: p }));
    if (S.cur && (S.cur.path === p || S.cur.path.startsWith(p + '/'))) { S.cur = null; ls.set(lsKey('last'), null); }
    await afterWrite(); renderMain(); toast('Çöp kutusuna taşındı');
  } catch (e) { fail(e); }
}

/* ---------------------------------------------------------- içe aktarma */
function openImport(preset) {
  const m = activeMp();
  const lib = libDirOf();
  const targets = [{ v: lib + '/' + Rules.INBOX_DIR, label: 'Gelen kutusu' }].concat(pluginsOf(m).map((p) => ({ v: p.path, label: p.name })));
  openModal({
    title: '.txt dosyalarını içe aktar', wide: true,
    html: `<div class="stack"><form class="grid2" id="impForm">
      <label class="span2">Klasör yolu<input name="dir" value="${esc(ls.get('pp.impDir', ''))}" placeholder="C:\\Users\\sen\\promptlar veya ~/promptlar" autocomplete="off" autofocus></label>
      <p class="span2 hint" style="margin:0">Hedef marketplace: <b>${esc(activeName())}</b></p>
      <label>Hedef<select name="target">${targets.map((t) => `<option value="${esc(t.v)}" ${preset === t.v ? 'selected' : ''}>${esc(t.label)}</option>`).join('')}</select></label>
      <label class="chk" style="align-self:end"><input type="checkbox" name="rec"> Alt klasörleri de tara</label>
      <div class="span2 foot-left"><button class="btn primary">Tara</button><span class="hint">Orijinal dosyalara dokunulmaz. Eski Türkçe kodlamalar (Windows-1254) ve UTF-16 otomatik çözülür.</span></div></form>
      <div id="impOut"></div></div>`,
    onMount: (b) => {
      $('#impForm', b).addEventListener('submit', async (e) => {
        e.preventDefault();
        const f = new FormData(e.target); const dir = String(f.get('dir')).trim(); if (!dir) return;
        const out = $('#impOut', b); out.innerHTML = '<p class="hint">Taranıyor…</p>';
        try {
          const r = await api('POST', '/api/import/scan', { dir, recursive: !!f.get('rec') });
          ls.set('pp.impDir', dir);
          if (!r.files.length) { out.innerHTML = '<p>Bu klasörde .txt dosyası bulunamadı.</p>'; return; }
          out.innerHTML = `<h3>${r.files.length} dosya bulundu</h3>
            <div class="inline" style="margin-bottom:8px"><button type="button" class="btn sm" id="impAll">Tümünü seç / bırak</button><span class="grow"></span><button type="button" class="btn primary" id="impGo">İçe aktar</button></div>
            <div class="ftable">${r.files.map((x, i) => `<label class="frowi"><input type="checkbox" data-i="${i}" checked><span><b>${esc(x.rel)}</b><br><span class="pv">${esc(x.preview)}</span></span><span class="hint">${x.lines} satır</span></label>`).join('')}</div>`;
          $('#impAll', out).addEventListener('click', () => { const cb = $$('[data-i]', out); const all = cb.every((x) => x.checked); cb.forEach((x) => { x.checked = !all; }); });
          $('#impGo', out).addEventListener('click', async () => {
            const files = $$('[data-i]', out).filter((x) => x.checked).map((x) => r.files[Number(x.dataset.i)].file);
            if (!files.length) { toast('Dosya seçilmedi', 'error'); return; }
            try {
              const res = await api('POST', '/api/import/run', { dir: r.dir, files, target: String(f.get('target')).trim() || lib + '/' + Rules.INBOX_DIR });
              const tgt = String(f.get('target')).trim();
              out.innerHTML = `<h3>${res.created.length} prompt oluşturuldu</h3>
                <p>Taslak olarak <code>${esc(tgt)}</code> içine kaydedildi. Orijinal .txt dosyaları yerinde duruyor. Şimdi etiketle, klasörlere ayır ve git ile commit et.</p>
                ${res.skipped.length ? `<p class="issue warn">${res.skipped.length} dosya atlandı: ${res.skipped.map((s) => esc(base(s.file) + ' (' + s.reason + ')')).join(', ')}</p>` : ''}
                <div class="foot"><button class="btn" data-act="close">Kapat</button><button class="btn primary" data-act="show-folder" data-path="${esc(tgt)}">Klasörü göster</button></div>`;
              await afterWrite();
            } catch (err) { fail(err); }
          });
        } catch (err) { out.innerHTML = ''; fail(err); }
      });
    }
  });
}

/* --------------------------------------------------------------------- git */
function renderGitBadge() {
  const b = $('#gitBadge'); const g = S.git;
  if (!g) { b.hidden = true; return; }
  if (!g.isRepo) { b.hidden = false; b.className = 'badge warn'; b.textContent = '!'; b.title = 'Git deposu değil'; return; }
  const n = g.files.length;
  b.className = 'badge'; b.hidden = !n; b.textContent = n; b.title = n + ' değişiklik commit bekliyor';
}

const GLABEL = { '?': 'yeni', M: 'değişti', D: 'silindi', A: 'eklendi', R: 'taşındı' };

const gitTitle = () => 'Git: ' + (S.info.activeMarketplace || 'marketplace seçilmedi');
const gitTarget = () => `<p class="hint" style="margin:0">Commit bu depoya atılır: <b>${esc(S.info.activeMarketplace)}</b> <code>${esc(S.info.root || '')}</code></p>`;

async function openGit(tab) {
  S.gitLogLimit = 300;
  if (!setupOk()) {
    openModal({
      title: 'Git',
      html: `<p>Git işlemleri kapalı: ${esc(firstError())}</p><div class="foot"><button class="btn primary" data-act="settings">Ayarları aç</button></div>`
    });
    return;
  }
  openModal({ title: gitTitle(), wide: true, html: '<p class="hint">Yükleniyor…</p>', noFocus: true });
  await loadGit();
  if (tab === 'log') return paintGitLog();
  if (tab === 'remote') return paintGitRemote();
  paintGit();
}

function gitTabs(on) {
  return `<div class="tabs" role="tablist"><button class="tab ${on === 'changes' ? 'on' : ''}" data-act="git-tab" data-tab="changes">Değişiklikler${S.git && S.git.isRepo ? ' (' + S.git.files.length + ')' : ''}</button><button class="tab ${on === 'log' ? 'on' : ''}" data-act="git-tab" data-tab="log">Geçmiş</button><button class="tab ${on === 'remote' ? 'on' : ''}" data-act="git-tab" data-tab="remote">Uzak depo</button></div><div style="height:14px"></div>`;
}

function paintGit() {
  const g = S.git; const body = $('#mBody');
  if (!g.isRepo) {
    // Kurulum hazırken normalde ulaşılmaz; savunma amaçlı.
    body.innerHTML = `<p>Seçili marketplace'te git başlatılmamış${g.error ? ': ' + esc(g.error) : '.'}</p>
      <p class="hint">Git, marketplace klasöründe başlatılır: <code>${esc(S.info.root || '')}</code>. Eksik iskelet dosyaları eklenir, var olan dosyalara dokunulmaz.</p>
      <div class="foot"><button class="btn primary" data-act="mk-git-init" data-name="${esc(S.info.activeMarketplace)}">Git'i başlat</button></div>`;
    return;
  }
  if (!S.gitSel) S.gitSel = new Set();
  const paths = g.files.map((f) => f.path);
  for (const p of Array.from(S.gitSel)) if (!paths.includes(p)) S.gitSel.delete(p);
  if (S.gitSel.size === 0 && !S.gitSelTouched) paths.forEach((p) => S.gitSel.add(p));
  const idOpen = !g.identity.name || !g.identity.email;
  const suggestion = g.files.length === 1 ? (stem(g.files[0].path) + ': güncelle') : (g.files.length ? g.files.length + ' dosya güncellendi' : '');
  body.innerHTML = gitTabs('changes') + `<div class="gitgrid"><div class="gitleft">
    ${gitTarget()}
    <div class="hint">Dal: <b>${esc(g.branch)}</b>${g.hasCommits ? '' : ' (henüz commit yok)'}</div>
    ${g.files.length ? `<div class="ftable">${g.files.map((f) => `<div class="gf" data-gpath="${esc(f.path)}"><input type="checkbox" data-gsel="${esc(f.path)}" ${S.gitSel.has(f.path) ? 'checked' : ''} aria-label="${esc(f.path)} commit'e dahil"><button class="link" data-act="git-diff" data-path="${esc(f.path)}" title="${esc(f.path)}">${esc(f.path)}</button><span class="pill ${f.code === 'D' ? 'bad' : f.code === '?' ? 'ok' : 'warn'}">${GLABEL[f.code] || f.code}</span></div>`).join('')}</div>
      <button class="btn sm" data-act="git-selall" style="justify-self:start">Tümünü seç / bırak</button>`
      : '<p>Commit bekleyen değişiklik yok. Her şey kayıtlı.</p>'}
    <details id="gitId" ${idOpen ? 'open' : ''}><summary>Git kimliği ${idOpen ? '(commit için gerekli)' : ''}</summary>
      <div class="stack" style="margin-top:8px"><input id="gName" placeholder="Ad Soyad" value="${esc(g.identity.name)}" aria-label="Git adı"><input id="gMail" placeholder="e-posta" value="${esc(g.identity.email)}" aria-label="Git e-postası"><button class="btn sm" data-act="git-identity" style="justify-self:start">Kimliği kaydet</button></div></details>
    ${g.files.length ? `<label>Commit mesajı<textarea id="gMsg" rows="4" placeholder="Ne değişti ve neden? İlk satır özet olsun.">${esc(S.gitMsg || suggestion)}</textarea></label>
      <button class="btn primary" data-act="git-commit">Seçilenleri commit et</button>` : ''}
    </div><div><pre class="diff" id="gDiff">Bir dosya adına tıkla, farkı burada gör.</pre></div></div>`;
}

const GITLOG_MODES = ['file', 'commit', 'version'];

function gitLogBar(mode) {
  const b = (m, t) => `<button type="button" data-act="gitlog-mode" data-mode="${m}" aria-pressed="${mode === m}">${t}</button>`;
  return `<div class="seg" role="group" aria-label="Geçmiş görünümü">${b('file', 'Dosyaya göre')}${b('commit', "Commit'e göre")}${b('version', 'Sürüme göre')}</div> <span class="hint">Etkin depo: <b>${esc(S.info.activeMarketplace)}</b></span>`;
}

async function paintGitLog() {
  const body = $('#mBody');
  if (!S.git.isRepo) return paintGit();
  let mode = ls.get('pp.gitLogMode', 'file'); if (!GITLOG_MODES.includes(mode)) mode = 'file';
  const tok = S.glTok = (S.glTok || 0) + 1;
  const head = gitTabs('log') + gitLogBar(mode);
  body.innerHTML = head + '<div id="glBody"><p class="hint">Yükleniyor…</p></div>';
  const live = () => tok === S.glTok && $('#glBody');
  const fill = (html) => { if (live()) $('#glBody').innerHTML = html; };
  try {
    if (mode === 'commit') {
      const r = await get('/api/git/log');
      fill(r.commits.length
        ? `<div class="hist"><ul class="commits" style="max-height:62vh">${r.commits.map((k) => `<li role="button" tabindex="0" data-act="git-show" data-hash="${k.hash}"><div class="s">${esc(k.subject)}</div><div class="hint">${esc(fmtDate(k.date))}, ${esc(k.short)}</div></li>`).join('')}</ul><pre class="diff" id="gDiff">Bir kayıt seç.</pre></div>`
        : '<p>Henüz commit yok.</p>');
    } else if (mode === 'file') {
      const r = await get('/api/history/changes?' + qs({ group: 'file', limit: S.gitLogLimit || 300 }));
      if (!r.files.length) { fill('<p>Henüz commit yok.</p>'); return; }
      const files = r.files.map((f) => `<details class="gfile"><summary>${esc(f.path)} <span class="hint">${f.count} commit · son: ${esc(fmtDate(f.last.date))}</span>${f.status === 'D' ? ' <span class="pill bad">Silindi</span>' : ''}${f.oldPaths.length ? ' <span class="pill">Yeniden adlandırıldı</span>' : ''}</summary>
        <div class="gcs">${f.exists ? `<div><button class="btn sm" data-act="open-close" data-mp="${esc(r.mp)}" data-path="${esc(f.path)}">Dosyayı aç</button></div>` : ''}${f.commits.map((k) => `<button type="button" class="link" data-act="gitlog-file-commit" data-hash="${esc(k.hash)}" data-path="${esc(k.path)}">${esc(k.subject)} <span class="hint">${esc(fmtDate(k.date))}, ${esc(k.short)}${k.oldPath ? ', ' + esc(k.oldPath) + ' → ' + esc(k.path) : ''}</span></button>`).join('')}</div></details>`).join('');
      const more = r.hasMore && (S.gitLogLimit || 300) < 3000 ? '<p><button class="btn sm" data-act="gitlog-more">Daha eski kayıtları yükle</button></p>' : (r.hasMore ? '<p class="hint">Daha eski kayıtlar için sınıra ulaşıldı (3000 commit).</p>' : '');
      fill(`<div class="hist"><div><div class="gfilelist">${files}</div>${more}</div><pre class="diff" id="gDiff">Soldan bir dosyayı aç, sonra bir commit seç; o commit'in o dosyadaki farkı burada görünür.</pre></div>`);
    } else {
      const r = await get('/api/history/changes?group=version');
      if (!r.prompts.length && !r.unmatched.length) { fill("<p>Bu marketplace'te henüz hiç sürüm oluşturulmadı.</p>"); return; }
      const ver = (p, v) => `<li><button type="button" class="link" data-act="gitlog-ver" data-path="${esc(p)}" data-tag="${esc(v.tag)}">v${esc(v.version)}</button> <span class="hint">${esc(fmtDate(v.date))}${v.subject ? ', ' + esc(v.subject) : ''}</span></li>`;
      fill(`<div class="gfilelist">${r.prompts.map((p) => `<details class="gfile"><summary>${esc(p.ad)} <span class="hint">son sürüm: v${esc(p.versions[0].version)}</span></summary><ul>${p.versions.map((v) => ver(p.path, v)).join('')}</ul></details>`).join('')}</div>`
        + (r.unmatched.length ? `<h3>Dosyası bulunamayan sürümler</h3><ul>${r.unmatched.map((u) => `<li><code>${esc(u.ad)}</code>: ${u.versions.map((v) => 'v' + esc(v.version)).join(', ')}</li>`).join('')}</ul>` : ''));
    }
  } catch (e) { fill(`<p class="issue error">${esc(e.message)}</p>`); }
}

// "Sürüme göre" listesinden bir sürüme gidiş: dosyayı Geçmiş sekmesinde, o sürüm seçili açar.
async function openVersionInHistory(path, tag) {
  closeModal();
  S.histPreselect = tag;
  try {
    const c = S.cur;
    if (c && c.path === path && c.mp === activeName()) {
      // Dosya zaten açık: openFile erken döndüğü için sekme doğrudan değiştirilir.
      if (c.tab === 'hist') loadHistory(); else setTab('hist');
    } else await openIn(activeName(), path, { tab: 'hist' });
  } finally { S.histPreselect = null; }
}

async function gitDiffFor(p) {
  const box = $('#gDiff'); if (!box) return;
  $$('.gf').forEach((x) => x.classList.toggle('on', x.dataset.gpath === p));
  const f = S.git.files.find((x) => x.path === p);
  try {
    if (f && f.code === '?') {
      const r = await get('/api/file?' + qs({ path: p }));
      box.innerHTML = diffHtml(('+++ ' + p + ' (yeni dosya)\n' + r.raw.replace(/\r\n/g, '\n').replace(/\n$/, '').split('\n').map((l) => '+' + l).join('\n')));
      return;
    }
    const r = await get('/api/git/diff?' + qs({ path: p, working: 1 }));
    box.innerHTML = r.diff ? diffHtml(r.diff) : 'Fark yok.';
  } catch (e) { box.textContent = e.message; }
}

async function gitCommit() {
  const msg = ($('#gMsg') || {}).value || '';
  const paths = Array.from(S.gitSel || []);
  if (!paths.length) { toast('Commit için en az bir dosya seç', 'error'); return; }
  if (!msg.trim()) { toast('Commit mesajı yaz', 'error'); return; }
  try {
    const r = await api('POST', '/api/git/commit', { message: msg, paths });
    S.gitMsg = ''; S.gitSel = null; S.gitSelTouched = false;
    toast('Commit oluşturuldu (' + r.commit + ')');
    await loadGit(); paintGit(); loadRecent();
    if (S.cur && S.cur.tab === 'hist') loadHistory();
  } catch (e) {
    if (e.data && e.data.needIdentity) { const d = $('#gitId'); if (d) d.open = true; }
    fail(e);
  }
}

/* -------------------------------------------------------------- marketplace */
const cmdLine = (t) => `<div class="cmd"><code>${esc(t)}</code><button class="btn sm" data-act="copy-text" data-text="${esc(t)}">Kopyala</button></div>`;

const DURUM_OPTS = [['kararlı', 'Kararlı'], ['taslak', 'Taslak'], ['arşiv', 'Arşiv'], ['', 'Durumu boş']];

function mkListHtml(st) {
  const skipped = st.skipped || [];
  const stPill = (s) => s === 'guncel' ? '<span class="pill ok">Çıktı güncel</span>' : s === 'eski' ? '<span class="pill warn">Kaynak değişti</span>' : '<span class="pill warn">Çıktı yok</span>';
  let h = '';
  if (!st.items.length && !st.orphans.length && !skipped.length) {
    h += '<div class="empty" style="border:1px solid var(--line2);border-radius:6px">Henüz dışa aktarılacak prompt yok. Bir promptu açıp "Claude Code yayın ayarları" bölümünden türünü seç (komut, ajan veya skill).</div>';
  }
  if (skipped.length) {
    h += `<h3>Yayını engelleyen promptlar (${skipped.length})</h3><div class="mklist">${skipped.map((x) => `<div class="mkrow"><div>
      <button class="link" data-act="open-close" data-path="${esc(x.source)}">${esc(x.baslik)}</button>
      <div class="hint mono">${esc(x.source)}</div>
      <div class="issue warn">${esc(x.reason)}</div></div><div></div><div></div></div>`).join('')}</div>`;
  }
  if (st.items.length) {
    h += '<div class="mklist">' + st.items.map((i) => `<div class="mkrow"><div>
      <button class="link" data-act="open-close" data-path="${esc(i.source)}">${esc(i.baslik)}</button> <span class="pill">${esc(i.tur)}</span> <span class="pill">${esc(i.paket)}</span>
      <div class="hint mono">${esc(i.target)}</div>
      ${i.issues.map((x) => `<div class="issue ${x.level}">${esc(x.msg)}</div>`).join('')}</div>
      <div>${stPill(i.state)}</div><div></div></div>`).join('') + '</div>';
  }
  if (st.unpublishedCount > 0) h += `<p class="hint">${st.unpublishedCount} prompt bilinçli olarak yayın dışı (tür seçilmemiş).</p>`;
  if (st.orphans.length) {
    h += `<h3>Kaynağı kalmayan dosyalar</h3><p class="hint">Bu dosyaların havuzda karşılığı yok: kaynak silinmiş, taşınmış ya da adı değişmiş olabilir. "Marketplace'i güncelle" bunları çöp kutusuna taşır.</p><div class="mklist">${st.orphans.map((o) => `<div class="mkrow"><div><div class="mono">${esc(o.target)}</div>${o.likelySource ? `<div class="issue warn">Kaynağı muhtemelen <button class="link" data-act="open-close" data-path="${esc(o.likelySource.source)}">${esc((skipped.find((x) => x.source === o.likelySource.source) || {}).baslik || o.likelySource.source)}</button>: ${esc(o.likelySource.reason)}</div>` : ''}</div><div></div><div></div></div>`).join('')}</div>`;
  }
  return h;
}

function mkCmdsHtml(st) {
  const c = st.commands;
  const alt = (c.alternatives || []).length ? `<p class="hint">Alternatif (tam URL):</p>${c.alternatives.map(cmdLine).join('')}` : '';
  const pin = c.pinHint ? `<p class="hint">Belirli bir dal ya da etikete sabitlemek için sonuna <code>#ref</code> ekle: <code>${esc(c.pinHint)}</code></p>` : '';
  return `<p class="hint">Bir kez, bilgisayarında (terminalde):</p>${cmdLine(c.validate)}${cmdLine(c.add)}${alt}${pin}
    ${c.addNote ? `<p class="hint">${esc(c.addNote)}</p>` : ''}
    <p class="hint" style="margin-top:12px">Sonra her projede istediğin paketi kur (yalnızca yayınlanmış paketler):</p>${c.install.length ? c.install.map((i) => cmdLine(i.cmd)).join('') : '<p class="hint">Henüz yayınlanmış paket yok. Paket sayfasından Yayınla.</p>'}
    <p class="hint" style="margin-top:12px">Claude Code oturumunda aynı işler <code>/plugin marketplace add …</code> ve <code>/plugin install …</code> ile de yapılır. Kurulan komutlar <code>/paket:ad</code> biçiminde çağrılır.</p>`;
}

function mkPackagesHtml(list) {
  if (!list || !list.length) return '<p class="hint">Henüz paket yok. Ağaçta "Yeni plugin" ile bir klasör aç ve içine prompt koy.</p>';
  return `<div class="mklist">${list.map((p) => `<div class="mkrow"><div><b>${esc(p.name)}</b> <span class="pill">${p.version ? 'v' + esc(p.version) : 'yayınlanmadı'}</span>
      ${p.lastTag ? `<span class="hint">son etiket: ${esc(p.lastTag.name)}</span>` : ''}
      <div class="hint">${p.changedCount} değişiklik${p.blocking ? ` · <span class="issue error">${p.blocking} engelleyici sorun</span>` : ''}${p.pendingPush ? ' · <span class="pill warn">Push bekliyor</span>' : ''}</div></div><div></div>
      <div class="mkbtns"><button class="btn sm" data-act="open-package" data-name="${esc(p.name)}" data-from="panel">Aç</button></div></div>`).join('')}</div>`;
}

  const cfgIssues = (st.configIssues || []).map((x) => `<div class="issue ${esc(x.level)}" role="status">${esc(x.message)}</div>`).join('');
  const ex = st.export || { durumlar: ['kararlı', ''] };
  return `${noCfg ? `<div class="issue warn" role="status">Bu marketplace'te Prompt Havuzu ayarı (pp.config.json) yok. <button class="btn sm" data-act="mk-ppconfig" data-name="${esc(activeName())}">Ayar dosyası oluştur</button></div>` : ''}
    <h3>Ayarlar</h3>${cfgIssues}
    <form class="grid2" id="mkForm">
      <label>Marketplace adı<input name="name" value="${esc(st.marketplaceName)}" autocomplete="off"></label>
      <label>Sahip<input name="owner" value="${esc(c.owner)}" placeholder="Adın" autocomplete="off"></label>

      <label>Katalog sürümü<input name="version" required value="${esc(c.version)}" placeholder="1.0.0" inputmode="decimal" autocomplete="off" aria-describedby="mkVerErr mkVerHint">

        <div id="mkVerErr" class="issue error" role="alert" hidden></div></label>
      <label class="span2">Açıklama<input name="description" value="${esc(c.description)}" autocomplete="off"></label>
      <fieldset class="span2" aria-describedby="mkExpErr"><legend>Dışa aktarılacak durumlar</legend>
        <div class="inline">${DURUM_OPTS.map(([v, t]) => `<label class="inline"><input type="checkbox" name="exdurum" value="${esc(v)}" ${Rules.durumAllowed(v, ex.durumlar) ? 'checked' : ''}> ${t}</label>`).join(' ')}</div>
        <div id="mkExpErr" class="issue error" role="alert" hidden></div></fieldset>

    <h3>Dışa aktarma durumu</h3>
    <div id="mkList">${mkListHtml(st)}</div>

async function loadMkPackages() {
  const box = $('#mkPkgs'); if (!box) return;
  try { const r = await get('/api/packages'); S.pkgList = r.packages; if ($('#mkPkgs')) $('#mkPkgs').innerHTML = mkPackagesHtml(r.packages); } catch (e) { if ($('#mkPkgs')) $('#mkPkgs').innerHTML = `<p class="issue error">${esc(e.message)}</p>`; }
}

async function openMarket() {
  openModal({ title: 'Marketplace: ' + activeName(), wide: true, html: '<p class="hint">Yükleniyor…</p>', noFocus: true });
  try { S.mk = await get('/api/marketplace/status'); $('#mBody').innerHTML = marketHtml(S.mk); loadMkPackages(); } catch (e) { closeModal(); fail(e); }
}

async function mkReload() {
  try {
    S.mk = await get('/api/marketplace/status');
    const l = $('#mkList'); if (l) l.innerHTML = mkListHtml(S.mk);
    const c = $('#mkCmds'); if (c) c.innerHTML = mkCmdsHtml(S.mk);
    const s = $('#mkState'); if (s) s.textContent = S.mk.marketplaceExists ? 'marketplace.json mevcut: ' + (S.mk.marketplacePlugins.join(', ') || 'paket yok') : 'Henüz yazılmadı';
    loadMkPackages();
  } catch (e) { fail(e); }
  afterWrite();
}

// "Marketplace'i güncelle": tüm paketleri dışa aktarır, katalog sürümünü artırmaz, tag atmaz, push etmez.
async function mkUpdate() {
  const st = S.mk; if (!st) return;
  const writes = st.items.filter((i) => i.state !== 'guncel').length;
  const removes = st.orphans.length;
  const txt = `${writes} dosya yazılacak, ${removes} dosya kaldırılacak (çöp kutusuna). Katalog sürümü artmaz, etiket atılmaz, push edilmez.`
    + (removes ? ' Kaldırılacaklar: ' + st.orphans.slice(0, 6).map((o) => o.target).join(', ') + (removes > 6 ? ' …' : '') : '');
  const a = await askChoice({ title: "Marketplace'i güncelle", text: txt, choices: [{ id: 'no', label: 'Vazgeç' }, { id: 'yes', label: 'Güncelle', kind: 'primary' }] });
  if (a !== 'yes') { openMarket(); return; }
  try {
    const r = await api('POST', '/api/marketplace/update', {});
    const sk = (r.skippedPackages || []).length ? ' Engelleyici sorunu olan paketler atlandı: ' + r.skippedPackages.map((x) => x.name).join(', ') + '.' : '';
    toast((r.commit ? 'Marketplace güncellendi' : 'Değişiklik yok') + sk, sk ? 'error' : 'ok', sk ? 7000 : 3000);
  } catch (e) { fail(e); }
  await openMarket();
  const b = $('#mBody [data-act="mk-update"]'); if (b) b.focus();
  afterWrite();
}

/* ------------------------------------------------------------ paket sayfası */
const CHANGE_LABEL = { yeni: 'Yeni', degisti: 'Değişti', ayni: 'Değişmedi' };
const LEVEL_NAME = { buyuk: 'Büyük', kucuk: 'Küçük', yama: 'Yama' };

async function openPackage(name, from) {
  S.pkReturn = from || 'tree';
  openModal({ title: 'Paket: ' + name, wide: true, html: '<p class="hint">Yükleniyor…</p>', noFocus: true, onClose: pkClosed });
  S.pk = { name, msg: null };
  await pkLoad();
}

function pkClosed() {
  const name = S.pk && S.pk.name; const from = S.pkReturn;
  S.pk = null;
  // Odak yalnızca kullanıcı pencereyi kapattıysa (başka bir yere gidilmediyse) giriş noktasına döner.
  setTimeout(() => {
    const ae = document.activeElement;
    if (ae && ae !== document.body) return;
    if (from === 'panel') { const b = $('.actions [data-act="market"]'); if (b) b.focus(); return; }
    const it = Array.from(S.modelMap.values()).find((x) => x.kind === 'plugin' && x.mp === activeName() && FM.slug(x.node.name) === name);
    if (it) focusKey(it.key);
  }, 0);
}

async function pkLoad() {
  const pk = S.pk; if (!pk) return;
  try {
    const d = await get('/api/package?' + qs({ name: pk.name }));
    if (S.pk !== pk) return;
    pk.d = d;
    const b = $('#mBody'); if (!b) return;
    b.innerHTML = pkHtml(d);
    const h = $('#pkHead'); if (h && !pk.noFocus) h.focus();
    pk.noFocus = true;
    pkValidate();
  } catch (e) { closeModal(); fail(e); }
}

// Seçilebilir sürüm seçenekleri: [{ id, label, value }]
function pkOptions(d) {
  const p = d.proposal; const base = d.baseVersion;
  if (!base) return [{ id: 'ilk', label: 'İlk sürüm ' + Rules.DEFAULT_VERSION + ' (önerilen)', value: Rules.DEFAULT_VERSION }];
  if (p.tagOnly) return [{ id: 'etiket', label: 'Mevcut ' + base + ' sürümünü etiketle (önerilen)', value: base }];
  return Rules.VERSION_LEVELS.map((lv) => ({ id: lv, label: LEVEL_NAME[lv] + ' ' + Rules.bumpVersion(base, lv) + (p.level === lv ? ' (önerilen)' : ''), value: Rules.bumpVersion(base, lv) }));
}

function pkHtml(d) {
  const pk = S.pk;
  const opts = pkOptions(d);
  const sel = d.proposal.tagOnly || !d.baseVersion ? opts[0].id : (d.proposal.level || 'yama');
  const dirty = d.dirty || [];
  const blockers = d.issues || [];
  const hasRemote = !!d.remote;
  const msg = pk.msg ? `<div class="issue ${pk.msg.kind}" role="alert">${esc(pk.msg.text)}${pk.msg.retry ? ' <button class="btn sm" data-act="pk-push">Tekrar dene</button>' : ''}</div>` : '';
  const rows = d.prompts.map((p) => `<tr><td><button class="link" data-act="open-close" data-path="${esc(p.source)}">${esc(p.baslik || p.source)}</button></td><td>${esc(p.tur)}</td><td><code>/${esc(d.name)}:${esc(p.ad)}</code></td>
      <td>${esc(p.oldVersiyon || '')}${p.oldVersiyon || p.versiyon ? ' → ' : ''}${esc(p.versiyon || '—')}${p.tagged === false ? ' <span class="pill warn">Etiketsiz</span>' : ''}</td>
      <td><span class="pill ${p.change === 'ayni' ? '' : 'warn'}">${CHANGE_LABEL[p.change]}</span></td><td>${p.level ? esc(LEVEL_NAME[p.level]) : '—'}</td></tr>`
    + p.issues.filter((i) => i.code === 'surumArtirilmamis').map((i) => `<tr><td colspan="6" class="issue warn">${esc(i.msg)}</td></tr>`).join('')).join('')
    + d.removed.map((r) => `<tr><td colspan="3" class="mono">${esc(r.target)}</td><td>—</td><td><span class="pill bad">Kaldırıldı</span></td><td>${esc(LEVEL_NAME[r.level])}</td></tr>`).join('');
  return `<h2 id="pkHead" tabindex="-1" style="margin:0 0 6px">Paket: ${esc(d.name)}</h2>
    <p class="hint" style="margin:0 0 8px">Etkin marketplace: <b>${esc(activeName())}</b> · Sürüm: ${d.version ? 'v' + esc(d.version) : 'yayınlanmadı'} · Son etiket: ${d.lastTag ? esc(d.lastTag.name) + ' (' + esc(fmtDate(d.lastTag.date)) + ')' : 'yok'}
      ${d.pendingPush ? ' <span class="pill warn">Push bekliyor</span> <button class="btn sm" data-act="pk-push">Push et</button>' : ''}</p>
    ${msg}
    <div class="inline" style="margin-bottom:10px"><label class="grow pkdesc">Açıklama<input id="pkDesc" value="${esc(d.description)}" autocomplete="off"></label><button class="btn sm" data-act="pk-desc">Kaydet</button></div>
    ${blockers.length ? `<div class="issue error" role="alert"><b>Yayını engelleyen sorunlar (${blockers.length})</b><ul>${blockers.map((i) => `<li>${i.source ? `<button class="link" data-act="open-close" data-path="${esc(i.source)}">${esc(i.source)}</button>: ` : ''}${esc(i.msg)}${i.code === 'paketUyusmuyor' && i.source ? ` <button class="btn sm" data-act="pk-esitle" data-path="${esc(i.source)}">Alanı klasöre eşitle</button>` : ''}</li>`).join('')}</ul></div>` : ''}
    <table class="ptable"><caption>Paketteki promptlar</caption><thead><tr><th scope="col">Prompt</th><th scope="col">Tür</th><th scope="col">Ad</th><th scope="col">Versiyon</th><th scope="col">Değişim</th><th scope="col">Seviye</th></tr></thead><tbody>${rows || '<tr><td colspan="6">Pakette dışa aktarılacak prompt yok.</td></tr>'}</tbody></table>
    <details style="margin:10px 0"><summary>Dışa aktarılmayanlar (${d.excluded.length})</summary><ul>${d.excluded.map((x) => `<li><button class="link" data-act="open-close" data-path="${esc(x.source)}">${esc(x.baslik || x.source)}</button> <span class="hint">${esc(x.reason)}</span></li>`).join('') || '<li class="hint">Yok</li>'}</ul></details>
    <fieldset class="pkrel"><legend>Yeni sürüm</legend>
      <div class="stack">
        ${opts.map((o) => `<label class="inline"><input type="radio" name="pkLevel" value="${esc(o.value)}" data-id="${esc(o.id)}" ${o.id === sel ? 'checked' : ''}> ${esc(o.label)}</label>`).join('')}
        <label class="inline"><input type="radio" name="pkLevel" value="" data-id="ozel" ${!opts.some((o) => o.id === sel) ? 'checked' : ''}> Özel <input id="pkCustom" placeholder="1.2.3" autocomplete="off" aria-describedby="pkVerErr" style="width:110px"></label>
        <div id="pkVerErr" class="issue error" role="alert" hidden></div>
        <div class="hint">${esc(d.proposal.reasons.join(' · '))}</div>
        <label>Katalog sürümü <input id="pkCat" value="${esc(d.marketplaceVersion.proposal || d.marketplaceVersion.current)}" autocomplete="off" aria-describedby="pkCatErr" style="width:110px"></label>
        <div class="hint">Mevcut: ${esc(d.marketplaceVersion.current)}. "Marketplace'i güncelle" bunu artırmaz.</div>
        <div id="pkCatErr" class="issue error" role="alert" hidden></div>
        <label class="inline"><input type="checkbox" id="pkPush" ${hasRemote ? 'checked' : 'disabled'} aria-describedby="pkPushWhy"> Push et${hasRemote ? ' (' + esc(d.remote) + ')' : ''}</label>
        <div class="hint" id="pkPushWhy">${hasRemote ? '' : 'Uzak depo yok, yerelde yayınlanacak.'}</div>
        ${dirty.length ? `<div class="issue warn" role="alert">Önce kaydet (commit): ${dirty.slice(0, 5).map(esc).join(', ')}${dirty.length > 5 ? ' …' : ''} <button class="btn sm" data-act="pk-git">Git panelini aç</button></div>` : ''}
        <div class="foot-left"><button class="btn primary" id="pkGo" data-act="pk-publish" aria-describedby="pkWhy">${d.proposal.tagOnly ? esc(d.baseVersion) + ' sürümünü etiketle' : 'Yayınla'}</button><span class="hint" id="pkWhy"></span></div>
        <div id="pkConfirm" aria-live="assertive"></div>
        <div id="pkProg" aria-live="polite" class="hint"></div>
      </div></fieldset>`;
}

// Seçili sürüm: { value, custom }
function pkChosen() {
  const r = $$('input[name="pkLevel"]').find((x) => x.checked);
  if (!r) return { value: '', custom: false };
  return r.dataset.id === 'ozel' ? { value: ($('#pkCustom').value || '').trim(), custom: true } : { value: r.value, custom: false };
}

// Anında doğrulama; Yayınla düğmesini ve nedenini günceller. Geçerliyse true.
function pkValidate() {
  const pk = S.pk; const d = pk && pk.d; if (!d || !$('#pkGo')) return false;
  const ch = pkChosen();
  const why = [];
  let verErr = '';
  if (ch.custom || d.baseVersion) {
    verErr = Rules.checkVersion(ch.value) || '';
    if (!verErr && d.baseVersion) {
      const cmp = Rules.compareVersions(ch.value, d.baseVersion);
      if (cmp < 0 || (cmp === 0 && !d.proposal.tagOnly)) verErr = 'Sürüm son yayından (' + d.baseVersion + ') büyük olmalı';
    }
    if (!verErr && d.tags.some((t) => t.version === ch.value)) verErr = 'Bu sürümün etiketi zaten var: paket/' + d.name + '/v' + ch.value;
  }
  const cat = ($('#pkCat').value || '').trim();
  let catErr = Rules.checkVersion(cat) || '';
  if (!catErr && Rules.compareVersions(cat, Rules.coerceVersion(d.marketplaceVersion.current).version || '0.0.0') < 0) catErr = 'Katalog sürümü mevcut sürümden (' + d.marketplaceVersion.current + ') küçük olamaz';
  showFieldErr('pkVerErr', verErr); showFieldErr('pkCatErr', catErr);
  const cu = $('#pkCustom'); if (cu) { if (verErr && ch.custom) cu.setAttribute('aria-invalid', 'true'); else cu.removeAttribute('aria-invalid'); }
  if ((d.issues || []).length) why.push('Önce engelleyici sorunları gider.');
  if ((d.dirty || []).length) why.push('Önce kaydedilmemiş dosyaları commit et.');
  if (!d.exportedCount) why.push('Pakette yayınlanacak prompt yok.');
  if (d.proposal.noChange && !ch.custom) why.push('Son yayından beri değişiklik yok.');
  if (verErr) why.push(verErr);
  if (catErr) why.push(catErr);
  $('#pkGo').disabled = why.length > 0;
  $('#pkWhy').textContent = why.join(' ');
  return why.length === 0;
}

// Yayınla: onay bilgisi sayfa içinde gösterilir (pencere değişmez).
function pkAsk() {
  const pk = S.pk; const d = pk && pk.d; if (!d || !pkValidate()) return;
  const ch = pkChosen(); const cat = $('#pkCat').value.trim(); const push = !!$('#pkPush').checked && !$('#pkPush').disabled;
  const w = d.prompts.filter((p) => p.change !== 'ayni').length; const rm = d.removed.length;
  const text = `${d.name} ${ch.value} olarak yayınlanacak: ${w} dosya yazılacak, ${rm} dosya kaldırılacak, katalog sürümü ${cat}, commit + paket/${d.name}/v${ch.value} etiketi${push ? ', ' + d.remote + "'e push" : ''}.`;
  pk.pending = { version: ch.value, marketplaceVersion: cat, push };
  $('#pkConfirm').innerHTML = `<div class="issue warn" role="alert">${esc(text)}</div><div class="foot-left"><button class="btn primary" data-act="pk-confirm" id="pkOk">Onayla ve yayınla</button><button class="btn" data-act="pk-cancel">Vazgeç</button></div>`;
  $('#pkOk').focus();
}

async function pkPublish() {
  const pk = S.pk; const d = pk && pk.d; if (!d || !pk.pending) return;
  const body = { name: d.name, ...pk.pending };
  $('#pkConfirm').innerHTML = '';
  const go = $('#pkGo'); if (go) go.disabled = true;
  const steps = ['Doğrulanıyor ve çıktı yazılıyor…', 'Commit ve etiket atılıyor…'].concat(body.push ? ['Push ediliyor…'] : []);
  let i = 0;
  const prog = $('#pkProg'); if (prog) prog.textContent = steps[0];
  const tick = setInterval(() => { i = Math.min(i + 1, steps.length - 1); const p2 = $('#pkProg'); if (p2) p2.textContent = steps[i]; }, 1500);
  try {
    const r = await api('POST', '/api/package/publish', body);
    clearInterval(tick);
    toast(d.name + ' ' + r.version + ' yayınlandı' + (r.push && r.push.ok ? ', push edildi' : ''), 'ok', 4000);
    if (S.pk) S.pk.msg = r.push && !r.push.ok ? { kind: 'warn', text: 'Yerelde yayınlandı, push bekliyor: ' + r.push.error, retry: true } : null;
    afterWrite(); if (S.cur && S.cur.tab === 'hist') loadHistory();
  } catch (e) {
    clearInterval(tick);
    if (S.pk) S.pk.msg = { kind: 'error', text: e.message + (e.data && e.data.needIdentity ? ' (Git panelinden kimliği gir)' : '') };
  }
  if (S.pk) { S.pk.pending = null; S.pk.noFocus = false; await pkLoad(); }
}

async function pkPushOnly() {

  try {
    const r = await api('POST', '/api/git/push', {});
    pk.msg = r.ok ? { kind: 'info', text: 'Push edildi.' } : { kind: 'warn', text: 'Push başarısız: ' + r.error, retry: true };

  } catch (e) { pk.msg = { kind: 'error', text: e.message }; }

async function pkAlignField(path) {

/* ------------------------------------------------------- uzak depo (Aşama 4) */
const PROVIDER_LABEL = { github: 'GitHub', gitlab: 'GitLab', diger: 'Diğer' };

async function paintGitRemote() {
  const body = $('#mBody');
  if (!S.git.isRepo) return paintGit();
  const tok = S.glTok = (S.glTok || 0) + 1;
  body.innerHTML = gitTabs('remote') + '<div id="rmBody"><p class="hint">Yükleniyor…</p></div>';
  let r;
  try { r = await get('/api/git/remotes'); } catch (e) { if (tok === S.glTok && $('#rmBody')) $('#rmBody').innerHTML = `<p class="issue error">${esc(e.message)}</p>`; return; }
  if (tok !== S.glTok || !$('#rmBody')) return;
  S.remote = r;
  const lc = r.lastCheck;
  const time = lc && lc.at ? new Date(lc.at).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) : null;
  const canPull = r.behind > 0 && r.ahead === 0;
  const whyNo = !r.remotes.length ? 'Uzak depo tanımlı değil.' : r.behind === 0 ? 'Uzak depoda yeni commit yok.' : r.ahead > 0 ? 'Yerelde push edilmemiş commit var ve uzak depo da ilerlemiş; bu araç birleştirme yapmaz.' : '';
  const hasR = r.remotes.length > 0;
  $('#rmBody').innerHTML = `<p class="hint" style="margin:0">Etkin depo: <b>${esc(activeName())}</b></p>
    ${r.remotes.length ? `<div class="mklist">${r.remotes.map((x) => `<div class="mkrow"><div><b>${esc(x.name)}</b> <span class="pill">${PROVIDER_LABEL[x.provider]}</span><div class="hint mono">${esc(x.url)}</div></div><div></div><div class="mkbtns"><button class="btn sm" data-act="remote-edit" data-name="${esc(x.name)}" data-url="${esc(x.url)}">Düzenle</button></div></div>`).join('')}</div>` : '<p class="hint">Henüz uzak depo yok. Aşağıdan GitHub ya da GitLab linkini ekle.</p>'}
    <form class="stack" id="rmAdd" novalidate style="margin:10px 0"><h3>Uzak depo ekle</h3>
      <div class="inline"><label>Ad<input id="rmName" value="${r.remotes.length ? '' : 'origin'}" autocomplete="off" style="width:110px"></label><label class="grow">URL<input id="rmUrl" autocomplete="off" aria-describedby="rmUrlHint rmErr" placeholder="https://github.com/kullanıcı/depo"></label><button class="btn" data-act="remote-add">Ekle</button></div>
      <div class="hint" id="rmUrlHint">GitHub: https://github.com/kullanıcı/depo ya da git@github.com:kullanıcı/depo.git · GitLab: https://gitlab.com/grup/proje ya da git@gitlab.com:grup/proje.git</div>
      <div class="issue error" id="rmErr" role="alert" hidden></div></form>
    ${hasR ? `<h3>Durum</h3><p>Dal <b>${esc(r.branch || '?')}</b>${r.upstream ? ' → ' + esc(r.upstream) : ''} · ${r.ahead} önde · ${r.behind} geride${time ? ' (son kontrol: ' + esc(time) + ')' : ''}</p>
      ${lc && lc.ok === false ? `<div class="issue warn" role="status">Son kontrol başarısız: ${esc(lc.error || '')}</div>` : ''}
      ${r.pendingTags.length ? `<p class="issue warn">Push bekleyen etiketler: ${r.pendingTags.map(esc).join(', ')}</p>` : ''}
      <div class="inline"><button class="btn primary" data-act="remote-push">Push et</button><button class="btn" data-act="remote-fetch">Kontrol et</button>
        <button class="btn" data-act="remote-pull" ${canPull ? '' : 'disabled'} aria-describedby="rmWhy">Güncelle (yalnızca ileri sarma)</button></div>
      <div class="hint" id="rmWhy">${esc(canPull ? 'Uzak depodaki ' + r.behind + ' yeni commit ileri sarma ile alınır; birleştirme commit\'i üretilmez.' : whyNo)}</div>
      <div id="rmMsg" aria-live="polite"></div>
      ${lc && lc.newCommits && lc.newCommits.length ? `<h3>Yeni commit'ler</h3><ul>${lc.newCommits.map((c) => `<li>${esc(c.subject)} <span class="hint">${esc(c.short)}, ${esc(fmtDate(c.date))}</span></li>`).join('')}</ul>` : ''}
      ${lc && lc.newTags && lc.newTags.length ? `<h3>Yeni etiketler</h3><ul>${lc.newTags.map((t) => `<li><code>${esc(t)}</code></li>`).join('')}</ul>` : ''}` : ''}`;
}

function rmMsg(html, kind) {
  const m = $('#rmMsg'); if (m) m.innerHTML = `<div class="issue ${kind || 'warn'}" role="alert">${html}</div>`;
}

async function remoteAdd() {
  const name = $('#rmName').value.trim(); const raw = $('#rmUrl').value.trim();
  showFieldErr('rmErr', '');
  const ne = Rules.checkRemoteName(name);
  if (ne) { showFieldErr('rmErr', ne); $('#rmName').focus(); return; }
  const n = Rules.normalizeRepoUrl(raw);
  if (n.error) { showFieldErr('rmErr', n.error); $('#rmUrl').focus(); return; }
  try { await api('POST', '/api/git/remotes', { name, url: n.url }); toast('Uzak depo eklendi'); await paintGitRemote(); } catch (e) { showFieldErr('rmErr', e.message); }
}

async function remoteEdit(name, url) {
  const v = await askText({ title: 'Uzak depo adresini düzenle: ' + name, label: 'URL', value: url, ok: 'Kaydet' });
  if (!v) { await paintGitRemote(); return; }
  const n = Rules.normalizeRepoUrl(v);
  if (n.error) { toast(n.error, 'error'); await openGit('remote'); return; }
  try { await api('PUT', '/api/git/remotes', { name, url: n.url }); toast('Adres güncellendi'); } catch (e) { fail(e); }
  await openGit('remote');
}

function netErrHtml(r) {
  return esc(r.error) + (r.code === 'reddedildi' ? ' ' + cmdLine('git -C ' + (S.info.root || '') + ' pull --rebase') : '');
}

async function remotePush() {
  try {
    const r = await api('POST', '/api/git/push', {});
    if (r.ok) { toast('Push edildi'); await paintGitRemote(); loadGit(); } else rmMsg(netErrHtml(r));
  } catch (e) { rmMsg(esc(e.message), 'error'); }
}

async function remoteFetch(manual) {
  try {
    const r = await api('POST', '/api/git/fetch', {});
    S.remoteCheck = r; paintRemoteBadge(); paintRemoteBand();
    if (!r.ok) { if ($('#rmMsg')) rmMsg(netErrHtml(r)); else toast(r.error, 'error'); return r; }
    if (manual) toast(r.behind ? r.behind + ' yeni commit var' : 'Uzak depo güncel');
    if ($('#rmBody')) await paintGitRemote();
    return r;
  } catch (e) { fail(e); }
}

// Yalnızca ileri sarma. Şeritten ve Uzak depo sekmesinden aynı eylem.
async function remotePull() {
  try {
    const r = await api('POST', '/api/git/pull', {});
    toast('Güncellendi' + (r.adoptedTags.length ? ': ' + r.adoptedTags.length + ' yeni etiket' : ''));
    S.remoteCheck = { ok: true, behind: 0, ahead: 0, newTags: [], newCommits: [], checkedAt: new Date().toISOString() };
    paintRemoteBadge(); paintRemoteBand();
    await afterWrite(); if (S.cur && S.cur.tab === 'hist') loadHistory();
    if ($('#rmBody')) await paintGitRemote();
  } catch (e) {
    const c = e.data && e.data.code;
    let html = esc(e.message);
    if (c === 'kirliCalismaAgaci') html = 'Önce değişiklikleri commit et. <button class="btn sm" data-act="git-tab" data-tab="changes">Değişiklikler sekmesini aç</button>';
    else if (c === 'ayristi') html = esc('Yerelde push edilmemiş commit var ve uzak depo da ilerlemiş. Bu araç birleştirme yapmaz.') + cmdLine('git -C ' + (S.info.root || '') + ' pull --rebase');
    if ($('#rmMsg')) rmMsg(html);
    else { toast(e.message, 'error', 8000); if (c === 'kirliCalismaAgaci' || c === 'ayristi') openGit('remote'); }
  }
}

/* arka plan kontrolü, rozet ve şerit */
async function backgroundRemoteCheck() {
  if (!setupOk()) return;
  const gen = S.gen;
  try {
    const r = await api('POST', '/api/git/fetch', { background: true });
    if (gen !== S.gen) return;
    if (r.skipped || r.code === 'remoteYok' || r.code === 'mesgul') { S.remoteCheck = null; }
    else S.remoteCheck = r;
  } catch (e) { return; }
  paintRemoteBadge(); paintRemoteBand();
}

function paintRemoteBadge() {
  const b = $('#gitDown'); if (!b) return;
  const r = S.remoteCheck;
  if (!r || !setupOk()) { b.hidden = true; return; }
  if (r.ok === false) { b.hidden = false; b.className = 'badge warn'; b.textContent = '?'; b.title = 'Uzak depo kontrol edilemedi, elle kontrol et'; b.setAttribute('aria-label', b.title); return; }
  const n = r.behind || 0;
  b.hidden = !n; b.className = 'badge'; b.textContent = '↓' + n; b.title = 'Uzak depoda ' + n + ' yeni commit var'; b.setAttribute('aria-label', b.title);
}

function paintRemoteBand() {
  const old = $('#remoteBand'); if (old) old.remove();
  const r = S.remoteCheck;
  if (!r || r.ok === false || !setupOk()) return;
  const at = r.checkedAt || r.at || '';
  if (!(r.behind > 0 || (r.newTags && r.newTags.length))) return;
  if (ls.get(lsKey('dismissedCheck'), '') === at) return;
  const band = document.createElement('div');
  band.id = 'remoteBand'; band.className = 'warnband'; band.setAttribute('role', 'status');
  const parts = [];
  if (r.behind) parts.push(r.behind + ' commit');
  if (r.newTags && r.newTags.length) parts.push(r.newTags.slice(0, 3).join(', ') + (r.newTags.length > 3 ? ' …' : ''));
  band.innerHTML = `<div style="flex:1">Uzak depoda yeni sürüm var: ${esc(parts.join(', '))}. <button class="link" data-act="remote-details">Ayrıntılar</button> <button class="btn sm" data-act="remote-pull" ${r.behind > 0 ? '' : 'disabled'}>Güncelle</button></div><button class="btn sm ghost" data-act="remote-band-close" aria-label="Bildirimi kapat">Kapat</button>`;
  $('#main').prepend(band);
}

const ACTION_LABEL = { ayarlar: 'Ayarları aç', yeniMarketplace: 'Yeni marketplace', marketplaceSec: 'Ağaçtan seç', gitBaslat: "Git'i başlat", ppConfigOlustur: 'Ayar dosyası oluştur' };

function issueButton(i) {
  if (i.action === 'ayarlar') return '<button class="btn sm" data-act="settings">' + ACTION_LABEL.ayarlar + '</button>';
  if (i.action === 'yeniMarketplace') return '<button class="btn sm primary" data-act="new-mp">' + ACTION_LABEL.yeniMarketplace + '</button>';
  if (i.action === 'marketplaceSec') return '<button class="btn sm primary" data-act="pick-mp">' + ACTION_LABEL.marketplaceSec + '</button>';
  if (i.action === 'gitBaslat') return `<button class="btn sm primary" data-act="mk-git-init" data-confirm data-name="${esc(S.info.activeMarketplace)}">${ACTION_LABEL.gitBaslat}</button>`;
  if (i.action === 'ppConfigOlustur') return '<button class="btn sm" data-act="mk-ppconfig" data-name="' + esc(S.info.activeMarketplace) + '">' + ACTION_LABEL.ppConfigOlustur + '</button>';

}

function renderSetup() {

  $('#main').innerHTML = `<div class="start"><h1 id="setupTitle" tabindex="-1">Kuruluma devam et</h1>

    <ul class="setup-list">${st.issues.map((i) => `<li><span class="pill ${i.level === 'error' ? 'bad' : 'warn'}">${i.level === 'error' ? 'Hata' : 'Uyarı'}</span><span class="msg">${esc(i.message)}</span>${issueButton(i)}</li>`).join('')}</ul>

// Library kökü hazır ama etkin marketplace yok: ağaçtan seçilir.
function renderPick() {
  const codes = S.info.setup.issues.map((i) => i.code);
  if (!codes.includes('marketplaceSecilmedi') && !codes.includes('marketplaceYok')) { renderSetup(); return; }
  const none = codes.includes('marketplaceYok');

function paintWarnBand() {
  const old = $('#warnBand'); if (old) old.remove();
  if (!setupOk() || S.warnHidden) return;
